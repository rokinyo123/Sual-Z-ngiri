<!DOCTYPE html>
<html lang="az" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almond · Giriş (sınaq)</title>
<meta name="theme-color" content="#0f0a07">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Serif:wght@600;700&display=swap">
<style>
/* Giriş ekranı — sınaq: zəncirdən asılan lampa; zənciri çəkəndə lampa yanır, "Almond" hərfləri halqalarla birləşir, giriş forması açılır */
:root{
  --night:#0f0a07; --night-2:#1a120c; --cream:#FFF3E0; --muted:#b59a80;
  --gold:#E9B45A; --gold-2:#F7D594; --brown:#5C2E0E; --line:rgba(255,230,190,.14);
  --light:255,198,120;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:"Noto Sans",system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:relative;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:0 16px 32px;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 0%, var(--night-2), var(--night) 70%)}

/* lampa */
.lamp{position:relative;width:200px;height:250px;flex:none;z-index:3}
.lamp svg{width:100%;height:100%;overflow:visible}
.lamp .swing{transform-origin:100px 0;animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.bulb{fill:#4a3a2a;transition:fill .25s}
.bulb-glow{opacity:0;transition:opacity .35s}
.on .bulb{fill:#FFE7B3}
.on .bulb-glow{opacity:1}
.shade-in{fill:#2a1d13;transition:fill .35s}
.on .shade-in{fill:#7a5320}

/* çəkilən zəncir */
.pull{cursor:grab;touch-action:none;outline:none}
.pull:active{cursor:grabbing}
.pull .knob{fill:var(--gold);stroke:#7a5320;stroke-width:1.5}
.pull:focus-visible .knob{stroke:#fff;stroke-width:3}
.pull .bead{fill:#8d6a3d}
.pull-hit{fill:transparent}

/* işıq konusu */
.cone{position:absolute;left:50%;top:176px;width:min(150vw,1100px);height:120vh;transform:translateX(-50%);pointer-events:none;z-index:1;
  background:radial-gradient(60% 55% at 50% 0%, rgba(var(--light),.38), rgba(var(--light),.12) 45%, transparent 75%);
  clip-path:polygon(calc(50% - 64px) 0,calc(50% + 64px) 0,100% 100%,0 100%);opacity:0;transition:opacity .5s ease;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 45%,transparent 95%);mask-image:linear-gradient(180deg,#000 0,#000 45%,transparent 95%)}
.on .cone{opacity:1}
.floor{position:absolute;left:50%;bottom:-30vh;width:120vw;height:60vh;transform:translateX(-50%);border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side, rgba(var(--light),.12), transparent);opacity:0;transition:opacity .8s .1s}
.on .floor{opacity:1}

/* hint */
.hint{margin-top:2px;font-size:13px;color:var(--muted);letter-spacing:.3px;z-index:3;transition:opacity .3s;display:flex;align-items:center;gap:6px}
.hint .arr{display:inline-block;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.on .hint{opacity:0;pointer-events:none}

/* Almond — hərflər və halqalar */
.word{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:0;margin:22px 0 4px;font-family:"Noto Serif",Georgia,serif;font-weight:700;
  font-size:clamp(40px,12vw,64px);line-height:1;letter-spacing:.5px}
.word .ch{color:rgba(255,236,205,.07);transition:color .45s ease, text-shadow .45s ease, transform .45s cubic-bezier(.2,.8,.2,1);transform:translateY(6px)}
.word .lk{width:.42em;height:.42em;margin:0 -.02em;opacity:0;transform:scale(.4) rotate(-30deg);transition:opacity .3s ease, transform .35s cubic-bezier(.2,1.4,.4,1)}
.word .lk path{fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round}
.lit .word .ch{color:var(--gold-2);text-shadow:0 0 18px rgba(var(--light),.55),0 2px 0 #5a3a12;transform:none}
.lit .word .lk{opacity:1;transform:none}
.done .word{animation:pulse .7s ease}
@keyframes pulse{40%{filter:drop-shadow(0 0 14px rgba(var(--light),.8)) brightness(1.15)}}
.tag{z-index:3;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .5s .2s}
.lit .tag{opacity:.9}

/* giriş forması */
.form{position:relative;z-index:3;width:100%;max-width:360px;margin-top:22px;padding:20px;border-radius:16px;
  background:rgba(32,22,15,.72);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 20px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px;
  opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;transition:opacity .45s ease .15s, transform .5s cubic-bezier(.2,.8,.2,1) .15s}
.open .form{opacity:1;transform:none;pointer-events:auto}
.form h2{font-family:"Noto Serif",Georgia,serif;font-size:20px;color:var(--cream)}
.form .sub{font-size:13px;color:var(--muted);margin-top:-6px}
.form label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.form select,.form input{width:100%;font:inherit;font-size:16px;color:var(--cream);background:rgba(15,10,7,.6);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.form select:focus,.form input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,180,90,.18)}
.form select option{background:#1a120c;color:var(--cream)}
.pin{letter-spacing:10px;text-align:center;font-weight:700}
.pin::placeholder{letter-spacing:1px;font-weight:400;color:#7d6553}
.btn{font:inherit;font-weight:700;font-size:16px;color:#2a1708;background:linear-gradient(180deg,var(--gold-2),var(--gold));border:0;border-radius:10px;padding:12px;cursor:pointer;box-shadow:0 6px 18px rgba(233,180,90,.25)}
.btn:active{transform:translateY(1px)}
.note{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.skip{z-index:3;margin-top:14px;font-size:12px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;font:inherit;font-size:12px}
.open .skip{display:none}
.badge{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:5;font-size:11px;font-weight:700;color:#2a1708;background:var(--gold);border-radius:999px;padding:3px 9px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="badge">SINAQ</div>
<main class="stage" id="stage">
  <div class="cone" aria-hidden="true"></div>
  <div class="floor" aria-hidden="true"></div>

  <div class="lamp" aria-hidden="false">
    <svg viewBox="0 0 200 250" role="img" aria-label="Zəncirdən asılan lampa">
      <defs>
        <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#FFF4D6" stop-opacity="1"/>
          <stop offset=".35" stop-color="#FFD48A" stop-opacity=".75"/>
          <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#1c130c"/><stop offset=".45" stop-color="#3a2717"/><stop offset="1" stop-color="#140d08"/>
        </linearGradient>
      </defs>
      <g class="swing">
        <!-- asma zəncir -->
        <g id="hang" fill="none" stroke="#6b5136" stroke-width="3"></g>
        <!-- papaq -->
        <rect x="90" y="108" width="20" height="14" rx="3" fill="#2a1d13" stroke="#6b5136" stroke-width="1.5"/>
        <path d="M100 118 C70 120 42 146 34 178 L166 178 C158 146 130 120 100 118 Z" fill="url(#shade)" stroke="#6b5136" stroke-width="1.5"/>
        <path class="shade-in" d="M42 176 C56 168 144 168 158 176 L166 178 L34 178 Z"/>
        <circle class="bulb-glow" cx="100" cy="182" r="52" fill="url(#bulbGlow)"/>
        <circle class="bulb" cx="100" cy="182" r="12"/>
        <!-- çəkilən zəncir -->
        <g class="pull" id="pull" tabindex="0" role="button" aria-label="Lampanı yandırmaq üçün zənciri çəkin">
          <rect class="pull-hit" x="122" y="168" width="40" height="80"/>
          <g id="beads"></g>
          <circle class="knob" id="knob" cx="142" cy="226" r="7"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="hint" id="hint"><span class="arr">↓</span> Zənciri çəkin</div>

  <h1 class="word" id="word" aria-label="Almond"></h1>
  <div class="tag">Anbar zənciri</div>

  <form class="form" id="lf" autocomplete="on">
    <h2>Daxil olun</h2>
    <div class="sub">Şöbənizi seçin və 4 rəqəmli parolu yazın.</div>
    <label>Şöbə
      <select id="lu">
        <option value="" selected disabled>— Şöbəni seçin —</option>
        <option value="anbar">Anbar</option><option value="inqilab">Anbar (İnqilab)</option><option value="satinalma">Satınalma</option>
        <option value="keyfiyyet">Keyfiyyət</option><option value="texnoloq">Texnoloq</option><option value="rehberlik">Rəhbərlik</option><option value="admin">Admin</option>
      </select>
    </label>
    <label>Parol
      <input id="lp" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="• • • •">
    </label>
    <button class="btn" type="submit">Daxil ol</button>
    <div class="note" id="note"></div>
  </form>
  <button class="skip" id="skip" type="button">Animasiyasız aç</button>
</main>

<script>
const $ = id => document.getElementById(id);
const stage = $("stage"), NS = "http://www.w3.org/2000/svg";

// asma zəncir halqaları (yuxarıdan papağa qədər) və çəkilən zəncirin muncuqları
(function build(){
  const g = $("hang");
  for (let y = -40, k = 0; y < 106; y += 12, k++){
    const e = document.createElementNS(NS, k % 2 ? "rect" : "ellipse");
    if (k % 2){ e.setAttribute("x", 98.5); e.setAttribute("y", y - 1); e.setAttribute("width", 3); e.setAttribute("height", 14); e.setAttribute("rx", 1.5); e.setAttribute("fill", "#6b5136"); e.setAttribute("stroke", "none"); }
    else { e.setAttribute("cx", 100); e.setAttribute("cy", y + 6); e.setAttribute("rx", 4.5); e.setAttribute("ry", 7.5); }
    g.appendChild(e);
  }
  const b = $("beads");
  for (let y = 176; y <= 216; y += 6){ const c = document.createElementNS(NS, "circle"); c.setAttribute("class", "bead"); c.setAttribute("cx", 142); c.setAttribute("cy", y); c.setAttribute("r", 1.9); b.appendChild(c); }
  // "Almond": hərflər və aralarında halqalar
  const w = $("word"), L = "Almond".split("");
  const link = '<svg class="lk" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a4 4 0 0 1 4-4h3a4 4 0 0 1 0 8H8a4 4 0 0 1-4-4z"/><path d="M13 8h3a4 4 0 0 1 0 8h-3a4 4 0 0 1-4-4"/></svg>';
  w.innerHTML = L.map((c, i) => '<span class="ch" aria-hidden="true">' + c + '</span>' + (i < L.length - 1 ? link : "")).join("");
})();

// səslər — brauzerdə yaradılır (fayl yoxdur)
let ac = null;
const audio = () => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); } catch(e){} return ac; };
function click(){ const a = audio(); if (!a) return; const t = a.currentTime;
  const n = a.createBufferSource(), buf = a.createBuffer(1, a.sampleRate * .04, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const g = a.createGain(); g.gain.value = .35; n.buffer = buf; n.connect(g).connect(a.destination); n.start(t);
  const o = a.createOscillator(), og = a.createGain(); o.type = "sine"; o.frequency.setValueAtTime(120, t + .05);
  og.gain.setValueAtTime(.0001, t); og.gain.linearRampToValueAtTime(.05, t + .1); og.gain.exponentialRampToValueAtTime(.0001, t + .4);
  o.connect(og).connect(a.destination); o.start(t + .05); o.stop(t + .42); }
function clink(delay){ const a = audio(); if (!a) return; const t = a.currentTime + (delay || 0);
  [[2200,.12],[3300,.08],[4400,.04]].forEach(([f, v]) => { const o = a.createOscillator(), g = a.createGain(); o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(v, t + .005); g.gain.exponentialRampToValueAtTime(.0001, t + .35);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + .4); }); }

// yandır: lampa → hərflər bir-bir → son halqa "çıq" → forma açılır
let lit = false;
function turnOn(quiet){
  if (lit){ stage.classList.toggle("on"); return; }            // ikinci çəkiş: lampanı söndür / yandır, forma qalır
  lit = true; if (!quiet) click();
  stage.classList.add("on");
  const fast = quiet || matchMedia("(prefers-reduced-motion: reduce)").matches;
  const chs = [...document.querySelectorAll(".word .ch")], lks = [...document.querySelectorAll(".word .lk")];
  const step = fast ? 0 : 85;
  chs.forEach((c, i) => { c.style.transitionDelay = (120 + i * step) + "ms"; });
  lks.forEach((l, i) => { l.style.transitionDelay = (160 + i * step + step / 2) + "ms"; });
  requestAnimationFrame(() => stage.classList.add("lit"));
  const end = fast ? 0 : 120 + chs.length * step + 120;
  if (!quiet) clink(end / 1000);
  setTimeout(() => { stage.classList.add("done", "open"); }, end);
}

// zənciri çəkmək: barmaqla aşağı sürüşdür və ya bas
const pull = $("pull"), knob = $("knob"), beads = $("beads");
let y0 = null, dy = 0;
const setPull = v => { knob.setAttribute("cy", 226 + v); beads.setAttribute("transform", "translate(0," + v * .6 + ")"); };
pull.addEventListener("pointerdown", e => { y0 = e.clientY; dy = 0; pull.setPointerCapture(e.pointerId); audio(); });
pull.addEventListener("pointermove", e => { if (y0 == null) return; dy = Math.max(0, Math.min(34, e.clientY - y0)); setPull(dy); });
const release = () => { if (y0 == null) return; y0 = null;
  const from = dy; const t0 = performance.now();
  (function back(t){ const k = Math.min(1, (t - t0) / 220), v = from * (1 - k) * Math.cos(k * 6); setPull(v); if (k < 1) requestAnimationFrame(back); })(t0);
  turnOn(); };
pull.addEventListener("pointerup", release);
pull.addEventListener("pointercancel", () => { y0 = null; setPull(0); });
pull.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); turnOn(); } });
document.querySelector(".lamp").addEventListener("click", e => { if (!e.target.closest("#pull")) turnOn(); });
$("skip").onclick = () => turnOn(true);
// lampanı yandırmadan yazmağa başlasa — dərhal aç
document.addEventListener("keydown", e => { if (!lit && /^[0-9a-z]$/i.test(e.key)) turnOn(true); });

// sınaq: həqiqi giriş yoxdur
$("lf").onsubmit = e => { e.preventDefault();
  if (!$("lu").value) return ($("note").textContent = "Şöbəni seçin");
  if (!/^\d{4}$/.test($("lp").value)) return ($("note").textContent = "4 rəqəmli parolu yazın");
  $("note").innerHTML = 'Bu sınaq səhifəsidir — bəyənsəniz, əsas proqramın girişi belə olacaq. <a href="./" style="color:var(--gold)">Əsas proqrama keç</a>';
};
</script>
</body>
</html>
