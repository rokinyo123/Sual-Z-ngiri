<!DOCTYPE html>
<html lang="az" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almond Anbar Zənciri</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5C2E0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almond Anbar">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Mono:wght@500&display=swap">
<style>
/* Layout: brown brand band (role + 5 tabs) → one 860px column. Every order is a card with a coloured left stripe
   that says its stage: orange Satınalmada → blue Gözlənilir → green Tam gəldi / red Natamam. Same colours everywhere. */
:root{
  --bg:#F6F1EA; --surface:#FFFFFF; --sunk:#F1E8DC; --line:#E6D9C7;
  --fg:#2B1A10; --muted:#7D6553; --brand:#5C2E0E; --brand-2:#7A4220; --brand-fg:#FFF6EA; --accent:#5C2E0E; --accent-fg:#FFF6EA;
  --buy:#E8590C; --buy-bg:#FFE8D6; --wait:#1C7ED6; --wait-bg:#DBEDFF; --ok:#2B8A3E; --ok-bg:#D3F9D8;
  --bad:#E03131; --bad-bg:#FFE3E3; --warn:#B7791F; --warn-bg:#FFF1BF; --qc:#7048E8; --qc-bg:#E5DBFF; --arch:#868E96; --arch-bg:#EEF0F2;
  --info:#1C7ED6; --info-bg:#DBEDFF;
  --display:"Noto Serif",Georgia,serif; --body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Noto Sans Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17110C; --surface:#211912; --sunk:#2B2118; --line:#3D2F23;
  --fg:#F4E8D8; --muted:#BFA48A; --brand:#3A1D09; --brand-2:#4E2A12; --brand-fg:#FFF1DE; --accent:#E3A66C; --accent-fg:#22140A;
  --buy:#FF8A3D; --buy-bg:#3D2312; --wait:#5AB0FF; --wait-bg:#132B42; --ok:#5FD37A; --ok-bg:#16331D;
  --bad:#FF7070; --bad-bg:#44191A; --warn:#F5C451; --warn-bg:#3A2E10; --qc:#A991FF; --qc-bg:#2A2147; --arch:#A0A7AE; --arch-bg:#2A2D30;
  --info:#5AB0FF; --info-bg:#132B42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17110C; --surface:#211912; --sunk:#2B2118; --line:#3D2F23;
  --fg:#F4E8D8; --muted:#BFA48A; --brand:#3A1D09; --brand-2:#4E2A12; --brand-fg:#FFF1DE; --accent:#E3A66C; --accent-fg:#22140A;
  --buy:#FF8A3D; --buy-bg:#3D2312; --wait:#5AB0FF; --wait-bg:#132B42; --ok:#5FD37A; --ok-bg:#16331D;
  --bad:#FF7070; --bad-bg:#44191A; --warn:#F5C451; --warn-bg:#3A2E10; --qc:#A991FF; --qc-bg:#2A2147; --arch:#A0A7AE; --arch-bg:#2A2D30;
  --info:#5AB0FF; --info-bg:#132B42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{background:var(--brand);color:var(--brand-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 12px rgba(40,15,0,.18)}
@media (max-width:700px){header{position:static}}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:10px 6px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand .bn{display:flex;align-items:baseline;gap:8px}
.clk{font-size:12px;font-weight:600;opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums}
.clk b{font-size:14px;font-weight:700}
@media (max-width:600px){.clk .ckw{display:none}}
@media (max-width:430px){.clk .ckd{display:none} .brand{flex-shrink:0}}
.brand b{font-family:var(--display);font-size:21px;letter-spacing:.2px}
.brand span{font-size:12px;opacity:.75;white-space:nowrap}
@media (max-width:480px){.brand span{display:none}}
.who{display:flex;align-items:center;gap:6px}
.who select{width:auto;max-width:190px;background:var(--brand-2);color:var(--brand-fg);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font-weight:600}
.tabs{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 66px;white-space:nowrap}
.tabs button{background:transparent;border:none;color:var(--brand-fg);opacity:.75;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:600;position:relative}
.tabs button i{font-style:normal;font-size:17px;line-height:1.1}
.tabs button.on{opacity:1;background:rgba(255,255,255,.14)}
.tabs .n{position:absolute;top:2px;right:calc(50% - 24px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}
main.wrap{padding-block:10px 40px;display:flex;flex-direction:column;gap:8px}
h2{font-family:var(--display);font-size:16px;margin:8px 0 0;display:flex;align-items:center;gap:8px;text-wrap:balance}
h2 .cnt{font-family:var(--mono);font-size:13px;background:var(--sunk);color:var(--muted);border-radius:999px;padding:1px 9px}
h3{font-size:15px;margin:0}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
textarea{min-height:48px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--wait);outline-offset:1px}
button{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
button:hover{filter:brightness(.97)}
button.pri{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);font-weight:600}
button.okb{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600}
button.badb{background:transparent;color:var(--bad);border-color:var(--bad)}
button.sm{padding:4px 9px;font-size:13px}
button.big{width:100%;padding:11px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 150px;min-width:0}
.hint{font-size:12px;color:var(--muted)}
.meta{font-size:12px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px;text-align:center;color:var(--muted);font-size:14px}
/* stage colours */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--wait-bg);color:var(--wait)} .p-mute{background:var(--sunk);color:var(--muted)}
.c-buy{background:var(--buy-bg);color:var(--buy)} .c-wait{background:var(--wait-bg);color:var(--wait)} .c-ok{background:var(--ok-bg);color:var(--ok)} .c-bad{background:var(--bad-bg);color:var(--bad)} .c-qc{background:var(--qc-bg);color:var(--qc)} .c-arch{background:var(--arch-bg);color:var(--arch)}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pipe button{border:none;border-radius:10px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;color:#fff}
.pipe b{font-family:var(--mono);font-size:19px;line-height:1}
.pipe span{font-size:12px;font-weight:600;opacity:.95}
.pipe .buy{background:var(--buy)} .pipe .wait{background:var(--wait)} .pipe .bad{background:var(--bad)} .pipe .ok{background:var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pipe button{color:#160d06}}
:root[data-theme="dark"] .pipe button{color:#160d06}
/* order card */
.oc{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--arch);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-width:0}
.oc.s-buy{border-left-color:var(--buy)} .oc.s-wait{border-left-color:var(--wait)} .oc.s-ok{border-left-color:var(--ok)} .oc.s-bad{border-left-color:var(--bad)} .oc.s-qc{border-left-color:var(--qc)}
.oc.act{box-shadow:0 0 0 2px var(--brand) inset, 0 4px 14px rgba(60,25,5,.08)}
.oc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oid{font-family:var(--mono);font-weight:700}
.route{font-weight:600;flex:1 1 auto;min-width:0}
.route i{font-style:normal;color:var(--muted)}
.oc-t{display:flex;flex-direction:column;gap:3px;font-size:13px}
.oc-t .pill{margin-left:4px;vertical-align:1px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.bar i{display:block}
.bar .b-ok{background:var(--ok)} .bar .b-warn{background:var(--warn)} .bar .b-bad{background:var(--bad)} .bar .b-wait{background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.ic{display:inline-flex;align-items:center;gap:5px;font-size:13px;background:var(--sunk);border-radius:8px;padding:3px 8px;max-width:100%}
.ic b{font-family:var(--mono);font-weight:500;font-size:12px}
.ic .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}
.ic.d-ok{background:var(--ok-bg)} .ic.d-ok .dot{background:var(--ok)}
.ic.d-warn{background:var(--warn-bg)} .ic.d-warn .dot{background:var(--warn)}
.ic.d-bad{background:var(--bad-bg)} .ic.d-bad .dot{background:var(--bad)}
.ic.d-wait .dot{background:var(--wait)}
.irows{display:flex;flex-direction:column;gap:6px}
.irow{border:1px solid var(--line);border-radius:9px;padding:5px 8px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.irow.okr{background:var(--ok-bg);border-color:transparent} .irow.warnr{background:var(--warn-bg);border-color:transparent} .irow.miss{background:var(--bad-bg);border-color:transparent}
.irow .in{flex-wrap:wrap;gap:6px}
.irow .q{font-size:13px}
.irow .st{margin-left:auto;font-size:11px}
.spn{font-size:13px;background:var(--wait-bg);border-radius:8px;padding:5px 9px}
.spn.c{background:var(--sunk)}
.alert.info{background:var(--wait-bg);border-color:var(--wait)} .alert.info .al-t{color:var(--wait)}
.tdec{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:9px;padding:8px}
.tdec .seg3 button{flex:1 1 0;padding:9px 6px;font-size:14px}
.tdec .seg3 button.okb{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.tdec .seg3 button.badb{background:var(--surface);border-color:var(--bad);color:var(--bad);font-weight:600}
.alert.note{background:var(--warn-bg);border-color:var(--warn)} .alert.note .al-t{color:var(--fg)}
.alert.res{background:var(--ok-bg);border-color:var(--ok)} .alert.res .al-t{color:var(--ok)}
.cell{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding-top:4px;border-top:1px dashed var(--line)}
.cell.ans{flex-direction:column;align-items:stretch}
.cl{flex:0 0 100%;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.cell.ans .cl{flex:none}
.seg3{display:flex;gap:5px;flex-wrap:wrap}
.seg3 button{padding:6px 10px;font-size:13px;background:var(--surface)}
.seg3 button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg3 button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg3 button.on.none{background:var(--arch);border-color:var(--arch);color:#fff}
.qw{border-color:var(--bad)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.dcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:7px 10px}
.dcard.warn{border-left-color:var(--warn)} .dcard.bad{border-left-color:var(--bad)}
.dcard summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none}
.dcard summary::-webkit-details-marker{display:none}
.dcard .dn{font-weight:700;flex:1}
.dl{margin-top:6px;font-size:13px}
.dli{display:flex;flex-direction:column;gap:2px;margin:3px 0 0 6px;font-size:12px;color:var(--muted)}
.alh{display:flex;align-items:center;justify-content:space-between;font-size:13px}
.logl{display:flex;flex-direction:column;gap:6px;font-size:13px}
.lg{border-bottom:1px dashed var(--line);padding-bottom:5px}
.ic.bad{border-color:var(--bad)}
.box.late{border:1px solid var(--wait);background:var(--wait-bg)}
.chk{gap:6px;font-size:14px}
.adm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:4px}
.ansopt{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:10px;padding:8px;margin-top:6px}
.stk{background:var(--bad-bg,#fde8e8);color:var(--bad,#b42318);border-radius:8px;padding:6px 10px;font-size:13px;margin:4px 0}
.qcf{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;flex:1 1 100%}
.qcf label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.qcf input,.qcf select{font-size:15px}
.qcf .tmp input{border-color:var(--wait)}
.qcf .qby{grid-column:1 / -1}
.qci{font-size:12px}
.whin{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.whin input{width:84px}
.who{border:1px solid var(--line);cursor:pointer;background:var(--surface)}
.who.on{background:var(--qc);border-color:var(--qc);color:#fff}
.tg.on{background:var(--qc);border-color:var(--qc);color:#fff}
.p-qc,.c-chk{background:var(--qc-bg);color:var(--qc)}
.oc.s-chk{border-left-color:var(--qc)}
.pipe{grid-template-columns:repeat(5,1fr)}
.pipe .chk{background:var(--qc)}
.pipe b{font-size:21px}
.pipe span{font-size:11px}
.seg button.f-chk.on{background:var(--qc);border-color:var(--qc);color:#fff}
button[disabled]{opacity:.55;cursor:not-allowed}
.box{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
details.more>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:8px}
.more-in{display:flex;flex-direction:column;gap:8px}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.chain .s{padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chain .s.done{color:var(--ok);border-color:var(--ok)}
.chain .s.cur{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.chain .ar{color:var(--muted)}
.log{font-size:13px;display:flex;flex-direction:column;gap:3px;border-left:2px solid var(--line);padding-left:10px}
/* receiving + reasons */
.rrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-radius:9px;padding:6px 8px;background:var(--surface)}
.rrow{flex-wrap:nowrap}
.rrow .nm{flex:1 1 auto;min-width:0}
.rrow .nm .pill{margin-top:3px;font-size:11px;padding:1px 7px}
.rrow input{width:74px;flex:0 0 auto}
.rrow button{flex:0 0 auto}
.dt{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:6px}
.rrow.okr{background:var(--ok-bg)} .rrow.warnr{background:var(--warn-bg)} .rrow.miss{background:var(--bad-bg)}
.rsn{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-radius:9px;padding:6px 8px}
.rsn.miss{background:var(--bad-bg)} .rsn.warnr{background:var(--warn-bg)}
.rsn input{flex:1 1 200px;min-width:0}
.rs{color:var(--bad);font-size:12px}
.fgrp{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--surface)}
/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.okr td{background:var(--ok-bg)} tr.warnr td{background:var(--warn-bg)} tr.miss td{background:var(--bad-bg)}
/* filters */
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--surface)}
.seg button.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.seg button .k{font-family:var(--mono);font-size:12px;opacity:.8;margin-left:3px}
.seg button.f-buy.on{background:var(--buy);border-color:var(--buy);color:#fff} .seg button.f-wait.on{background:var(--wait);border-color:var(--wait);color:#fff}
.seg button.f-bad.on{background:var(--bad);border-color:var(--bad);color:#fff} .seg button.f-ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
details.rangebar{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
details.rangebar>summary{cursor:pointer;font-size:14px}
details.rangebar[open]{display:flex;flex-direction:column;gap:8px}
/* timeline + week */
.tl{display:flex;flex-direction:column}
.tld{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tld:last-child{border-bottom:none}
.tlday{flex:0 0 64px;display:flex;flex-direction:column;font-family:var(--mono);font-size:14px}
.tlday span{font-family:var(--body);font-size:11px;color:var(--muted)}
.tlf{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chipb{text-align:left;background:var(--wait-bg);border:none;border-radius:9px;padding:4px 9px;font-size:13px;color:var(--fg)}
.chipb b{color:var(--wait)}
.alert{background:var(--bad-bg);border:1px solid var(--bad);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;gap:4px}
.al-t{color:var(--bad);font-size:15px}
.al-m{font-size:13px;color:var(--fg)}
.al-i{font-size:13px;color:var(--muted)}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calh b{font-family:var(--display);font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.cd{min-height:50px;border-radius:9px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line)}
.cd b{font-family:var(--mono);font-size:14px;font-weight:500}
.cd small{font-size:10px;font-weight:700}
.cd i{width:7px;height:7px;border-radius:50%}
.cd.fut{background:var(--bad);border-color:var(--bad);color:#fff}
.cd.done{background:var(--ok);border-color:var(--ok);color:#fff}
.cd.part{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.cd.done small,.cd.part small{font-size:12px}
.cd.today{box-shadow:0 0 0 2px var(--wait) inset}
.cd.sel{outline:3px solid var(--fg);outline-offset:-1px}
.week{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr)) auto;gap:4px;align-items:stretch}
.week>button.nav{padding:4px 6px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.wd b{font-family:var(--mono);font-size:14px;color:var(--fg)}
.wd .dots{display:flex;gap:2px;min-height:8px}
.wd .dots i{width:7px;height:7px;border-radius:50%}

// Ölçünü addan təxmin et: "40*80 penaplast" → 40*80, "D38" → D38, "Kofe tutacağı 12 oz" → 12 oz
function guessSize(n){
  const m = String(n).match(/\d+(?:[.,]\d+)?\s*[*x×\/]{1,2}\s*\d+(?:[.,]\d+)?(?:\s*[*x×\/]\s*\d+(?:[.,]\d+)?)?|\bD\s?\d+|\d+(?:[.,]\d+)?\s*(?:sm|mm|ml|oz|litr|qr|kq)\b/i);
  return m ? m[0].replace(/\s+/g," ") : "";
}

function prepareCatalog(){
  if (S.catalogV===2) return false;
  if (!S.firms || !S.firms.length) S.firms = FIRMS.slice();
  const byN = new Map(S.products.map(p=>[p.name.trim().toLowerCase(), p]));
  const keep = new Set();
  CATALOG.forEach(([n,u])=>{ let p = byN.get(n.toLowerCase());
    if (p){ p.name = n; p.unit = u; delete p.deleted; delete p.fromExcel; }
    else { p = { id:Math.max(0,...S.products.map(x=>x.id))+1, name:n, unit:u, firm:"", size:guessSize(n) }; S.products.push(p); }
    keep.add(p.id); });
  S.products.forEach(p=>{ if (!keep.has(p.id)) p.deleted = true; });
  S.catalogV = 2;
  return true;
}

// Kimdən indi nə gözlənilir
function myWork(){
  return S.orders.filter(o=>{
    if (o.status==="redd") return false;
    if (role==="Satınalma") return o.status==="acik" || lateNeedsAns(o) || held(o);
    if (role==="Keyfiyyət") return o.status==="anbar" && hasQC(o) && !o.qcAt;
    if (role==="Texnoloq") return techPending(o);
    if (isDriver(role)) return o.supplier===role && o.status==="yolda";
    if (WAREHOUSES.includes(role)) return o.wh===role && (o.status==="anbar" || dueNow(o));
    return false;
  }).sort((a,b)=> odate(a).localeCompare(odate(b)) || a.id-b.id);
}

// ----- Fayllar (Excel, PDF və s.) -----
const MAXF = 1.5*1024*1024;
function readFile(f){
  if (f.size > MAXF){ toast(f.name+": demo versiyada 1,5 MB-dan böyük fayl olmaz"); return Promise.resolve(null); }
  return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res({name:f.name,size:f.size,data:r.result,by:role,at:new Date().toISOString()}); r.readAsDataURL(f); });
}
const isSheet = n => /\.(xlsx|xlsm|xls|csv)$/i.test(n);
const fsize = b => b>1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";
// Göndərilmiş sifarişin şəkil/faylını yalnız göndərən silə bilər — Satınalma qəbul edənə qədər
const canEditAtt = o => o.from===role && o.status==="acik";
function fileList(files, key, canDel){
  if (!files.length) return "";
  return '<div class="files">'+files.map((f,i)=>'<div class="file"><span class="fic">'+(isSheet(f.name)?"XLS":(f.name.split(".").pop()||"").slice(0,4).toUpperCase())+'</span><span class="grow"><b>'+esc(f.name)+'</b><span class="meta"> · '+fsize(f.size)+(f.by?' · '+esc(f.by):"")+'</span></span>'+
    (isSheet(f.name)?'<button class="sm" data-view="'+key+':'+i+'">Bax</button>':/\.(jpe?g|png|webp|gif)$/i.test(f.name)?'<a class="sm btnlink" href="'+f.data+'" target="_blank" rel="noopener">Bax</a>':"")+
    '<a class="sm btnlink" href="'+f.data+'" download="'+esc(f.name)+'">Yüklə</a>'+
    (key==="d"?'<button class="sm badb" data-fdel="'+i+'" aria-label="Faylı sil">✕</button>':canDel?'<button class="sm badb" data-ofdel="'+key+':'+i+'" aria-label="Faylı sil">✕</button>':"")+
    '</div><div class="sheet" id="sv-'+key+'-'+i+'" hidden></div>').join("")+'</div>';
}
async function viewSheet(key, i){
  const box = $("sv-"+key+"-"+i);
  if (!box.hidden){ box.hidden = true; return; }
  const f = (key==="d" ? draft.files : S.orders.find(o=>o.id===Number(key)).files)[i];
  if (!window.XLSX){ box.innerHTML='<div class="hint">Excel oxuyucu yüklənmədi. İnternet bağlantısını yoxlayın.</div>'; box.hidden=false; return; }
  try {
    // fayl ya sifarişin içindədir (data:), ya da ortaq fayl yerindədir (link)
    let wb;
    if (/^data:/.test(f.data)) wb = XLSX.read(f.data.split(",")[1], {type:"base64"});
    else { box.innerHTML = '<div class="hint">Yüklənir…</div>'; box.hidden = false; wb = XLSX.read(new Uint8Array(await (await fetch(f.data)).arrayBuffer()), {type:"array"}); }
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false}).slice(0,60);
    box.innerHTML = '<div class="meta">Vərəq: '+esc(wb.SheetNames[0])+(wb.SheetNames.length>1?' (cəmi '+wb.SheetNames.length+' vərəq, birincisi göstərilir)':"")+'</div><div class="tbl"><table>'+
      rows.map(r=>'<tr>'+Array.from(r,c=>'<td>'+esc(c??"")+'</td>').join("")+'</tr>').join("")+'</table></div>';
  } catch(e){ box.innerHTML='<div class="hint">Bu faylı oxumaq olmadı.</div>'; }
  box.hidden = false;
}

// ----- Göndərilmiş sifarişə əlavə (yalnız göndərən, həmin günün sonuna qədər) -----
// Mal qəbulu başlamayıbsa əlavə olunur. Satınalma sifarişi artıq qəbul edibsə, sifariş
// əlavələrlə birlikdə yenidən Satınalmaya qayıdır ki, yeni malları da sifariş etsin.
const addDraft = {};
const canAdd = o => o.from===role && !o.parent && o.created.slice(0,10)===today() && ["acik","yolda"].includes(o.status) && o.items.every(i=>i.got==null);
function addBox(o){
  if (!canAdd(o)) return "";
  const d = addDraft[o.id];
  if (!d) return '<div class="row"><button class="sm" data-addopen="'+o.id+'">+ Sifarişə əlavə et</button><span class="hint">Bu gün 23:59-a qədər mümkündür.</span></div>';
  return '<div class="box"><h3>Sifarişə əlavə</h3>'+datalist()+
    d.map((r,k)=>'<div class="it"><input list="plist" placeholder="Məhsulun adı" data-ad="'+o.id+'-'+k+'-n" value="'+esc(r.n)+'"><input placeholder="məs. 5 kq" data-ad="'+o.id+'-'+k+'-q" value="'+esc(r.q)+'"><button class="sm" data-addrow="'+o.id+'-'+k+'" aria-label="Sil">×</button></div>').join("")+
    '<div class="row"><button class="sm" data-addmore="'+o.id+'">+ Sətir</button></div>'+
    '<div class="hint">'+(o.status==="yolda"?"Satınalma bu sifarişi artıq qəbul edib. Göndərəndə sifariş yeni mallarla birlikdə yenidən Satınalmaya qayıdacaq.":"Sifariş hələ Satınalmadadır, yeni mallar dərhal ona görünəcək.")+'</div>'+
    '<div class="row"><button class="pri" data-addsend="'+o.id+'">Əlavəni göndər</button><button data-addcancel="'+o.id+'">Ləğv et</button></div></div>';
}
function addSend(id){
  const o = S.orders.find(x=>x.id===id), d = addDraft[id] || [];
  if (!canAdd(o)) { delete addDraft[id]; render(); return toast("Bu sifarişə artıq əlavə etmək olmaz"); }
  const rows = d.filter(r=>r.n.trim() || r.q.trim());
  const noQ = rows.find(r=>!r.q.trim());
  if (noQ) return toast(noQ.n+": miqdarı yazın");
  if (!rows.length) return toast("Ən azı bir məhsul yazın");
  if (rows.some(r=>!r.n.trim())) return toast("Malın adını yazın");
  rows.forEach(r=>{ const pid = ensureProd(r.n); r.qq = withUnit(r.q,pid); o.items.push({pid, qty:r.qq, added:true}); });
  const note = rows.map(r=>r.n.trim()+" "+r.qq).join(", ");
  o.addedAt = new Date().toISOString();
  if (o.status==="yolda"){
    o.status = "acik"; o.last_move = o.addedAt;
    addLog(o,"Sifarişə əlavə edildi, yenidən Satınalmaya göndərildi",note);
  } else addLog(o,"Sifarişə əlavə edildi",note);
  delete addDraft[id]; save(); render();
  toast(rows.length+" mal əlavə olundu → Satınalma");
}

// ----- Göndərən sifarişi düzəldir (Satınalma qəbul edənə qədər): miqdar, ad, sil, əlavə -----
const editDraft = {};
function editBox(o){
  const d = editDraft[o.id];
  return '<div class="box items-edit"><h3>Sifarişi düzəlt</h3>'+datalist()+
    d.map((r,k)=>'<div class="it'+(o.from==="Anbar"?" wdep":"")+'"><input list="plist" placeholder="Məhsulun adı" data-ed="'+o.id+'-'+k+'-n" value="'+esc(r.n)+'"><input placeholder="məs. 5 kq" data-ed="'+o.id+'-'+k+'-q" value="'+esc(r.q)+'">'+(o.from==="Anbar"?depSel('data-ed="'+o.id+'-'+k+'-dep"', r.dep||""):"")+'<button class="sm badb" data-edrow="'+o.id+'-'+k+'" aria-label="Malı sil">✕</button></div>').join("")+
    '<div class="row"><button class="sm" data-edmore="'+o.id+'">+ Sətir</button></div>'+
    '<div class="row"><button class="pri" data-edsave="'+o.id+'">Yadda saxla</button><button data-edcancel="'+o.id+'">Ləğv et</button></div></div>';
}
function editSave(id){
  const o = S.orders.find(x=>x.id===id), d = editDraft[id] || [];
  if (!canOwnEdit(o)) { delete editDraft[id]; render(); return toast("Satınalma artıq qəbul edib — dəyişmək olmaz"); }
  const rows = d.filter(r=>r.n.trim() || r.q.trim());
  if (rows.some(r=>!r.n.trim())) return toast("Malın adını yazın");
  const noQ = rows.find(r=>!r.q.trim()); if (noQ) return toast(noQ.n+": miqdarı yazın");
  if (!rows.length) return toast("Heç bir mal qalmadı — sifarişi silmək üçün “🗑 Sil” basın");
  const old = o.items.slice(), before = old.map(i=>pname(i.pid)+" "+i.qty+(i.dep?" → "+i.dep:"")).join(", ");
  o.items = rows.map(r=>{ const pid = ensureProd(r.n), k = old.findIndex(i=>i.pid===pid), base = k>=0 ? old.splice(k,1)[0] : {};
    const x = Object.assign({}, base, {pid, qty:withUnit(r.q,pid)}); if (r.dep) x.dep = r.dep; else delete x.dep; return x; });
  const after = o.items.map(i=>pname(i.pid)+" "+i.qty+(i.dep?" → "+i.dep:"")).join(", ");
  delete editDraft[id];
  if (after!==before){ o.last_move = new Date().toISOString(); addLog(o,"Sifariş düzəldildi",after); save(); toast("Sifariş #"+id+" yeniləndi"); }
  render();
}

// ----- Satınalma: sifarişi qəbul edir, gəliş günü təyin edir -----
// Bir neçə firmanın malı varsa, hər firmaya öz günü verilir və sifariş firmalar üzrə bölünür.
function firmGroups(o){
  const g = {};
  o.items.forEach((i,k)=>{ const f = dest(i) || ""; (g[f] = g[f] || []).push(k); });
  return Object.keys(g).sort((a,b)=>!a?-1:!b?1:isDriver(a)-isDriver(b) || a.localeCompare(b,"az")).map(f=>({firm:f, idx:g[f]}));
}
// Hara göndərmək olar: sürücülər + firmalar
const destOpts = sel => '<option value="">— seçin —</option><optgroup label="Sürücülər (gündəlik)">'+DRIVERS.map(d=>'<option'+(sel===d?" selected":"")+'>'+esc(d)+'</option>').join("")+'</optgroup>'+
  '<optgroup label="Firmalar">'+S.firms.map(f=>'<option'+(sel===f?" selected":"")+'>'+esc(f)+'</option>').join("")+'</optgroup>'+(sel && !isDriver(sel) && !S.firms.includes(sel)?'<option selected>'+esc(sel)+'</option>':"");
const etaDraft = {};   // Satınalmanın seçdiyi günlər (səhifə yenilənəndə itməsin)
const remember = {};
function acceptBox(o){
  const G = firmGroups(o), none = G.find(g=>!g.firm);
  const body = G.map(g=>{
    const key = o.id+"|"+g.firm;
    const head = !g.firm ? '<b class="rs">⚠ Firması yoxdur · '+g.idx.length+' mal — hər birinə firma və ya sürücü seçin</b>'
      : '<div class="pn"><b>'+(isDriver(g.firm)?"🚚 ":"")+esc(g.firm)+'</b><span class="meta">'+g.idx.length+' mal</span></div>'+
        '<input type="date" data-eta="'+esc(key)+'" value="'+(etaDraft[key]||o.eta||(isDriver(g.firm)?today():plusDays(1)))+'" min="'+today()+'" aria-label="Gəliş günü">';
    return '<div class="fgrp">'+head+g.idx.map(k=>{ const i = o.items[k];
      return '<div class="rrow"><span class="nm">'+esc(pname(i.pid))+' <span class="meta mono">'+esc(i.qty)+'</span></span><select data-dest="'+o.id+'-'+k+'" style="width:auto;max-width:48%;padding:4px 6px;font-size:13px" aria-label="Hara">'+destOpts(dest(i))+'</select></div>'; }).join("")+'</div>';
  }).join("");
  return '<div class="box"><div class="lbl">Kimdən, nə vaxt gələcək?</div><div class="hint">Mallar kataloqa görə avtomatik bölünüb. Malı başqa firmaya və ya sürücüyə vermək üçün yanındakı siyahıdan seçin. Hər qrupun gəliş günü ayrıca.</div>'+body+
    '<label class="row meta"><input type="checkbox" data-remember="'+o.id+'"'+(remember[o.id]?" checked":"")+' style="width:auto"> Firma dəyişikliyini kataloqda da yadda saxla</label>'+
    '<input id="spn-'+o.id+'" placeholder="Qeyd (məs. qabartma tozu yenidir, yoxlayın)">'+whoChips("a"+o.id,[o.wh],o)+
    '<button class="pri big" data-act="accept" data-id="'+o.id+'"'+(none?" disabled":"")+'>'+(none?"Əvvəl hər mala firma seçin":"✓ OK · "+G.length+" qrup · Anbar gözləsin")+'</button></div>';
}
function acceptOrder(o){
  const G = firmGroups(o), parts = [];
  const nf = G.find(g=>!g.firm); if (nf) return toast(nf.idx.length+" malın firması seçilməyib");
  for (const g of G){
    const el = document.querySelector('[data-eta="'+CSS.escape(o.id+"|"+g.firm)+'"]'), eta = el ? el.value : "";
    if (!eta) return toast(g.firm+": gəliş gününü seçin");
    parts.push({ eta, sup:g.firm, items:g.idx.map(i=>o.items[i]) });
  }
  const note0 = (($("spn-"+o.id)||{}).value||"").trim(), to = [...(toSel["a"+o.id]||[])];
  let note = note0;
  if (note0 && to.length){ const [nm, err] = applyNote(o, "a"+o.id, to); if (err) return toast(err); if (nm.length) note = nm.join(", ")+": "+note0; }
  delete toSel["a"+o.id];
  const base = JSON.parse(JSON.stringify(o)), now = new Date().toISOString();
  const list = parts.map((pt,k)=>{
    const x = k===0 ? o : Object.assign(JSON.parse(JSON.stringify(base)), { id:nextId(), comments:[] });
    x.items = k===0 ? pt.items : JSON.parse(JSON.stringify(pt.items));
    x.eta = pt.eta; x.supplier = pt.sup; x.status = "yolda"; x.acceptedAt = now; x.last_move = now; if (note) x.spNote = note;
    if (parts.length>1){ x.group = o.id; x.part = (k+1)+"/"+parts.length; }
    if (k>0) S.orders.unshift(x);
    addLog(x, "Satınalma OK verdi", (x.supplier||"Firmasız")+" · gəliş "+fmtD(x.eta)+(parts.length>1?" · hissə "+x.part:"")+(note?" · "+note:""));
    return x;
  });
  if (note && to.length){ list.forEach(x=>{ x.noteTo = to; }); notify(to, "note", "#"+o.id+" · Satınalma: "+note, "Gəliş "+list.map(x=>fmtD(x.eta)).join(", ")+" · mal gələndə baxın", [], o.id); }
  notify([o.wh,o.from].filter(r=>!to.includes(r)||!note), "ok", "Satınalma #"+o.id+" sifarişini təsdiqlədi", list.map(x=>fmtD(x.eta)+" · "+(x.supplier||"Firmasız")).join(" | ")+(note?" · “"+note+"”":""), [], o.id);
  save(); render();
  toast(list.length>1 ? list.length+" qrupa bölündü (firmalar və sürücülər) · "+o.wh+" gözləyir" : o.wh+" gözləyir · "+fmtD(list[0].eta));
}
// Mal gəlməmiş, başqa firmaya/sürücüyə keçir: həmin firmanın eyni gün gələn sifarişinə qoşulur və ya yeni hissə açılır
function moveItem(key){
  const [o,i] = itemOf(key), to = ($("mv-"+key)||{}).value, eta = ($("mvd-"+key)||{}).value;
  if (!to) return toast("Hara keçirəcəyinizi seçin"); if (!eta) return toast("Gəliş gününü seçin");
  if (to===o.supplier && eta===o.eta) return toast("Mal artıq buradadır");
  const grp = o.group || o.id, now0 = now();
  let x = S.orders.find(y=>y.id!==o.id && y.status==="yolda" && y.wh===o.wh && y.supplier===to && y.eta===eta && (y.group||y.id)===grp && !y.items.some(z=>z.qc||z.got!=null));
  if (!x){ x = Object.assign(JSON.parse(JSON.stringify(o)), { id:nextId(), items:[], supplier:to, eta, group:grp, part:"köçürmə", comments:[], history:[], acceptedAt:now0, last_move:now0 }); S.orders.unshift(x); }
  o.items.splice(o.items.indexOf(i),1); i.firm = to; x.items.push(i);
  if (remember[o.id] && !isDriver(to) && prod(i.pid)) prod(i.pid).firm = to;
  addLog(o,"Mal başqa yerə keçdi",pname(i.pid)+" → "+to+" · #"+x.id); addLog(x,"Mal əlavə olundu",pname(i.pid)+" ("+(o.supplier||"—")+" → "+to+") · "+fmtD(eta));
  if (!o.items.length){ o.status = "redd"; addLog(o,"Bütün mallar başqa yerə keçdi",""); }
  notify([o.wh], "ok", "#"+x.id+" · "+pname(i.pid)+" indi "+to+"-dən gələcək", fmtD(eta), [], x.id);
  delete openAct[key]; save(); render(); toast(pname(i.pid)+" → "+to+" · "+fmtD(eta));
}
// ----- Satınalmanın cavabı: problemli mal nə vaxt gələcək və ya əvəzində nə gələcək -----
// Cavab həmin günə Anbarın "Gözlənilir" siyahısına davam sifarişi kimi düşür (eyni gün üçün bir sifariş).
function answerNone(key){
  const [oid,k] = key.split("-").map(Number), o = S.orders.find(x=>x.id===oid), i = o.items[k];
  const note = $("an-"+key).value.trim();
  if (!note){ $("an-"+key).focus(); return toast("Açıqlamanı yazın: niyə tapılmır?"); }
  i.ans = { none:true, note, by:role, at:new Date().toISOString() };
  addLog(o, "Satınalma: mal tapılmır", pname(i.pid)+" — "+note);
  notify([o.wh, o.from, "Rəhbərlik"], "res", "#"+o.id+" · "+pname(i.pid)+" tapılmır", "Satınalma: "+note, [], o.id);
  save(); render(); toast("Bildirildi → "+o.wh+" və Rəhbərlik");
}
function answerItem(key){
  const [oid,k] = key.split("-").map(Number), o = S.orders.find(x=>x.id===oid), i = o.items[k];
  const date = $("ad-"+key).value, subN = $("as-"+key).value.trim(), qty = $("aq-"+key).value.trim() || i.qty, note = $("an-"+key).value.trim();
  if (!note){ $("an-"+key).focus(); return toast("Açıqlamanı yazın: niyə gəlmədi?"); }
  if (!date) return toast("Nə vaxt gələcəyini seçin");
  const sub = subN ? ensureProd(subN) : "";
  let f = S.orders.find(x=>x.parent===o.id && x.eta===date && x.status==="yolda" && !x.items.some(y=>y.qc||y.got!=null));
  const now = new Date().toISOString();
  if (!f){
    f = { id:nextId(), type:o.type, from:o.wh, wh:o.wh, created:now, parent:o.id, items:[], status:"yolda", eta:date, supplier:o.supplier||"",
      deadline_h:24, last_move:now, acceptedAt:now, note:"#"+o.id+" sifarişinin davamı", photos:[], files:[], comments:[], history:[] };
    S.orders.unshift(f);
  }
  f.items.push({ pid: sub || i.pid, qty: normQty(qty), was: sub ? i.pid : undefined });
  i.ans = { date, sub: sub || "", note, by:role, at:now, follow:f.id };
  const txt = (sub ? "Əvəzinə "+pname(sub) : pname(i.pid))+" "+qty+" · "+fmtD(date)+(note?" · "+note:"");
  addLog(o, "Satınalma cavab verdi", pname(i.pid)+" → "+txt);
  addLog(f, "Satınalma göndərdi", txt);
  save(); render(); toast(fmtD(date)+" · "+o.wh+" gözləyir");
}


// ===================== Arxiv və statistika =====================
// Gün bağlananda (mallar qəbul olunub, problemlərə Satınalma cavab verib, Texnoloq qərar verib) sifariş arxivə keçir.
// Arxivdə: gün → firma / sürücü → mallar. Statistika: həftəlik (B.e–Bazar) və aylıq; bazar günü və ayın son günü Rəhbərliyə xəbər gedir.
const archived = o => o.status!=="redd" && !!o.recvDone && !needsAnswer(o) && !techPending(o);
let arM = "arch", arW = monday(today()), arMon = today().slice(0,7), arDays = 14;
const iDate = o => o.eta || o.created.slice(0,10);
function itemOutcome(o,i){
  if (i.ans && i.ans.closed) return ["🔒 Admin bağladı","p-mute"];
  if (i.ans && i.ans.none) return ["Tapılmadı"+(i.ans.note?": "+i.ans.note:""),"p-bad"];
  if (i.unav) return ["Satınalma: yoxdur","p-bad"];
  if (i.notFound) return ["Sürücü tapmadı","p-bad"];
  if (i.qc==="bad") return ["Keyfiyyət: "+(i.qcWhy||"uyğun deyil"),"p-bad"];
  if (i.techRes==="bad") return ["Texnoloq qəbul etmədi","p-bad"];
  const g = gotState(i.qty, i.got||0); return i.tech && i.techRes==="ok" ? [g[0]+" · Texnoloq ✓", g[1]] : g;
}
// Şöbələr üzrə: kim nəyi etməyib, nə qədər problem var (Rəhbərlik üçün)

    [hl.length+" xəbərsiz nümunəni yazmayıb (mal saxlanılır)", hl.length, hl.map(o=>L(o,esc(o.wh)+" · "+hTxt((Date.now()-new Date(o.hold.at))/HOUR)))],
    [acc.length+" sifariş qəbul edilməyib", acc.filter(stuck).length, acc.map(o=>L(o,esc(o.from)+" · "+hTxt((Date.now()-new Date(o.created))/HOUR)))],
    [lt.length+" gecikən sifarişə açıqlama verməyib", lt.filter(o=>(Date.now()-new Date(o.eta+"T23:59:00"))/HOUR>ANS_H).length, lt.map(o=>L(o,esc(o.supplier||"Firmasız")+" · "+fmtD(o.eta)))],
    [un.length+" gəlməyən / qəbul olunmayan mala cavab verməyib", un.filter(r=>ansLeftH(r.o,r.i)<0).length, un.map(r=>L(r.o,esc(pname(r.i.pid))+" · "+(ansLeftH(r.o,r.i)<0?'<b class="rs">'+hTxt(-ansLeftH(r.o,r.i))+' gecikir</b>':hTxt(ansLeftH(r.o,r.i))+" qalıb")))] ]]);
  const qc = S.orders.filter(o=>o.status==="anbar" && hasQC(o) && !o.qcAt);
  D.push(["🔍","Keyfiyyət",[[qc.length+" sifarişi yoxlamayıb", qc.filter(stuck).length, qc.map(o=>L(o,esc(o.supplier||"")+" · "+hTxt((Date.now()-new Date(o.arrivedAt||o.last_move))/HOUR)+" əvvəl gəlib"))]]]);
  WAREHOUSES.forEach(wh=>{

      [wt.length+" sifariş gecikir (mal gəlməyib)", 0, wt.map(o=>L(o,esc(o.supplier||"Firmasız")+" · "+fmtD(o.eta)))]]]);
  });
  const tp = S.orders.filter(techPending);
  D.push(["🧪","Texnoloq",[[tp.length+" sifarişdə dad/bişirmə cavabı verməyib", tp.filter(o=>o.items.some(i=>techReady(o,i) && i.techDue && daysTo(i.techDue)<0)).length, tp.map(o=>L(o,o.items.filter(i=>techReady(o,i)).map(i=>esc(pname(i.pid))).join(", ")))]]]);
  return '<div class="dgrid">'+D.map(([ic,name,lines])=>{
    const tot = lines.reduce((a,l)=>a+l[2].length,0), bad = lines.reduce((a,l)=>a+l[1],0);
    return '<details class="dcard'+(bad?" bad":tot?" warn":"")+'"><summary><span class="dn">'+ic+' '+esc(name)+'</span>'+(bad?'<span class="pill p-bad">⚠ '+bad+' gecikir</span>':"")+'<span class="pill '+(tot?"p-warn":"p-ok")+'">'+(tot?tot+" iş":"✓")+'</span></summary>'+
      (tot ? lines.filter(l=>l[2].length).map(l=>'<div class="dl"><b>'+l[0]+'</b>'+(l[1]?' <span class="rs">('+l[1]+'-i vaxtı keçib)</span>':"")+'<div class="dli">'+l[2].map(x=>'<div>'+x+'</div>').join("")+'</div></div>').join("") : '<div class="meta">Gözləyən işi yoxdur</div>')+'</details>';
  }).join("")+'</div>';
}

function stats(a,b){
  const inR = d => d>=a && d<=b;
  const os = S.orders.filter(o=>o.status!=="redd" && inR(iDate(o)));
  const rows = os.flatMap(o=>o.items.map(i=>({o,i})));
  const done = rows.filter(r=>r.o.recvDone || r.i.unav || r.i.notFound);
  const st = { orders: new Set(S.orders.filter(o=>inR(o.created.slice(0,10)) && !o.parent).map(o=>o.group||o.id)).size,
    items: rows.length, done: done.length, wait: rows.length-done.length,
    full: done.filter(r=>!problem(r.o,r.i) && (r.i.got||0)>=num(r.i.qty)).length,
    part: done.filter(r=>/^Az/.test(problem(r.o,r.i))).length,
    miss: done.filter(r=>/^(Gəlmədi|Satınalma: mal yoxdur|Sürücü tapmadı)/.test(problem(r.o,r.i))).length,
    qc: rows.filter(r=>r.i.qc==="bad"), tech: rows.filter(r=>r.i.techRes==="bad"), techOk: rows.filter(r=>r.i.techRes==="ok").length,
    ans: rows.filter(r=>r.i.ans).length, subs: rows.filter(r=>r.i.ans && r.i.ans.sub).length, open: rows.filter(r=>problem(r.o,r.i) && !r.i.ans),
    late: rows.filter(r=>/^(Gəlmədi|Az|Satınalma: mal yoxdur|Sürücü tapmadı)/.test(problem(r.o,r.i))),
    ontime: os.filter(o=>o.recvAt && o.eta).length ? Math.round(100*os.filter(o=>o.recvAt && o.eta && dstr(new Date(o.recvAt))<=o.eta).length/os.filter(o=>o.recvAt && o.eta).length) : null,
    newp: S.log.filter(x=>/Kataloqa (yeni mal|məhsul) əlavə/.test(x.act) && inR(x.at.slice(0,10))).map(x=>x.note),
    techOrders: S.orders.filter(o=>o.techOrder && !o.parent && inR(o.created.slice(0,10))).length, sup:{},
    lates: S.orders.filter(o=>o.status!=="redd").flatMap(o=>(o.lates||[]).filter(e=>inR(e.eta)).map(e=>({o,e}))).sort((x,y)=>x.e.eta.localeCompare(y.e.eta)) };
  st.lateNoAns = st.lates.filter(r=>!r.e.note).length;
  st.surprise = S.orders.filter(o=>o.unannounced && inR(o.created.slice(0,10)));
  st.samples = S.orders.filter(o=>o.sample && inR(o.created.slice(0,10)));
  st.lates.forEach(({e})=>{ const x = st.sup[e.firm] = st.sup[e.firm] || {n:0,full:0,bad:0,qc:0,bought:0,nf:0}; x.late = (x.late||0)+1; });
  rows.forEach(({o,i})=>{ const k = o.supplier||"Firmasız", x = st.sup[k] = st.sup[k] || {n:0,full:0,bad:0,qc:0,bought:0,nf:0};
    x.n++; const pr = problem(o,i); if (o.recvDone && !pr && (i.got||0)>=num(i.qty)) x.full++; if (pr) x.bad++; if (i.qc==="bad") x.qc++; if (i.bought) x.bought++; if (i.notFound) x.nf++; });
  return st;
}

// Bazar günü — həftəlik, ayın son günü — aylıq hesabat Rəhbərliyə (bir dəfə). Keçmiş, göndərilməmiş dövr də göndərilir.
function reportSignals(){
  if (ONLINE && !(role==="Rəhbərlik" || (Cloud.me()||{}).is_admin)) return;
  S.reports = S.reports || {}; const t = today(); let n = 0;
  const send = (key, a, b, title) => { if (S.reports[key]) return; const s = stats(a,b); if (!s.items && !s.orders) { S.reports[key] = 1; return; }
    S.reports[key] = 1; n++;
    notify(["Rəhbərlik"], "res", title+" hazırdır · "+fmtD(a).slice(0,5)+"–"+fmtD(b).slice(0,5),
      s.items+" mal · "+s.full+" tam · "+s.part+" az · "+s.miss+" gəlmədi · Keyfiyyət ✗ "+s.qc.length+" · Texnoloq ✗ "+s.tech.length+(s.surprise.length?" · "+s.surprise.length+" xəbərsiz nümunə":"")+(s.lates.length?" · "+s.lates.length+" gecikmə"+(s.lateNoAns?" ("+s.lateNoAns+"-nə Satınalma açıqlama verməyib)":""):"")+(s.open.length?" · "+s.open.length+" cavabsız":"")+" — 📊 Statistika", [], null); };
  const wEnd = addD(monday(t), 6);
  if (t===wEnd) send("w"+monday(t), monday(t), t, "📊 Həftəlik hesabat");
  const pw = addD(monday(t), -7); if (S.orders.length) send("w"+pw, pw, addD(pw,6), "📊 Həftəlik hesabat");
  const mEnd = dstr(new Date(Number(t.slice(0,4)), Number(t.slice(5,7)), 0));
  if (t===mEnd) send("m"+t.slice(0,7), t.slice(0,7)+"-01", t, "📅 Aylıq hesabat");
  const pm = new Date(Number(t.slice(0,4)), Number(t.slice(5,7))-2, 1), pmk = dstr(pm).slice(0,7);
  if (S.orders.length) send("m"+pmk, pmk+"-01", dstr(new Date(pm.getFullYear(), pm.getMonth()+1, 0)), "📅 Aylıq hesabat");
  if (n) save();
}

// ----- Excel-dən sifariş -----
// İki cür vərəq tanınır:
//  1) "Məhsul | Sifariş" başlıqlı bloklar (gündəlik vərəqlər), blokun üstündə firma adı;
//  2) sütun cütləri "ad | miqdar" (həftəlik vərəq): miqdarı boş olan sətir firma başlığıdır.
const normName = n => String(n).toLowerCase().replace(/i̇/g,"i").replace(/\s+/g," ").trim();
const normQty = q => String(q).trim().replace(/^(\d+(?:[.,]\d+)?)\s*([^\d\s.,].*)$/,"$1 $2");
const findFirm = h => { const n = normName(h); return n ? S.firms.find(f=>normName(f).startsWith(n) || n.startsWith(normName(f))) || "" : ""; };
// Exceldə boş sətirlə ayrılmış mal dəstələri ayrı-ayrı sifariş olur (məs. tərəvəz bir yerdən, süd məhsulları başqa yerdən)
const ord = n => n+"-"+(["cu","ci","ci","cü","cü","ci","cı","ci","ci","cu"][n%10]);
function blocker(out){ let b = 0, used = false;
  return { cut(){ if (used){ b++; used = false; } }, push(x){ x.blk = b; used = true; out.push(x); } }; }
function parseOrderSheet(ws){
  const A = XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:"",blankrows:true});
  const txt = v => String(v??"").trim();
  const out = [], B = blocker(out);
  const heads = [];
  A.forEach((row,r)=>row.forEach((v,c)=>{ if (normName(v)==="məhsul") heads.push([r,c]); }));
  if (heads.length){
    heads.forEach(([r,c])=>{
      const firm = findFirm(txt((A[r-1]||[])[c])); B.cut();
      for (let rr=r+1; A[rr]; rr++){
        const n = txt(A[rr][c]), q = txt(A[rr][c+1]);
        if (normName(n)==="məhsul") break;
        if (!n || !q){ B.cut(); continue; }
        B.push({name:n, qty:normQty(q), firm});
      }
    });
    return out;
  }
  const h = parseHeader(A); if (h.length) return h;
  const W = Math.max(0,...A.map(r=>r.length));
  for (let c=0; c<W; c+=2){
    let firm = ""; B.cut();
    A.forEach(row=>{ const n = txt(row[c]), q = txt(row[c+1]);
      if (!n && !q){ B.cut(); return; }
      if (!n || SKIPW.test(n) || isNumC(n)) return;
      if (!q){ firm = findFirm(n); B.cut(); return; }
      if (!/\d/.test(q)) return;
      B.push({name:n, qty:normQty(q), firm});
    });
  }
  return out.length ? out : parseRows(A);
}
// Başqa formalı vərəq: başlıqda "Mal/Məhsul/Ad" və "Miqdar/Say/Sifariş" sütunları; başlıq yoxdursa —
// hər sətirdə hərfli ilk xana ad, ondan sonrakı rəqəm miqdar, rəqəmdən sonrakı qısa söz vahiddir
const SKIPW = /^(№|n|#|cəmi|cemi|toplam|yekun|imza|tarix|sifariş|sifaris|məhsul|mehsul|ad|adı|mal|miqdar|say|vahid|ölçü|olcu|qiymət|qiymet|məbləğ|mebleg)$/i;
const isNumC = v => /^\d+(?:[.,]\d+)?$/.test(String(v??"").trim().replace(/\s/g,""));
function parseHeader(A){
  const txt = v => String(v??"").trim(), out = [], isNum = isNumC, SKIP = SKIPW;
  let hr = -1, cN = -1, cQ = -1, cU = -1;
  for (let r=0; r<Math.min(A.length,15) && hr<0; r++){
    const row = A[r].map(normName);
    const n = row.findIndex(c=>/^(mal|məhsul|mehsul|ad|adı|adi|nomenklatur|xammal|məhsulun adı|malın adı)/.test(c));
    const q = row.findIndex(c=>/^(miqdar|say|sifariş|sifaris|kəmiyyət|kemiyyet|lazım|lazim|tələb|teleb)/.test(c));
    if (n>=0 && q>=0){ hr = r; cN = n; cQ = q; cU = row.findIndex(c=>/^(vahid|ölçü|olcu|ö\/v|ö\\v|ed\.?|əd\.?)/.test(c)); }
  }
  const B = blocker(out);
  if (hr>=0){
    A.slice(hr+1).forEach(r=>{ const n = txt(r[cN]), q = txt(r[cQ]); if (!n && !q){ B.cut(); return; } if (!n || !q || SKIP.test(n) || isNum(n)) return;
      B.push({ name:n, qty: normQty(cU>=0 && txt(r[cU]) && isNum(q) ? q+" "+txt(r[cU]) : q), firm:"" }); });
  }
  return out;
}
function parseRows(A){
  const txt = v => String(v??"").trim(), out = [], isNum = isNumC, SKIP = SKIPW, B = blocker(out);
  A.forEach(r=>{
    const cells = r.map(txt); if (!cells.some(Boolean)){ B.cut(); return; } const ni = cells.findIndex(c=>c && /[a-zəıöüçşğ]/i.test(c) && !isNum(c));
    if (ni<0 || SKIP.test(cells[ni]) || cells[ni].length<2) return;
    const qi = cells.findIndex((c,k)=>k>ni && isNum(c)); if (qi<0) return;
    const u = cells[qi+1] && /^[a-zəıöüçşğ.]{1,8}$/i.test(cells[qi+1]) ? " "+cells[qi+1] : "";
    B.push({ name:cells[ni], qty:normQty(cells[qi]+u), firm:"" });
  });
  return out;
}
// Ad uyğunlaşdırma: böyük/kiçik hərf, artıq boşluq və ə/e, ı/i, ş/s, ç/c, ğ/g, ö/o, ü/u fərqi nəzərə alınmır
const foldName = n => normName(n).replace(/[ə]/g,"e").replace(/[ı]/g,"i").replace(/[ş]/g,"s").replace(/[ç]/g,"c").replace(/[ğ]/g,"g").replace(/[ö]/g,"o").replace(/[ü]/g,"u").replace(/[^a-z0-9%]+/g,"");
function matchPid(name){
  const ex = pidByName(name); if (ex) return ex;
  const f = foldName(name); if (!f) return "";
  const p = live().find(x=>foldName(x.name)===f); return p ? p.id : "";
}
function importInfo(){
  return xlsInfo() + ocrInfo();
}
function ocrInfo(){
  const o = draft.ocr; if (!o) return "";
  if (o.state==="prep") return '<div class="imp"><div>📷 <b>Şəkil hazırlanır…</b></div></div>';
  if (o.state==="busy") return '<div class="imp"><div>📷 <b>'+o.n+' şəkil oxunur...</b> Məhsullar bir az sonra aşağıya yazılacaq (adətən 10–40 saniyə).</div></div>';

async function addDraftFiles(list){
  for (const f of list){
    if (isSheet(f.name)){
      if (!window.XLSX){ toast("Excel oxuyucu yüklənmədi, internet bağlantısını yoxlayın"); continue; }
      let wb;
      toast(f.name+" oxunur..."); await new Promise(r=>setTimeout(r,30));
      try { wb = XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array"}); } catch(e){ toast(f.name+": faylı oxumaq olmadı"); continue; }
      draft.wb = wb;
      draft.xls = { name:f.name, size:f.size, sheets:wb.SheetNames.slice() };
      draft.xls.counts = {}; wb.SheetNames.forEach(n=>{ try { draft.xls.counts[n] = parseOrderSheet(wb.Sheets[n]).length; } catch(e){ draft.xls.counts[n] = 0; } });
      draft.sheet = wb.SheetNames.slice().reverse().find(n=>draft.xls.counts[n]) || wb.SheetNames[wb.SheetNames.length-1]; // malı olan son vərəq
      applySheet();
      continue;
    }
    const x = await readFile(f); if (x) draft.files.push(x);
  }
  render();
}
// Seçilmiş vərəqi məhsullar siyahısına yaz və faylı sifarişə qoş (böyük fayldan yalnız bu vərəq saxlanılır)
function applySheet(){
  const rows = parseOrderSheet(draft.wb.Sheets[draft.sheet]);
  draft.items = draft.items.filter(i=>i.src!=="xls" && (i.pid || (i.pname||"").trim()));
  rows.forEach(r=>{ const pid = matchPid(r.name); draft.items.push({pid, pname:r.name, qty:r.qty, imp:true, src:"xls", firm:r.firm, blk:r.blk}); });
  if (!draft.items.length) draft.items = [{pid:"",qty:""}];
  if (/həftəlik/i.test(draft.sheet)) draft.type = "Həftəlik";
  draft.files = draft.files.filter(x=>!x.xls);
  let att;
  if (draft.xls.size <= MAXF && draft.xls.sheets.length===1){
    att = { name:draft.xls.name, size:draft.xls.size, data:"data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,"+XLSX.write(draft.wb,{type:"base64",bookType:"xlsx"}) };
  } else {
    const one = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(one, draft.wb.Sheets[draft.sheet], draft.sheet.slice(0,31));
    const b64 = XLSX.write(one,{type:"base64",bookType:"xlsx"});
    att = { name:draft.xls.name.replace(/\.[^.]+$/,"")+" — "+draft.sheet+".xlsx", size:Math.round(b64.length*3/4), data:"data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,"+b64 };
  }
  draft.files.push({...att, xls:true, by:role, at:new Date().toISOString()});
  toast(rows.length+" məhsul Excel-dən yazıldı");
}

// ----- Şəkildən sifariş -----
// Sifariş siyahısının şəkli (əl yazısı və ya çap): şəkil sifarişdə qalır, Claude şəkildəki
// məhsulları və miqdarları oxuyur və kataloq adları ilə uyğunlaşdırır. Yalnız Claude linkində işləyir.
let sampleFn = null, canOcr = false, imgLim = null;
(async () => {
  try {
    sampleFn = window.claude && await window.claude.use("sample");
    const lim = sampleFn && await sampleFn.limits().catch(()=>null);
    canOcr = !!(lim && lim.images); imgLim = lim && lim.images;
  } catch(e){ canOcr = false; }
  if (canOcr && tab==="new") render();
})();
// Telefon şəkli (HEIC, 10+ MB) əvvəl adi JPEG-ə çevrilir və kiçildilir — oxumağa həmin şəkil gedir
const dataUrlToBlob = u => { const [h,b64] = u.split(","); const bin = atob(b64), a = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:(h.match(/:(.*?);/)||[])[1]||"image/jpeg"}); };
async function addDraftPhotos(list){
  const files = Array.from(list).filter(f=>/^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp|gif)$/i.test(f.name||""));
  if (!files.length) return toast("Şəkil seçilmədi");
  const forRead = [], alt = [];
  draft.ocr = { state:"prep", n:files.length }; if (tab==="new") render();
  await new Promise(r=>setTimeout(r,30));
  for (const f of files){
    const [small, big] = await shrink2(f, 640, 1600);
    if (small) draft.photos.push(small);
    // Adi JPEG/PNG — əvvəlki kimi orijinal fayl; HEIC və ya çox böyük — çevrilmiş JPEG
    const okType = (imgLim && imgLim.mediaTypes || ["image/jpeg","image/png","image/webp","image/gif"]).includes(f.type);
    const okSize = f.size <= ((imgLim && imgLim.maxInputBytes) || 5e6);
    const conv = big ? dataUrlToBlob(big) : null;
    if (okType && okSize){ forRead.push(f); if (conv) alt.push(conv); } else { forRead.push(conv || f); if (conv && okType) alt.push(f); }
  }
  if (!canOcr){ draft.ocr = { state:"off" }; render(); return; }
  draft.ocr = { state:"busy", n:files.length }; render();
  const names = live().map(p=>p.name).join("\n");
  const prompt = "Şəkil(lər)də şirniyyat sexinin anbar sifarişi var: əl ilə və ya çapla yazılmış məhsul siyahısı (Azərbaycan dilində, bəzən rus dilində). "+
    "Hər sətirdən məhsulun adını və miqdarını (vahidi ilə, məs. \"15 kq\", \"2 qutu\", \"60 əd\") çıxar. Miqdarı yazılmayan sətirləri və firma başlıqlarını götürmə. "+
    "Məhsul aşağıdakı kataloqdakı biri ilə eyni məhsuldursa, kataloqdakı adı hərfbəhərf yaz; deyilsə, şəkildə yazıldığı kimi yaz. "+
    "Cavab yalnız JSON massivi olsun: [{\"name\":\"Pralin\",\"qty\":\"120 kq\"}]. Şəkildə sifariş siyahısı yoxdursa [] qaytar.\n\nKataloq:\n"+names;
  try {
    let rows;
    try { rows = await sampleFn.json(prompt, { images: forRead }); }
    catch(e1){ if (!alt.length || !["image_rejected","invalid_request","transform_error","upstream_error"].includes(e1 && e1.code)) throw e1;
      rows = await sampleFn.json(prompt, { images: alt.length===forRead.length ? alt : forRead.map((x,k)=>alt[k]||x) }); }
    const ok = Array.isArray(rows) ? rows.filter(r=>r && String(r.name||"").trim() && String(r.qty??"").trim()) : [];
    draft.items = draft.items.filter(i=>i.pid || (i.pname||"").trim());
    ok.forEach(r=>{ const n = String(r.name).trim(); draft.items.push({pid:pidByName(n), pname:n, qty:normQty(r.qty), imp:true, src:"img"}); });
    if (!draft.items.length) draft.items = [{pid:"",qty:""}];
    draft.ocr = { state:"done", got:ok.length };
    toast(ok.length ? ok.length+" məhsul şəkildən yazıldı" : "Şəkildə sifariş siyahısı tapılmadı");
  } catch(e){
    const msg = { not_granted:"Şəkli oxumaq üçün Claude-a icazə verilmədi.", rate_limited:"Çox sorğu getdi, bir az sonra yenidən cəhd edin.", image_rejected:"Bu şəkli oxumaq olmadı, başqa şəkil seçin.", invalid_json:"Şəkildəki siyahını oxumaq olmadı." }[e && e.code] || "Şəkli oxumaq alınmadı.";
    draft.ocr = { state:"err", msg: msg + (e && e.code ? " ("+e.code+")" : "") };
  }
  if (tab==="new") render();
}

function sendOrder(){

  } });

  const items = draft.items.filter(i=>i.pid && String(i.qty).trim()).map(i=>{ const x = {pid:Number(i.pid),qty:withUnit(i.qty,Number(i.pid))};

    if (i.firm && !pfirm(x.pid)) x.firm = i.firm;   // Excel-də firma başlığı varsa və kataloqda firma yoxdursa

  const nf = o.items.filter(i=>!dest(i)).length;
  tab = "home"; render(); toast("Sifariş #"+o.id+" Satınalmaya göndərildi"+(nf?" · "+nf+" malın firması kataloqda yoxdur, Satınalma seçəcək":""));
}

// Excel-in hər vərəqi ayrıca sifariş: adlar kataloqla uyğunlaşdırılır, tapılmayan ad kataloqa "yeni" kimi düşür
function sendSheets(){
  const tech = role==="Texnoloq", made = [];
  draft.xls.sheets.forEach(n=>{
    const all = parseOrderSheet(draft.wb.Sheets[n]); if (!all.length) return;
    const bl = [...new Set(all.map(r=>r.blk||0))];
    bl.forEach((b,bi)=>{ const rows = all.filter(r=>(r.blk||0)===b);
    const items = rows.map(r=>{ const pid = matchPid(r.name) || ensureProd(r.name, r.firm); const x = { pid:Number(pid), qty:withUnit(r.qty, Number(pid)) };
      if (r.firm && !pfirm(x.pid)) x.firm = r.firm; if (tech) x.tech = true; if (needDep() && depOf(n)) x.dep = depOf(n); return x; });
    const one = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(one, draft.wb.Sheets[n], n.slice(0,31));
    const b64 = XLSX.write(one,{type:"base64",bookType:"xlsx"});
    const file = { name:draft.xls.name.replace(/\.[^.]+$/,"")+" — "+n+".xlsx", size:Math.round(b64.length*3/4), data:"data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,"+b64, xls:true, by:role, at:new Date().toISOString() };
    made.push(makeOrder(items, [draft.note.trim(), "Excel: "+n+(bl.length>1?" · "+ord(bi+1)+" dəstə":"")].filter(Boolean).join(" · "), draft.photos.slice(), [file]));

// Bir dəfə açıb iki ölçüdə JPEG verir (telefonda böyük şəkli iki dəfə açmamaq üçün)
function shrink2(file, a, b){
  return new Promise(res=>{
    const r = new FileReader();
    r.onerror = () => res([null,null]);
    r.onload = () => { const img = new Image();
      img.onerror = () => res([null,null]);
      img.onload = () => {
        const out = [a,b].map(max=>{ const k = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas");
          c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          try { return c.toDataURL("image/jpeg",.8); } catch(e){ return null; } });
        res(out); };
      img.src = r.result; };
    r.readAsDataURL(file);
  });
}
function shrink(file, max){
  return new Promise(res=>{
    const r = new FileReader();
    r.onerror = () => res(null);
    r.onload = () => { const img = new Image();
      img.onerror = () => res(null);
      img.onload = () => {
        const k = Math.min(1, (max||640)/Math.max(img.width,img.height)); const c = document.createElement("canvas");
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        try { res(c.toDataURL("image/jpeg",.8)); } catch(e){ res(null); } };
      img.src = r.result; };
    r.readAsDataURL(file);
  });
}

$("main").addEventListener("change", async e => {
  const el = e.target;
  if (el.id==="rFrom"){ RF=el.value; render(); return; }
  if (el.id==="rTo"){ RT=el.value; render(); return; }
  if (el.id==="dPick"){ if (el.value){ dSel=el.value; render(); } return; }
  if (el.dataset.got){ saveGot(el); return; }
  if (el.dataset.eta){ etaDraft[el.dataset.eta] = el.value; return; }
  if (el.dataset.remember){ remember[el.dataset.remember] = el.checked; return; }
  if (el.dataset.dest){ const [o,i]=itemOf(el.dataset.dest); const v=el.value, y=window.scrollY; i.firm = v;
    if (remember[o.id] && v && !isDriver(v) && prod(i.pid)){ prod(i.pid).firm = v; S.log.push({by:role,act:"Firma dəyişdirildi",note:pname(i.pid)+" → "+v,at:now()}); }
    save(); render(); window.scrollTo(0,y); return; }
  if (el.dataset.pphoto){ setPhoto(el); return; }
  if (el.id==="fmXls"){ if (el.files[0]) importFirmMap(el.files[0]); return; }
  if (el.dataset.ii!=null){ setItem(el); return; }
  if (el.id==="cF"){ catFirm=el.value; render(); return; }
  if (el.dataset.pname && role==="Admin"){ renameProduct(el); return; }
  if (el.dataset.psize && role==="Admin"){ const p=prod(el.dataset.psize), v=el.value.trim(); if (v===(p.size||"")) return; S.log.push({by:role,act:"Ölçü dəyişdirildi",note:p.name+": "+(p.size||"—")+" → "+(v||"—"),at:now()}); p.size=v; save(); el.closest("tr").dataset.s=(p.name+" "+v).toLowerCase(); toast("Ölçü yadda saxlandı"); return; }
  if (el.dataset.punit && role==="Admin"){ const p=prod(el.dataset.punit); p.unit=el.value; S.log.push({by:role,act:"Vahid dəyişdirildi",note:p.name+" → "+(p.unit||"—"),at:now()}); save(); toast("Yadda saxlandı"); return; }
  if (el.dataset.firm && role==="Admin"){ const p=prod(el.dataset.firm); p.firm=el.value; S.log.push({by:role,act:"Firma dəyişdirildi",note:p.name+" → "+(p.firm||"firmasız"),at:new Date().toISOString()}); save(); el.closest("tr").dataset.f=p.firm||"-"; toast("Yadda saxlandı"); return; }
  if (el.dataset.file){ const o=S.orders.find(x=>x.id===Number(el.dataset.file)); o.files=o.files||[]; for (const f of el.files){ const x=await readFile(f); if (x){ o.files.push(x); addLog(o,"Fayl əlavə edildi",x.name); } } save(); render(); return; }
  if (el.dataset.photo){ const o=S.orders.find(x=>x.id===Number(el.dataset.photo)); for (const f of el.files){ const x = await shrink(f); if (x) o.photos.push(x); else toast(f.name+": bu şəkli açmaq olmadı"); } addLog(o,"Şəkil əlavə edildi",""); save(); render(); }
});
$("main").addEventListener("input", e => {
  const el=e.target;
  if (el.dataset.qcw){ const [o,i]=itemOf(el.dataset.qcw); i.qcWhy = el.value; save(); }
  if (el.dataset.hd){ const [id,f]=el.dataset.hd.split("|"); hDraft[id][f]=el.value; return; }
  if (el.dataset.hr){ const [id,k,f]=el.dataset.hr.split("|"); hDraft[id].rows[Number(k)][f]=el.value; return; }
  if (el.dataset.sd && sDraft){ sDraft[el.dataset.sd] = el.value; return; }
  if (el.dataset.sr && sDraft){ const [k,f] = el.dataset.sr.split("-"); sDraft.rows[Number(k)][f] = el.value; return; }
  if (el.dataset.qf){ const [k,f] = el.dataset.qf.split("|"), [o,i] = itemOf(k);
    if (f==="mfg"||f==="exp"){ const v = fmtDT(el.value); if (v!==el.value) el.value = v; i[f] = v; el.classList.toggle("qw", f==="exp" && !!dtISO(v) && dtISO(v)<today()); }
    else if (f==="temp") i.temp = el.value.replace(",",".").trim();
    else if (f==="qcBy"){ i.qcBy = el.value; if (el.value) o.items.forEach(x=>{ if (!x.qcBy) x.qcBy = el.value; }); save(); render(); return; }
    save(); return; }
  if (el.dataset.ed){ const [id,k,f]=el.dataset.ed.split("-"); editDraft[id][Number(k)][f]=el.value; }
  if (el.dataset.ad){ const [id,k,f]=el.dataset.ad.split("-"); addDraft[id][Number(k)][f]=el.value; }
  if (el.dataset.got) paintGot(el);
  if (el.dataset.ii!=null) setItem(el);
  if (el.id==="cQ"){ catQ=el.value; filterRows(el); }
  if (el.id==="oQ"){ oq=el.value; clearTimeout(window.__oq); window.__oq=setTimeout(()=>{ render(); const q=$("oQ"); q.focus(); q.setSelectionRange(q.value.length,q.value.length); },250); }
});
function setItem(el){
  const it = draft.items[Number(el.dataset.ii)];
  if (el.dataset.f==="pname"){ it.pname = el.value; it.pid = pidByName(el.value);
    const q = el.parentNode.querySelector('[data-f="qty"]'); if (q) q.placeholder = it.pid && punit(it.pid) ? punit(it.pid) : "15 kq"; }
  else if (el.dataset.f==="dep"){ it.dep = el.value; el.closest(".it").classList.remove("nodep"); }
  else it.qty = el.value;
}
// Yazan kimi rəng: tam — yaşıl, az — sarı, 0 — qırmızı
function paintGot(el){
  if (el.value==="") return;
  const row = el.closest(".irow"), pill = row.querySelector(".st");
  const st = gotState(el.dataset.q, Math.max(0,num(el.value)));
  row.className = "irow "+rowCls(st); pill.className = "pill "+st[1]+" st"; pill.textContent = st[0];
}
function saveGot(el){
  if (el.value==="") return;
  const [o,i] = itemOf(el.dataset.got), val = Math.max(0,num(el.value));
  if (val===i.got) return;
  i.got = val;
  addLog(o,"Qeyd edildi",pname(i.pid)+": "+i.qty+" sifariş, "+fmtN(val)+" gəldi");
  save(); renderTabs();
}
function orderAct(act, id){
  const o = S.orders.find(x=>x.id===id); if (!o) return;
  const v = k => ($(k+"-"+id)||{}).value || "";
  if (act==="comment"){ let t=v("c").trim(); if(!t) return toast("Şərhi yazın");
    const to = [...(toSel["c"+id]||[])];
    if (to.length){ const [nm, err] = applyNote(o, "c"+id, to); if (err) return toast(err); if (nm.length) t = nm.join(", ")+": "+t; }
    delete toSel["c"+id];
    o.comments.push({by:role,text:t,to,at:new Date().toISOString()}); addLog(o,"Şərh",t+(to.length?" → "+to.join(", "):""));
    if (to.length){ o.noteTo = [...new Set((o.noteTo||[]).concat(to))]; notify(to, "note", "#"+o.id+" · "+role+": "+t, (o.eta?"Gəliş "+fmtD(o.eta)+" · ":"")+"mal gələndə baxın", [], o.id); }
    toast(to.length ? "Göndərildi → "+to.join(", ") : "Şərh yazıldı"); }
  else if (act==="accept") return acceptOrder(o);
  else if (act==="qcall"){ o.items.forEach(i=>{ if (!i.qc) i.qc="ok"; }); return keep(()=>{}); }
  else if (act==="latedate" || act==="latenone"){
    const note = v("ln").trim(); if (!note){ const el=$("ln-"+id); if (el) el.focus(); return toast("Açıqlamanı yazın: niyə gəlmədi?"); }
    const e = lateEntry(o) || ((o.lates = o.lates||[]).push({eta:o.eta, firm:o.supplier||"Firmasız", at:new Date().toISOString()}), lateEntry(o));
    Object.assign(e, { note, by:role, ansAt:new Date().toISOString() });
    if (act==="latedate"){ const d = v("ld"); if (!d) return toast("Yeni tarixi seçin");
      e.newEta = d; o.eta = d; o.last_move = e.ansAt;
      addLog(o, "Satınalma: gecikdi, yeni tarix", fmtD(d)+" · "+note);
      notify([o.wh], "note", "#"+o.id+" "+(o.supplier||"")+" gecikir · yeni tarix "+fmtD(d), "Satınalma: "+note, [], o.id);
      toast("Yeni tarix "+fmtD(d)+" · "+o.wh+" gözləyir");
    } else {
      e.none = true;
      o.items.forEach(i=>{ if (i.got==null && !i.ans){ i.ans = { none:true, note, by:role, at:e.ansAt }; if (hasQC(o)) i.qc = "none"; } });
      finishReceive(o, role, "Gəlməyəcək: "+note);
      notify([o.wh, o.from, "Rəhbərlik"], "res", "#"+o.id+" · "+(o.supplier||"Firmasız")+" gəlməyəcək", "Satınalma: "+note, o.items.map(i=>pname(i.pid)), o.id);
      toast("Bildirildi → "+o.wh+" və Rəhbərlik");
    }
  }
  else if (act==="arrived"){
    const le = lateOpen(o) ? lateEntry(o) : null; if (le) le.arrived = today();
    o.status = "anbar"; o.arrivedAt = o.last_move = new Date().toISOString();
    addLog(o,"Mal gəldi","");
    if (o.noteTo && o.noteTo.length) notify(o.noteTo.filter(r=>r!==o.wh && !(r==="Texnoloq" && o.items.some(i=>i.tech))), "arr", "#"+o.id+" gəldi · baxın", [o.spNote, ...o.comments.filter(c=>c.to&&c.to.length).map(c=>c.text)].filter(Boolean).join(" · "), [], o.id);
    if (hasQC(o) && !(o.noteTo||[]).includes("Keyfiyyət")) notify(["Keyfiyyət"], "arr", "#"+o.id+" gəldi · yoxlayın", (o.supplier||"Firmasız")+" → "+o.wh+" · "+o.items.length+" mal", [], o.id);
    toast(hasQC(o) ? "Keyfiyyətə xəbər getdi · gələn miqdarı yazın" : "Gələn miqdarı yazın");
  }
  else if (act==="qcdone"){
    const nw = o.items.find(i=>i.qc==="bad" && !(i.qcWhy||"").trim());
    if (nw) return toast(pname(nw.pid)+": niyə uyğun olmadığını yazın");
    const nb = o.items.find(i=>(i.qc==="ok"||i.qc==="bad") && !i.qcBy);
    if (nb) return toast(pname(nb.pid)+": kimin yoxladığını seçin");
    const nt = o.items.find(i=>i.qc==="ok" && isRisky(i) && (i.temp==null || String(i.temp).trim()===""));
    if (nt) return toast(pname(nt.pid)+": temperaturu yazın");
    const nd = o.items.find(i=>(i.mfg && !dtISO(i.mfg)) || (i.exp && !dtISO(i.exp)));
    if (nd) return toast(pname(nd.pid)+": tarixi gün.ay.il kimi yazın (məs. 01.05.2026)");
    o.items.forEach(i=>{ if (!i.qc) i.qc = "none"; });
    o.qcAt = o.last_move = new Date().toISOString();
    const bad = o.items.filter(i=>i.qc!=="ok");
    addLog(o,"Keyfiyyət yoxladı", (bad.length ? bad.map(i=>pname(i.pid)+": "+(i.qc==="bad"?i.qcWhy:"gəlmədi")).join("; ") : "Hamısı uyğundur")+" · Yoxlayan: "+[...new Set(o.items.map(i=>i.qcBy).filter(Boolean))].join(", "));
    const blk = o.items.filter(i=>i.qc==="bad");
    if (blk.length) notify(["Satınalma",o.wh,"Rəhbərlik"], "late", "Keyfiyyət qəbul etmədi · #"+o.id, "Satınalma: yenidən sifariş edin və ya əvəzinə başqa mal — cavab verin", blk.map(i=>pname(i.pid)+": "+i.qcWhy), o.id);
    toast("Yoxlama bitdi · Anbar qəbulu bitirə bilər");
  }
  else if (act==="allfull"){ return keep(()=>{ o.items.forEach(i=>{ if (i.qc!=="bad" && i.qc!=="none") i.got = num(i.qty); }); }); }
  else if (act==="receive"){
    if (hasQC(o) && !o.qcAt) return toast("Keyfiyyət hələ yoxlamayıb");
    o.items.forEach((i,k)=>{ const el=$("got-"+id+"-"+k); if (el && el.value!=="") i.got = Math.max(0,num(el.value)); });
    const n = finishReceive(o, role, v("rn"));
    const tr = o.items.filter(i=>techReady(o,i));
    if (tr.length) (S.alerts||[]).forEach(x=>{ if (x.oid===o.id && x.to && x.to.includes("Texnoloq") && !x.seen.includes("Texnoloq")) x.seen.push("Texnoloq"); });
    if (tr.length) notify(["Texnoloq"], "arr", "#"+o.id+" Anbara qəbul olundu · baxın", (o.supplier||"Firmasız")+" → "+o.wh, tr.map(i=>pname(i.pid)+" "+i.qty), o.id);
    const c = {ok:0,warn:0,bad:0}; o.items.forEach(i=>{ const k=itemCat(itemState(o,i)); if (c[k]!=null) c[k]++; });
    notify(["Satınalma",o.from,"Rəhbərlik"], "res", "#"+o.id+" qəbul olundu", [c.ok?c.ok+" tam":"", c.warn?c.warn+" az":"", c.bad?c.bad+" qəbul olunmadı / gəlmədi":""].filter(Boolean).join(" · ")+(n?" · cavabınız lazımdır":""),
      o.items.filter(i=>problem(o,i)).map(i=>pname(i.pid)+": "+problem(o,i)), o.id);
    const re = o.items.filter(i=>problem(o,i) && i.ans).length;
    toast(n ? n+" mal üçün Satınalma cavab verəcək" : techPending(o) ? "Qəbul olundu · Texnoloq yoxlayacaq" : re ? "Qəbul bitdi · "+re+" mal yenidən sifariş olunub, gözlənilir" : "Hamısı qəbul olundu ✓");
  }
  else if (act==="cancel"){ o.status="redd"; addLog(o,"Rəhbərlik ləğv etdi",""); }
  save(); render();
}

// ----- Admin: firma–mal Excel-i -----
// 1) başlıqda "Firma" və "Mal/Məhsul/Ad/Nomenklatur" sütunları; 2) başlıq yoxdursa: tək xanalı sətir — firma adı, altındakı sətirlər — onun malları
let fmReport = "";
async function importFirmMap(file){
  if (!window.XLSX) return toast("Excel oxuyucu yüklənmədi, internet bağlantısını yoxlayın");
  let wb; try { wb = XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:"array"}); } catch(e){ return toast("Faylı oxumaq olmadı"); }
  const pairs = [];
  wb.SheetNames.forEach(sn=>{
    const A = XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:""}).map(r=>r.map(c=>String(c??"").replace(/\s+/g," ").trim()));
    let hr = -1, cN = -1, cF = -1;
    for (let r=0; r<Math.min(A.length,10) && hr<0; r++){
      const f = A[r].findIndex(c=>/^(firma|təchizatçı|techizatci|tədarükçü|supplier)/i.test(c)), n = A[r].findIndex(c=>/^(mal|məhsul|mehsul|ad|adı|nomenklatur|xammal)/i.test(c));
      if (f>=0 && n>=0){ hr = r; cF = f; cN = n; }
    }
    if (hr>=0){ A.slice(hr+1).forEach(r=>{ if (r[cN] && r[cF]) pairs.push([r[cN], r[cF]]); }); return; }
    let firm = "";
    A.forEach(r=>{ const cells = r.filter(Boolean); if (!cells.length) return;
      if (cells.length===1 && !pidByName(cells[0])){ firm = cells[0]; return; }
      if (firm) pairs.push([r.find(Boolean), firm]); });
  });
  if (!pairs.length){ fmReport = "Faylda firma–mal cütü tapılmadı. Sütun başlıqları <b>Mal</b> və <b>Firma</b> olmalıdır."; render(); return; }
  let linked = 0, created = 0; const newF = new Set(), firmOf = n => S.firms.find(f=>normName(f)===normName(n)) || findFirm(n);
  pairs.forEach(([n,f])=>{
    let firm = firmOf(f); if (!firm){ firm = f; S.firms.push(f); newF.add(f); }
    let id = pidByName(n);
    if (!id){ const p = { id:newPid(), name:n, firm, size:guessSize(n), unit:"" }; S.products.push(p); created++; }
    else { prod(id).firm = firm; delete prod(id).deleted; linked++; }
  });
  S.firms.sort((a,b)=>a.localeCompare(b,"az"));
  S.log.push({by:role,act:"Firma–mal siyahısı yükləndi",note:file.name+" · "+pairs.length+" mal",at:now()});
  fmReport = "<b>"+esc(file.name)+"</b>: "+pairs.length+" mal firmaya bağlandı"+(created?" (<span class=\"newtag\">"+created+" yeni mal</span> kataloqa əlavə olundu)":"")+(newF.size?" · yeni firmalar: "+[...newF].map(esc).join(", "):"")+".";
  save(); render(); toast(pairs.length+" mal firmalara bağlandı");
}
// ----- Admin: kataloq əməliyyatları -----
function sure(btn, fn){
  if (btn.dataset.sure) return fn();
  const orig = btn.textContent;
  btn.dataset.sure = 1; btn.textContent = btn.dataset.act==="del" ? "Silinsin? Yenidən basın" : "Əminsiniz? Yenidən basın";
  setTimeout(()=>{ if (btn.isConnected){ delete btn.dataset.sure; btn.textContent = orig; } }, 4000);
}
const now = () => new Date().toISOString();
function addProduct(){
  if (role!=="Admin") return;
  const name=$("pN").value.trim(); if(!name) return toast("Məhsulun adını yazın");
  if (pidByName(name)) return toast("Bu məhsul artıq kataloqdadır");
  const p={id:newPid(),name,firm:$("pF").value};
  S.products.push(p); S.log.push({by:role,act:"Kataloqa məhsul əlavə edildi",note:name+(p.firm?" · "+p.firm:""),at:now()});
  save(); render(); toast(name+" əlavə olundu");
}
// Ad dəyişəndə köhnə sifarişlərdə də yeni ad görünür (sifariş məhsulu nömrə ilə saxlayır)
function renameProduct(el){
  const p = prod(el.dataset.pname), name = el.value.trim();
  if (!name){ el.value = p.name; return toast("Ad boş ola bilməz"); }
  if (name === p.name) return;
  const other = pidByName(name);
  if (other && other !== p.id){ el.value = p.name; return toast("“"+name+"” adlı məhsul artıq var"); }
  S.log.push({by:role,act:"Məhsulun adı dəyişdirildi",note:p.name+" → "+name,at:now()});
  p.name = name; save();
  el.value = name; el.closest("tr").dataset.s = name.toLowerCase();
  toast("Ad dəyişdirildi: "+name);
}
// Silinən məhsul köhnə sifarişlərdə adı ilə qalır, sadəcə yeni sifarişdə seçilmir
function delProduct(id){
  if (role!=="Admin") return;
  const p=prod(id); p.deleted=true;
  S.log.push({by:role,act:"Məhsul kataloqdan silindi",note:p.name,at:now()});
  save(); render(); toast(p.name+" silindi");
}
function unFirm(id){
  if (role!=="Admin") return;
  const p=prod(id), f=p.firm; p.firm="";
  S.log.push({by:role,act:"Məhsul firmadan çıxarıldı",note:p.name+" · "+f,at:now()});
  save(); render(); toast(p.name+" artıq "+f+" firmasından gəlmir");
}
function addToFirm(){
  if (role!=="Admin") return;
  const name=$("ffN").value.trim(); if (!name) return toast("Məhsulun adını yazın və ya seçin");
  const id=pidByName(name);
  if (id){ const p=prod(id), old=p.firm; p.firm=catFirm; S.log.push({by:role,act:"Məhsul firmaya əlavə edildi",note:p.name+" · "+(old||"firmasız")+" → "+catFirm,at:now()}); toast(p.name+" → "+catFirm); }
  else { const p={id:newPid(),name,firm:catFirm,size:guessSize(name)}; S.products.push(p); S.log.push({by:role,act:"Kataloqa məhsul əlavə edildi",note:name+" · "+catFirm,at:now()}); toast("Yeni məhsul: "+name+" · "+catFirm); }
  save(); render();
}
function addFirm(){
  if (role!=="Admin") return;
  const f=$("fN").value.trim(); if(!f) return toast("Firmanın adını yazın");
  if (S.firms.some(x=>x.toLowerCase()===f.toLowerCase())) return toast("Bu firma artıq var");
  S.firms.push(f); S.firms.sort((a,b)=>a.localeCompare(b,"az"));
  S.log.push({by:role,act:"Firma əlavə edildi",note:f,at:now()});
  save(); render(); toast(f+" əlavə olundu");
}
function delFirm(f){
  if (role!=="Admin") return;
  S.firms = S.firms.filter(x=>x!==f);
  if (catFirm===f) catFirm="";
  S.products.forEach(p=>{ if (p.firm===f) p.firm=""; });
  S.log.push({by:role,act:"Firma silindi",note:f,at:now()});
  save(); render(); toast(f+" silindi");
}

// ===================== Giriş ekranı: zəncirdən asılan lampa =====================
// Zənciri çək (və ya bas) → klik səsi, lampa yanır, "Almond" hərfləri bir-bir yanır, aralarına halqalar düşür → giriş forması açılır.
let lgAudio = null;
function lgAC(){ try { lgAudio = lgAudio || new (window.AudioContext || window.webkitAudioContext)(); if (lgAudio.state === "suspended") lgAudio.resume(); } catch(e){} return lgAudio; }
function lgClick(){ const a = lgAC(); if (!a) return; const t = a.currentTime;
  const n = a.createBufferSource(), buf = a.createBuffer(1, Math.floor(a.sampleRate*.04), a.sampleRate), d = buf.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/d.length,3);

function lampClose(){ const el = $("lg"); if (el) el.remove(); document.body.classList.remove("lg-on"); document.removeEventListener("keydown", lampKey); }

function lampLogin(msg, selectHtml){

  const L = "Almond".split(""), link = '<svg class="lk" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a4 4 0 0 1 4-4h3a4 4 0 0 1 0 8H8a4 4 0 0 1-4-4z"/><path d="M13 8h3a4 4 0 0 1 0 8h-3a4 4 0 0 1-4-4"/></svg>';

      '<path class="shade-in" d="M42 176 C56 168 144 168 158 176 L166 178 L34 178 Z"/>'+

      '<g class="pull" id="lgPull" tabindex="0" role="button" aria-label="Lampanı yandırmaq üçün zənciri çəkin"><rect class="pull-hit" x="122" y="168" width="40" height="80"/><g id="lgBeads"></g><circle class="knob" id="lgKnob" cx="142" cy="226" r="7"/></g>'+

    '<h1 class="word" aria-label="Almond">'+L.map((c,i)=>'<span class="ch" aria-hidden="true">'+c+'</span>'+(i<L.length-1?link:"")).join("")+'</h1>'+
    '<div class="tag">Anbar zənciri</div>'+
    '<form class="lform" id="lf"><h2>Daxil olun</h2><div class="sub">Şöbənizi seçin və 4 rəqəmli parolu yazın.</div>'+
      '<label>Şöbə'+selectHtml+'</label>'+
      '<label>Parol<input id="lp" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="• • • •"></label>'+
      '<button class="lbtn" id="lb">Daxil ol</button><div class="lnote" id="lnote">'+esc(msg||"")+'</div></form>'+
    '<button class="lskip" id="lgSkip" type="button">Animasiyasız aç</button>';
  document.body.appendChild(el); document.body.classList.add("lg-on");
  const g = $("lgHang");
  for (let y=-40,k=0; y<106; y+=12,k++){ const e = document.createElementNS(NS, k%2 ? "rect" : "ellipse");
    if (k%2){ e.setAttribute("x",98.5); e.setAttribute("y",y-1); e.setAttribute("width",3); e.setAttribute("height",14); e.setAttribute("rx",1.5); e.setAttribute("fill","#6b5136"); e.setAttribute("stroke","none"); }
    else { e.setAttribute("cx",100); e.setAttribute("cy",y+6); e.setAttribute("rx",4.5); e.setAttribute("ry",7.5); }
    g.appendChild(e); }
  const beads = $("lgBeads");
  for (let y=176; y<=216; y+=6){ const c = document.createElementNS(NS,"circle"); c.setAttribute("class","bead"); c.setAttribute("cx",142); c.setAttribute("cy",y); c.setAttribute("r",1.9); beads.appendChild(c); }
  let lit = false;
  lampOn = quiet => {
    if (lit){ el.classList.toggle("on"); return; }

    const chs = [...el.querySelectorAll(".word .ch")], lks = [...el.querySelectorAll(".word .lk")];

    requestAnimationFrame(()=>el.classList.add("lit"));

  pull.addEventListener("pointermove", e => { if (y0 == null) return; dy = Math.max(0, Math.min(34, e.clientY-y0)); setPull(dy); });

  el.querySelector(".lamp").addEventListener("click", e => { if (!e.target.closest("#lgPull")) lampOn(); });
  $("lgSkip").onclick = () => lampOn(true);
  document.addEventListener("keydown", lampKey);
