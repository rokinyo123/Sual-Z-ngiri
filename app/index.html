    if (String(i.left||"").trim()) x.left = withUnit(i.left, Number(i.pid));
    if (i.dep) x.dep = i.dep; x.blk = i.blk||0;
    if (i.firm && !pfirm(x.pid)) x.firm = i.firm;   // Excel-də firma başlığı varsa və kataloqda firma yoxdursa
    if (tech) x.tech = true; return x; });
  if (!items.length) return $("nErr").textContent = "Ən azı bir mal və miqdar yazın.";
  if (REQ_W.includes(role)){ if (!draft.need) return $("nErr").textContent = "Malın nə vaxt lazım olduğunu seçin (gün və saat).";
    if (new Date(draft.need) < new Date()) return $("nErr").textContent = "Lazım olan vaxt keçmişdə ola bilməz."; }
  if (draft.ansBy && new Date(draft.ansBy) < new Date()) return $("nErr").textContent = "Cavab vaxtı keçmişdə ola bilməz.";
  const blks = [...new Set(items.map(i=>i.blk))].sort((a,b)=>a-b);
  const made = blks.map((b,n)=>{ const its = items.filter(i=>i.blk===b); its.forEach(i=>delete i.blk);
    return makeOrder(its, [draft.note.trim(), blks.length>1?ord(n+1)+" dəstə":""].filter(Boolean).join(" · "), draft.photos.slice(), draft.files.slice()); });
  const o = made[0];
  save();
  draft = newDraft();
  if (made.length>1){ tab = "home"; render(); return toast(made.length+" sifariş Satınalmaya göndərildi: "+made.map(x=>"#"+x.id).join(", ")); }
  if (tech) notify(["Anbar"], "note", "Texnoloq yeni mal sifariş etdi · #"+o.id, "Satınalma təmin edəcək; mal gələndə Keyfiyyət yoxlayacaq, Anbar qəbul edəcək, sonra Texnoloq dadına baxacaq", o.items.map(i=>pname(i.pid)+" "+i.qty), o.id);
  const nf = o.items.filter(i=>!dest(i)).length;
  if (o.req){ tab = "home"; render(); return toast("Sifariş #"+o.id+" → "+o.wh); }
  tab = "home"; render(); toast("Sifariş #"+o.id+" Satınalmaya göndərildi"+(nf?" · "+nf+" malın firması kataloqda yoxdur, Satınalma seçəcək":""));
}
function makeOrder(items, note, photos, files){
  const now = new Date().toISOString(), tech = role==="Texnoloq";
  const rw = REQ_W.includes(role);
  const o = { id:nextId(), from:role, wh: tech ? "Anbar" : REQ.includes(role) ? (WAREHOUSES.includes(draft.wh) ? draft.wh : "Anbar") : role, req: rw || undefined, needAt: rw ? draft.need : undefined, ansBy: !rw && draft.ansBy ? draft.ansBy : undefined, techOrder: tech || undefined, sample: (tech && draft.sample) || undefined, created:now, items, status:"acik", last_move:now,
    note, photos, files, comments:[], history:[] };
  addLog(o,"Sifariş yaradıldı",o.note);
  if (rw) o.status = "istek";
  S.orders.unshift(o);
  if (rw){ notify([o.wh], "note", "📤 "+o.from+" sifariş göndərdi · #"+o.id, "Lazımdır: "+needTxt(o)+" · qəbul edin, anbarda yoxdursa Satınalmaya göndərin", o.items.slice(0,6).map(i=>pname(i.pid)+" "+i.qty), o.id); return o; }
  notify(["Satınalma"], "note", "Yeni sifariş #"+o.id+" · "+o.from, o.items.length+" mal · qəbul edib gəliş gününü təyin edin", o.items.slice(0,6).map(i=>pname(i.pid)+" "+i.qty), o.id);
  return o;
}
// Excel-in hər vərəqi ayrıca sifariş: adlar kataloqla uyğunlaşdırılır, tapılmayan ad kataloqa "yeni" kimi düşür
function sendSheets(){
  const tech = role==="Texnoloq", made = [];
  draft.xls.sheets.forEach(n=>{
    const all = parseOrderSheet(draft.wb.Sheets[n]); if (!all.length) return;
    const bl = [...new Set(all.map(r=>r.blk||0))];
    bl.forEach((b,bi)=>{ const rows = all.filter(r=>(r.blk||0)===b);
    const items = rows.map(r=>{ const pid = matchPid(r.name) || ensureProd(r.name, r.firm); const x = { pid:Number(pid), qty:withUnit(r.qty, Number(pid)) }; if (r.left) x.left = withUnit(r.left, Number(pid));
      if (r.firm && !pfirm(x.pid)) x.firm = r.firm; if (tech) x.tech = true; if (needDep() && depOf(n)) x.dep = depOf(n); return x; });
    const one = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(one, draft.wb.Sheets[n], n.slice(0,31));
    const b64 = XLSX.write(one,{type:"base64",bookType:"xlsx"});
    const file = { name:draft.xls.name.replace(/\.[^.]+$/,"")+" — "+n+".xlsx", size:Math.round(b64.length*3/4), data:"data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,"+b64, xls:true, by:role, at:new Date().toISOString() };
    made.push(makeOrder(items, [draft.note.trim(), "Excel: "+n+(bl.length>1?" · "+ord(bi+1)+" dəstə":"")].filter(Boolean).join(" · "), draft.photos.slice(), [file]));
    });
  });
  if (!made.length) return toast("Vərəqlərdə mal tapılmadı");
  save(); draft = newDraft(); tab = "home"; render();
  toast(made.length+" sifariş Satınalmaya göndərildi: "+made.map(o=>"#"+o.id).join(", "));
}

document.addEventListener("paste", e => {

  const el = e.target; if (el && (el.tagName==="INPUT" || el.tagName==="TEXTAREA" || el.isContentEditable)) return;

// Bir dəfə açıb iki ölçüdə JPEG verir (telefonda böyük şəkli iki dəfə açmamaq üçün)
function shrink2(file, a, b){
  return new Promise(res=>{
    const r = new FileReader();
    r.onerror = () => res([null,null]);
    r.onload = () => { const img = new Image();
      img.onerror = () => res([null,null]);
      img.onload = () => {
        const out = [a,b].map(max=>{ const k = Math.min(1, max/Math.max(img.width,img.height)); const c = document.createElement("canvas");
          c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
          try { return c.toDataURL("image/jpeg",.8); } catch(e){ return null; } });
        res(out); };
      img.src = r.result; };
    r.readAsDataURL(file);
  });
}
function shrink(file, max){
  return new Promise(res=>{
    const r = new FileReader();
    r.onerror = () => res(null);
    r.onload = () => { const img = new Image();
      img.onerror = () => res(null);
      img.onload = () => {
        const k = Math.min(1, (max||640)/Math.max(img.width,img.height)); const c = document.createElement("canvas");
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        try { res(c.toDataURL("image/jpeg",.8)); } catch(e){ res(null); } };
      img.src = r.result; };
    r.readAsDataURL(file);
  });
}

function paintGot(el){
  if (el.value==="") return;
  const row = el.closest(".irow"), pill = row.querySelector(".st");
  const st = gotState(el.dataset.q, Math.max(0,num(el.value)));
  row.className = "irow "+rowCls(st); pill.className = "pill "+st[1]+" st"; pill.textContent = st[0];

function saveGot(el){

  if (val===i.got) return;
  i.got = val;

  save(); renderTabs();
}

    toast(to.length ? "Göndərildi → "+to.join(", ") : "Şərh yazıldı"); }
  else if (act==="accept") return acceptOrder(o);

  else if (act==="latedate" || act==="latenone"){

    Object.assign(e, { note, by:role, ansAt:new Date().toISOString() });
    if (act==="latedate"){ const d = v("ld"); if (!d) return toast("Yeni tarixi seçin");
      e.newEta = d; o.eta = d; o.last_move = e.ansAt;

      toast("Yeni tarix "+fmtD(d)+" · "+o.wh+" gözləyir");
    } else {
      e.none = true;
      o.items.forEach(i=>{ if (i.got==null && !i.ans){ i.ans = { none:true, note, by:role, at:e.ansAt }; if (hasQC(o)) i.qc = "none"; } });
      finishReceive(o, role, "Gəlməyəcək: "+note);
      notify([o.wh, o.from, "Rəhbərlik"], "res", "#"+o.id+" · "+(o.supplier||"Firmasız")+" gəlməyəcək", "Satınalma: "+note, o.items.map(i=>pname(i.pid)), o.id);

    }

  else if (act==="arrived"){

    addLog(o,"Mal gəldi","");
    if (o.noteTo && o.noteTo.length) notify(o.noteTo.filter(r=>r!==o.wh && !(r==="Texnoloq" && o.items.some(i=>i.tech))), "arr", "#"+o.id+" gəldi · baxın", [o.spNote, ...o.comments.filter(c=>c.to&&c.to.length).map(c=>c.text)].filter(Boolean).join(" · "), [], o.id);

  }
  else if (act==="qcfin"){

  else if (act==="qcok" || act==="qcdone"){

    const nd = o.items.find(i=>(i.mfg && !dtISO(i.mfg)) || (i.exp && !dtISO(i.exp)));

    o.items.forEach(i=>{ if (!i.qc) i.qc = "none"; });
    const after = !!o.qcSkip;
    o.qcAt = new Date().toISOString(); if (!after) o.last_move = o.qcAt; o.qcOpen = true;   // qeydlər (dərəcə, tarix, yoxlayan) sonra "Sifarişi tamamla"da
    if (after) o.qcLateMin = Math.round((Date.now()-new Date(o.arrivedAt||o.qcSkip.at).getTime())/60000);
    const bad = o.items.filter(i=>i.qc!=="ok");
    addLog(o,"Keyfiyyət yoxladı", (bad.length ? bad.map(i=>pname(i.pid)+": "+(i.qc==="bad"?i.qcWhy:"gəlmədi")).join("; ") : "Hamısı uyğundur")+" · Yoxlayan: "+[...new Set(o.items.map(i=>i.qcBy).filter(Boolean))].join(", "));

      notify([o.wh,"Rəhbərlik"].concat(blk.length?["Satınalma"]:[]), blk.length ? "late" : "ok", blk.length ? "⚠ Keyfiyyət sonradan uyğunsuzluq tapdı · #"+o.id+" — malı ayırın" : "✅ Keyfiyyət sonradan yoxladı · #"+o.id+" — hamısı uyğundur",
        (o.supplier||"Firmasız")+" · "+minTxt(o.qcLateMin)+" gecikmə ilə yoxlandı"+(blk.length?" · uyğun olmayan mal istifadə olunmasın":""), blk.map(i=>pname(i.pid)+": "+i.qcWhy), o.id);
      save(); render(); return toast("Yoxlama qeyd olundu ✓");
    }

      (o.supplier||"Firmasız")+" · "+okN+" uyğun"+(blk.length?", "+blk.length+" uyğun deyil":"")+(who?" · yoxlayan: "+who:"")+" — "+o.wh+" qəbulu bitirsin",
      blk.map(i=>pname(i.pid)+": "+i.qcWhy), o.id);
    toast("Anbara OK verildi · "+o.wh+" xəbər tutdu");
  }
  else if (act==="allfull"){ return keep(()=>{ o.items.forEach(i=>{ if (i.qc!=="bad" && i.qc!=="none") i.got = num(i.qty); }); }); }
  else if (act==="receive"){
    if (hasQC(o) && !o.qcAt && !qcLate(o)) return toast("Keyfiyyət yoxlayır — "+qcLeftMin(o)+" dəq sonra özünüz bitirə bilərsiniz");
    const skip = hasQC(o) && !o.qcAt;
    if (skip){ o.qcSkip = { at:new Date().toISOString(), by:role, min:Math.round((Date.now()-new Date(o.arrivedAt||o.last_move).getTime())/60000) };
      addLog(o, "Keyfiyyət yoxlamadan şərti qəbul", "Keyfiyyət "+minTxt(o.qcSkip.min)+" ərzində yoxlamadı — "+role+" qəbulu bitirdi"); }
    o.items.forEach((i,k)=>{ const el=$("got-"+id+"-"+k); if (el && el.value!=="") i.got = Math.max(0,num(el.value)); });
    const n = finishReceive(o, role, v("rn"));
    const kid = splitProblems(o), P = kid || o;           // P — problemli malların sifarişi (ayrılıbsa yeni nömrə)
    const both = kid ? [o, kid] : [o];
    const tr = both.flatMap(x=>x.items.filter(i=>techReady(x,i)).map(i=>({x,i})));
    if (tr.length) (S.alerts||[]).forEach(a=>{ if (a.oid===o.id && a.to && a.to.includes("Texnoloq") && !a.seen.includes("Texnoloq")) a.seen.push("Texnoloq"); });
    if (tr.length) notify(["Texnoloq"], "arr", "#"+o.id+" Anbara qəbul olundu · baxın", (o.supplier||"Firmasız")+" → "+o.wh, tr.map(r=>pname(r.i.pid)+" "+r.i.qty), o.id);
    const pr = P.items.filter(i=>problem(P,i));
    // tam gələnlər üçün başqa şöbələrə bildiriş getmir — yalnız problem olanda
    if (pr.length) notify(["Satınalma",o.from,"Rəhbərlik"], "late", "#"+P.id+" · "+pr.length+" mal gəlmədi / az gəldi"+(kid?" (#"+o.id+"-dən ayrıldı)":""),
      (o.supplier||"Firmasız")+" → "+o.wh+(kid?" · qalan "+o.items.length+" mal tam gəldi":"")+" · Satınalma cavab verməlidir", pr.map(i=>pname(i.pid)+": "+problem(P,i)), P.id);
    if (skip) notify(["Keyfiyyət","Rəhbərlik"], "late", "⚠ Keyfiyyət yoxlamadan şərti qəbul · #"+o.id, o.wh+" qəbulu bitirdi ("+minTxt(o.qcSkip.min)+" gözlədi) · Keyfiyyət malı sonradan yoxlamalıdır", o.items.slice(0,6).map(i=>pname(i.pid)+" "+i.qty), o.id, "qc-skip-"+o.id);
    toast(kid ? "Qəbul bitdi · "+o.items.length+" mal tam · "+pr.length+" problemli mal #"+kid.id+"-ə ayrıldı" : n ? n+" mal üçün Satınalma cavab verəcək" : techPending(o) ? "Qəbul olundu · Texnoloq yoxlayacaq" : "Hamısı tam qəbul olundu ✓");
  }
  else if (act==="cancel"){ o.status="redd"; addLog(o,"Rəhbərlik ləğv etdi",""); }
  save(); render();
}

// ----- Admin: firma–mal Excel-i -----
// 1) başlıqda "Firma" və "Mal/Məhsul/Ad/Nomenklatur" sütunları; 2) başlıq yoxdursa: tək xanalı sətir — firma adı, altındakı sətirlər — onun malları
let fmReport = "";
async function importFirmMap(file){
  if (!window.XLSX) return toast("Excel oxuyucu yüklənmədi, internet bağlantısını yoxlayın");
  let wb; try { wb = XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:"array", cellStyles:true}); } catch(e){ return toast("Faylı oxumaq olmadı"); }
  const pairs = [];
  // Rəngli forma: firmanın adı rəngli (məs. sarı) xanada, malları altında eyni sütunda; bir vərəqdə bir neçə sütun ola bilər
  const colored = c => !!(c && c.s && c.s.patternType && c.s.patternType!=="none" && c.s.fgColor && (c.s.fgColor.rgb ? !/^(FF)?FFFFFF$/i.test(c.s.fgColor.rgb) : c.s.fgColor.theme!=null));
  const clean = v => String(v??"").replace(/\s+/g," ").trim();
  wb.SheetNames.forEach(sn=>{
    const ws = wb.Sheets[sn]; if (!ws["!ref"]) return;
    const rg = XLSX.utils.decode_range(ws["!ref"]); const before = pairs.length; let nColored = 0;
    for (let C=rg.s.c; C<=rg.e.c; C++){
      let firm = "";
      for (let R=rg.s.r; R<=rg.e.r; R++){
        const c = ws[XLSX.utils.encode_cell({r:R,c:C})], v = clean(c && (c.w ?? c.v));
        if (!v) continue;
        if (colored(c)){ firm = v; nColored++; continue; }
        if (firm) pairs.push([v, firm]);
      }
    }
    if (nColored && pairs.length>before) return;
    pairs.length = before;
    const A = XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:""}).map(r=>r.map(c=>String(c??"").replace(/\s+/g," ").trim()));
    let hr = -1, cN = -1, cF = -1;
    for (let r=0; r<Math.min(A.length,10) && hr<0; r++){
      const f = A[r].findIndex(c=>/^(firma|təchizatçı|techizatci|tədarükçü|supplier)/i.test(c)), n = A[r].findIndex(c=>/^(mal|məhsul|mehsul|ad|adı|nomenklatur|xammal)/i.test(c));
      if (f>=0 && n>=0){ hr = r; cF = f; cN = n; }
    }
    if (hr>=0){ A.slice(hr+1).forEach(r=>{ if (r[cN] && r[cF]) pairs.push([r[cN], r[cF]]); }); return; }
    let firm = "";
    A.forEach(r=>{ const cells = r.filter(Boolean); if (!cells.length) return;
      if (cells.length===1 && !pidByName(cells[0])){ firm = cells[0]; return; }
      if (firm) pairs.push([r.find(Boolean), firm]); });
  });
  if (!pairs.length){ fmReport = "Faylda firma–mal cütü tapılmadı. İki forma tanınır: 1) firmanın adı <b>rəngli (sarı)</b> xanada, malları altında; 2) sütun başlıqları <b>Mal</b> və <b>Firma</b>."; render(); return; }
  let linked = 0, created = 0; const newF = new Set(), firmOf = n => S.firms.find(f=>normName(f)===normName(n)) || findFirm(n);
  pairs.forEach(([n,f])=>{
    let firm = firmOf(f); if (!firm){ firm = f; S.firms.push(f); newF.add(f); }
    let id = matchPid(n);
    if (!id){ const p = { id:newPid(), name:n, firm, size:guessSize(n), unit:"", fromExcel:true }; S.products.push(p); created++; }
    else { prod(id).firm = firm; delete prod(id).deleted; linked++; }
  });
  S.firms.sort((a,b)=>a.localeCompare(b,"az"));
  S.log.push({by:role,act:"Firma–mal siyahısı yükləndi",note:file.name+" · "+pairs.length+" mal",at:now()});
  const perF = {}; pairs.forEach(([n,f])=>{ const k = firmOf(f)||f; perF[k] = (perF[k]||0)+1; });
  fmReport = "<b>"+esc(file.name)+"</b>: "+pairs.length+" mal "+Object.keys(perF).length+" firmaya bağlandı"+(created?" (<span class=\"newtag\">"+created+" yeni mal</span> kataloqa əlavə olundu)":"")+(newF.size?" · yeni firmalar: "+[...newF].map(esc).join(", "):"")+".<div class=\"meta\">"+Object.entries(perF).map(([f,n])=>esc(f)+" — "+n).join(" · ")+"</div>";
  save(); render(); toast(pairs.length+" mal firmalara bağlandı");
}

function addToFirm(){
  if (role!=="Admin") return;
  const name=$("ffN").value.trim(); if (!name) return toast("Məhsulun adını yazın və ya seçin");
  const id=pidByName(name);
  if (id){ const p=prod(id), old=p.firm; p.firm=catFirm; S.log.push({by:role,act:"Məhsul firmaya əlavə edildi",note:p.name+" · "+(old||"firmasız")+" → "+catFirm,at:now()}); toast(p.name+" → "+catFirm); }
  else { const p={id:newPid(),name,firm:catFirm,size:guessSize(name)}; S.products.push(p); S.log.push({by:role,act:"Kataloqa məhsul əlavə edildi",note:name+" · "+catFirm,at:now()}); toast("Yeni məhsul: "+name+" · "+catFirm); }
  save(); render();
}
function addFirm(){
  if (role!=="Admin") return;
  const f=$("fN").value.trim(); if(!f) return toast("Firmanın adını yazın");
  if (S.firms.some(x=>x.toLowerCase()===f.toLowerCase())) return toast("Bu firma artıq var");
  S.firms.push(f); S.firms.sort((a,b)=>a.localeCompare(b,"az"));
  S.log.push({by:role,act:"Firma əlavə edildi",note:f,at:now()});
  save(); render(); toast(f+" əlavə olundu");
}
function delFirm(f){
  if (role!=="Admin") return;
  S.firms = S.firms.filter(x=>x!==f);
  if (catFirm===f) catFirm="";
  S.products.forEach(p=>{ if (p.firm===f) p.firm=""; });
  S.log.push({by:role,act:"Firma silindi",note:f,at:now()});
  save(); render(); toast(f+" silindi");
}

// Saat keçdikcə vaxt nişanlarını yenilə (yazı yazılarkən yox)
setInterval(()=>{ const f=document.activeElement; if (tab!=="new" && tab!=="catalog" && !Object.keys(addDraft).length && !(f && f.closest && f.closest("#main input, #main textarea, #main select"))) render(); }, 60000);
draft = newDraft();
// Aşağıdakı xidməti sətir (versiya · çıxış · Telegram) menyunun altında sabit durur: hündürlüyü ölçülür, menyu onun üstünə qalxır
(function footH(){
  const set = () => { const f = document.querySelector("main>.foot"); document.documentElement.style.setProperty("--fh", (f ? f.offsetHeight : 0)+"px"); };
  new MutationObserver(set).observe($("main"), { childList:true }); addEventListener("resize", set); set();

// Sol yuxarıda saat və tarix
(function tickClock(){
  const el = $("clk"); if (el){ const d = new Date(), p = n => String(n).padStart(2,"0");
    el.innerHTML = '<b>'+p(d.getHours())+':'+p(d.getMinutes())+'</b><span class="ckd"> · <span class="ckw">'+wday(today())+' </span>'+p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+'</span>'; }
  setTimeout(tickClock, (60 - new Date().getSeconds())*1000 + 50);
})();

var lgHold = null;
function loginClose(){ ["nl","nlLoad"].forEach(id=>{ const x = $(id); if (x) x.remove(); }); document.body.classList.remove("nl-on"); }
// ===================== Mavi giriş ekranı (2-ci şəkil, yuxarıdakı şəkil olmadan) =====================
const LOGO_ARC = id => '<svg viewBox="0 0 280 120" aria-hidden="true"><defs><linearGradient id="'+id+'" x1="0" x2="1"><stop offset="0" stop-color="#3445B0" stop-opacity="0"/><stop offset=".6" stop-color="#5B7BFF"/><stop offset="1" stop-color="#9CC2FF"/></linearGradient></defs><path class="arc" d="M20 78 Q140 -10 252 34"/><circle cx="252" cy="34" r="3.5" fill="#7FA6FF"/></svg>';
function ldrHtml(t, sub){
  const dots = [0,1,2,3,4,5,6,7].map(k=>'<i style="--a:'+(-26-k*22)+'deg;--s:'+(9-k)+'px;--o:'+(1-k*.11).toFixed(2)+'"></i>').join("");
  return '<div class="ldr" role="status"><div class="orb">'+dots+'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="6.5" ry="10" fill="#C08A55"/><path d="M12 3 C9 8 9 16 12 21" stroke="#8A5A2E" stroke-width="1.2" fill="none"/></svg></div><b>'+esc(t)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':"")+'</div>';
}
function nlLoading(on){
  const x = $("nlLoad"); if (!on){ if (x) x.remove(); return; }
  if (x) return; const d = document.createElement("div"); d.id = "nlLoad"; d.innerHTML = ldrHtml("Daxil olunur", "Sifarişləriniz hazırlanır"); document.body.appendChild(d);
}

  const el = document.createElement("div"); el.id = "nl";

    '<h2>Xoş gəlmisiniz</h2><div class="sub">Sifarişləriniz sizi gözləyir</div>'+
    '<form id="lf" style="display:flex;flex-direction:column;gap:14px">'+
      '<label class="fld"><i>🏢</i>'+selectHtml+'</label>'+
      '<label class="fld"><i>🔒</i><input id="lp" class="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="Parol (4 rəqəm)"><button type="button" class="eye" id="leye" aria-label="Parolu göstər">👁</button></label>'+
      '<div class="row2"><label><input type="checkbox" id="lrem">Parolu yadda saxla</label></div>'+
      '<button class="lbtn" id="lb">Daxil ol</button><div class="lnote" id="lnote">'+esc(msg||"")+'</div></form>'+
    '<div class="foot2">'+(isStandalone()?"":'<button type="button" class="linkb" id="linst" style="font-size:15px">📲 Telefona yüklə</button><br>')+'Almond · Anbar zənciri</div></div>';
  document.body.appendChild(el); document.body.classList.add("nl-on");
  $("leye").onclick = () => { const i = $("lp"); i.type = i.type==="password" ? "text" : "password"; };
  if ($("linst")) $("linst").onclick = installGo;
}
// Telegram-dakı "Proqramda aç" linki: .../app/#o=105 → daxil olandan sonra həmin sifariş açılır
function openDeep(){
  const m = /[#&]o=(\d+)/.exec(location.hash||""); if (!m) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
  const id = Number(m[1]), o = S.orders.find(x=>x.id===id) || (S.trash||[]).find(x=>x.id===id);
  if (!o) return toast("#"+id+" sifarişi tapılmadı (silinib ola bilər)");
  tab = "orders"; osec = "aktiv"; filter = "all"; oq = "#"+id; RF = RT = ""; openMore.add(id); fullSet.add(id); render();
  const el = $("o-"+id); if (el) el.scrollIntoView({block:"start"});
}
window.addEventListener("hashchange", ()=>{ if ((!ONLINE || Cloud.me()) && /o=\d+/.test(location.hash)) openDeep(); });
if (ONLINE) Cloud.start(); else { $("sub").textContent = "Anbar zənciri · nümunə"; renderRole(); render(); openDeep(); }
