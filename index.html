<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sual Zənciri</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e2e5ea;--accent:#2563eb;--late:#b91c1c;--ok:#15803d;--soft:#eef2f7}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,textarea,select,button{font:inherit;color:inherit}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{min-height:60px;resize:vertical}
button{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:12px 14px 60px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card.late{border-color:var(--late)}
.card.mine{border-color:var(--accent)}
.meta{color:var(--muted);font-size:12px;margin-bottom:6px}
.q{font-weight:600;margin-bottom:8px}
.b{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.b.ok{background:#dcfce7;color:#166534}.b.warn{background:#fef3c7;color:#92400e}.b.late{background:#fee2e2;color:#991b1b}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:8px;font-size:12px}
.step{padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.step.done{color:var(--ok);border-color:var(--ok)}.step.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.comment{font-size:13px;color:var(--muted);margin-top:4px}
.comment b{color:var(--text)}
.hint{color:var(--muted);font-size:12px}
.err{color:var(--late);font-size:13px;min-height:18px}
.checks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.checks label{border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px}
.checks input{width:auto;margin-right:4px}
</style>
</head> 
 
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14532d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sual Zənciri">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
 
<body>

<!-- Giriş ekranı -->
<main id="loginView" style="display:none;max-width:380px;margin-top:60px">
  <div class="card">
    <h2 style="margin-top:0">Sual Zənciri</h2>
    <select id="loginDept"></select>
    <div style="height:8px"></div>
    <input id="password" type="password" placeholder="Şifrə" autocomplete="current-password">
    <div style="height:10px"></div>
    <button class="pri" id="loginBtn" style="width:100%">Daxil ol</button>
    <div class="err" id="loginErr"></div>
  </div>
</main>

<!-- Əsas ekran -->
<div id="appView" style="display:none">
  <header>
    <div class="row" style="justify-content:space-between">
      <b style="font-size:18px">Sual Zənciri</b>
      <div class="row"><span class="hint" id="whoami"></span><button id="logoutBtn">Çıxış</button></div>
    </div>
    <div class="err" id="status"></div>
    <div class="row" style="margin-top:6px">
      <button data-tab="all" class="on">Hamısı</button>
      <button data-tab="mine">Mənim növbəm</button>
      <button data-tab="late">Gecikmiş</button>
      <button data-tab="done">Cavablanmış</button>
    </div>
    <div style="margin-top:8px"><input id="search" placeholder="Axtar..."></div>
  </header>

  <main>
    <div class="card">
      <details id="newBox">
        <summary style="cursor:pointer;font-weight:600">+ Yeni sual göndər</summary>
        <div style="margin-top:10px">
          <textarea id="newText" placeholder="Sualı yazın"></textarea>
          <div class="hint">Keçəcəyi şöbələri seçin (seçdiyiniz ardıcıllıqla gedir):</div>
          <div class="checks" id="newChain"></div>
          <div class="row" style="margin-top:6px">
            <span class="hint">Müddət:</span>
            <select id="newDeadline" style="width:auto">
              <option value="4">4 saat</option>
              <option value="24" selected>24 saat</option>
            </select>
          </div>
          <div class="row" style="margin-top:8px">
            <label class="hint" style="cursor:pointer">📎 Fayl <input type="file" id="newFile" multiple></label>
            <span class="hint" id="newFileList"></span>
          </div>
          <div style="margin-top:8px"><button class="pri" id="sendNew">Göndər</button></div>
        </div>
      </details>
    </div>
    <div id="list"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== Bunları öz Supabase layihənizdən götürüb yazın =====
const SUPABASE_URL = "https://qzvyawuhmqdhzawfihzy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6dnlhd3VobXFkaHphd2ZpaHp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMDgwMzYsImV4cCI6MjEwODU4NDAzNn0.Csy6z2xsfBGxX_6m5WqpZV4PwK8_LTXn7uEF_K2311s";
// ==========================================================

const DEPTS = ["Anbar","Anbar (İnqilab)","Satınalma","Texnoloq","Keyfiyyət","İstehsalat","Satış","Rəhbərlik"];
const HOUR = 3600000;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let me = null;          // { id, dept }
let questions = [];
let comments = [];
let tab = "all";
let search = "";
let newOrder = [];
let newFiles = [];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = t => new Date(t).toLocaleString("az-AZ",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const fmtAge = ms => { const m = Math.max(1, Math.floor(ms/60000)); if (m < 60) return m + " dəq"; const h = Math.floor(m/60); return h < 24 ? h + " saat" : Math.floor(h/24) + " gün " + (h%24) + " saat"; };
const setStatus = t => { $("status").textContent = t; };

// Müddət keçibsə növbə Rəhbərliyə keçir
const overdue = q => q.status === "open" && (Date.now() - new Date(q.last_move)) > q.deadline_h * HOUR;
const holder = q => overdue(q) ? "Rəhbərlik" : q.chain[q.step];

// ---------- Giriş ----------
async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  await loadProfile(session.user.id);
}
function showLogin(){
  $("appView").style.display = "none";
  $("loginView").style.display = "block";
}
async function loadProfile(uid){
  const { data, error } = await sb.from("profiles").select("dept").eq("id", uid).single();
  if (error || !data) { await sb.auth.signOut(); $("loginErr").textContent = "Bu hesab heç bir şöbəyə bağlanmayıb."; return showLogin(); }
  me = { id: uid, dept: data.dept };
  $("whoami").innerHTML = "Daxil olub: <b>" + esc(me.dept) + "</b>";
  $("loginView").style.display = "none";
  $("appView").style.display = "block";
  renderNewChain();
  await loadAll();
  subscribe();
}

// Hər şöbənin daxili e-poçtu: slug@sual.local (istifadəçi görmür)
const SLUGS = {"Anbar":"anbar","Anbar (İnqilab)":"anbar-inqilab","Satınalma":"satinalma","Texnoloq":"texnoloq","Keyfiyyət":"keyfiyyet","İstehsalat":"istehsalat","Satış":"satis","Rəhbərlik":"rehberlik"};
$("loginDept").innerHTML = DEPTS.map(d => '<option value="' + esc(d) + '">' + esc(d) + '</option>').join("");

$("loginBtn").onclick = async () => {
  $("loginErr").textContent = "";
  const email = SLUGS[$("loginDept").value] + "@sual.local";
  const { error } = await sb.auth.signInWithPassword({ email, password: $("password").value });
  if (error) return $("loginErr").textContent = "E-poçt və ya şifrə yanlışdır.";
  init();
};
$("logoutBtn").onclick = async () => { await sb.auth.signOut(); me = null; showLogin(); };

// ---------- Məlumat ----------
async function loadAll(){
  const [q, c] = await Promise.all([
    sb.from("questions").select("*").order("created", { ascending: false }),
    sb.from("comments").select("*").order("created", { ascending: true })
  ]);
  if (q.error) return setStatus("Yüklənmədi: " + q.error.message);
  questions = q.data || [];
  comments = c.data || [];
  render();
}
let channel = null;
function subscribe(){
  if (channel) return;
  channel = sb.channel("sual-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "questions" }, () => loadAll())
    .on("postgres_changes", { event: "*", schema: "public", table: "comments" }, () => loadAll())
    .subscribe();
}

async function addLog(q, action, note){
  const log = (q.log || []).concat([{ by: me.dept, action, note: note || "", at: new Date().toISOString() }]);
  return log;
}

// ---------- Əməliyyatlar ----------
async function answer(id){
  const q = questions.find(x => x.id === id);
  const txt = $("ans-" + id).value.trim();
  if (!txt) return setStatus("Cavab boş ola bilməz.");
  const log = await addLog(q, "cavab", txt);
  const { error } = await sb.from("questions").update({
    status: "answered", answer: txt, answered_by: me.dept,
    last_move: new Date().toISOString(), log
  }).eq("id", id);
  if (error) return setStatus("Cavab saxlanmadı: " + error.message);
  setStatus("");
}

async function forward(id){
  const q = questions.find(x => x.id === id);
  if (overdue(q) || q.step + 1 >= q.chain.length) return setStatus("Ötürmək mümkün deyil.");
  const log = await addLog(q, "ötürüldü → " + q.chain[q.step + 1], "");
  const { error } = await sb.from("questions").update({
    step: q.step + 1, last_move: new Date().toISOString(), log
  }).eq("id", id);
  if (error) setStatus("Ötürülmədi: " + error.message);
}

async function comment(id){
  const txt = $("com-" + id).value.trim();
  if (!txt) return;
  const { error } = await sb.from("comments").insert({ question_id: id, dept: me.dept, text: txt });
  if (error) setStatus("Şərh yazılmadı: " + error.message);
  else $("com-" + id).value = "";
}

async function uploadFiles(fileList){
  const out = [];
  for (const f of Array.from(fileList)) {
    const path = Date.now() + "-" + f.name.replace(/[^\w.\-]/g, "_");
    const { error } = await sb.storage.from("sual-fayllar").upload(path, f, { contentType: f.type || undefined });
    if (error) { setStatus("Fayl yüklənmədi: " + f.name + " (" + error.message + ")"); continue; }
    const { data } = sb.storage.from("sual-fayllar").getPublicUrl(path);
    out.push({ url: data.publicUrl, name: f.name, type: f.type });
  }
  return out;
}

async function attachToQuestion(id, input){
  const q = questions.find(x => x.id === id);
  const uploaded = await uploadFiles(input.files);
  input.value = "";
  if (!uploaded.length) return;
  const files = (q.files || []).concat(uploaded);
  const log = await addLog(q, "fayl", uploaded.map(x => x.name).join(", "));
  const { error } = await sb.from("questions").update({ files, log, last_move: q.last_move }).eq("id", id);
  if (error) setStatus("Fayl əlavə olunmadı: " + error.message);
}

$("newFile").onchange = async e => {
  newFiles = newFiles.concat(await uploadFiles(e.target.files));
  e.target.value = "";
  $("newFileList").textContent = newFiles.length ? newFiles.length + " fayl: " + newFiles.map(x => x.name).join(", ") : "";
};

$("sendNew").onclick = async () => {
  const text = $("newText").value.trim();
  if (!text) return setStatus("Sual yazın.");
  if (!newOrder.length) return setStatus("Ən azı bir şöbə seçin.");
  const { error } = await sb.from("questions").insert({
    text, from_dept: me.dept, chain: newOrder.slice(), step: 0,
    deadline_h: Number($("newDeadline").value), files: newFiles,
    log: [{ by: me.dept, action: "sual", note: "Sual göndərildi", at: new Date().toISOString() }]
  });
  if (error) return setStatus("Göndərilmədi: " + error.message);
  $("newText").value = ""; newOrder = []; newFiles = [];
  $("newFileList").textContent = ""; $("newBox").open = false;
  renderNewChain(); setStatus("");
};

function renderNewChain(){
  $("newChain").innerHTML = DEPTS.filter(d => d !== me?.dept).map(d => {
    const i = newOrder.indexOf(d);
    return '<label><input type="checkbox" data-dept="' + esc(d) + '" ' + (i >= 0 ? "checked" : "") + '>' + (i >= 0 ? (i+1) + ". " : "") + esc(d) + '</label>';
  }).join("");
}
$("newChain").addEventListener("change", e => {
  const d = e.target.dataset.dept;
  if (!d) return;
  newOrder = e.target.checked ? newOrder.concat([d]) : newOrder.filter(x => x !== d);
  renderNewChain();
});

// ---------- Görünüş ----------
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x === b));
  render();
});
$("search").oninput = e => { search = e.target.value.toLowerCase(); render(); };

function visible(q){
  if (search) {
    const hay = (q.text + " " + q.from_dept + " " + q.chain.join(" ")).toLowerCase();
    if (!hay.includes(search)) return false;
  }
  if (tab === "mine") return q.status === "open" && holder(q) === me.dept;
  if (tab === "late") return overdue(q);
  if (tab === "done") return q.status === "answered";
  return true;
}

function card(q){
  const cur = holder(q);
  const waited = Date.now() - new Date(q.last_move);
  const late = overdue(q);
  const mine = q.status === "open" && cur === me.dept;
  let badge;
  if (q.status === "answered") badge = '<span class="b ok">Cavablandı · ' + esc(q.answered_by) + '</span>';
  else if (late) badge = '<span class="b late">GECİKİB · Rəhbərlik · ' + fmtAge(waited) + ' gözləyir</span>';
  else badge = '<span class="b warn">Gözləyir: ' + esc(cur) + ' · ' + fmtAge(waited) + '</span>';

  const chain = [q.from_dept].concat(q.chain).map((d, i) => {
    const idx = i - 1;
    let c = "step";
    if (i === 0 || (q.status === "answered" && idx <= q.step) || (q.status === "open" && idx < q.step)) c += " done";
    else if (q.status === "open" && idx === q.step) c += " cur";
    return '<span class="' + c + '">' + esc(d) + '</span>';
  }).join(" → ");

  const files = (q.files || []).map(f => f.type && f.type.indexOf("image/") === 0
    ? '<a href="' + esc(f.url) + '" target="_blank"><img src="' + esc(f.url) + '" style="max-width:100%;border-radius:8px;margin:4px 0"></a>'
    : '<div><a href="' + esc(f.url) + '" target="_blank">📎 ' + esc(f.name) + '</a></div>').join("");

  const cs = comments.filter(c => c.question_id === q.id).map(c => '<div class="comment"><b>' + esc(c.dept) + '</b>: ' + esc(c.text) + '</div>').join("");

  let actions = "";
  if (mine) {
    actions += '<textarea id="ans-' + q.id + '" placeholder="Cavabınızı yazın..."></textarea>';
    actions += '<div style="margin-top:6px"><button class="pri" data-act="answer" data-id="' + q.id + '">Cavab ver və bağla</button></div>';
    if (!late && q.step + 1 < q.chain.length) actions += '<div style="margin-top:6px"><button data-act="forward" data-id="' + q.id + '">Növbəti şöbəyə ötür → ' + esc(q.chain[q.step+1]) + '</button></div>';
  }
  const commentBox = late ? "" : '<div class="row" style="margin-top:8px"><input id="com-' + q.id + '" placeholder="Şərh yazın" style="flex:1"><button data-act="comment" data-id="' + q.id + '">Şərh</button></div>';
  const fileBox = '<label class="hint" style="cursor:pointer">📎 Fayl əlavə et <input type="file" data-upload="' + q.id + '" style="max-width:220px"></label>';

  return '<div class="card' + (late ? " late" : "") + (mine ? " mine" : "") + '">' +
    badge +
    '<div class="meta">#' + q.id + ' · Göndərən: ' + esc(q.from_dept) + ' · ' + fmtTime(q.created) + ' · müddət: ' + q.deadline_h + ' saat</div>' +
    '<div class="q">' + esc(q.text) + '</div>' +
    '<div class="chain">' + chain + '</div>' +
    (q.status === "answered" ? '<div class="comment"><b>Cavab:</b> ' + esc(q.answer) + '</div>' : "") +
    files + '<div style="margin-top:6px">' + fileBox + '</div>' +
    '<div style="margin-top:8px">' + actions + '</div>' +
    commentBox + cs +
    '</div>';
}

function render(){
  if (!me) return;
  const items = questions.filter(visible).sort((a, b) => {
    if (a.status !== b.status) return a.status === "open" ? -1 : 1;
    return a.status === "open" ? new Date(a.last_move) - new Date(b.last_move) : new Date(b.last_move) - new Date(a.last_move);
  });
  $("list").innerHTML = items.length ? items.map(card).join("") : '<div class="hint" style="text-align:center;padding:30px">Bu görünüşdə sual yoxdur.</div>';
}

// Hadisələr (delegation)
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const id = Number(b.dataset.id);
  if (b.dataset.act === "answer") answer(id);
  if (b.dataset.act === "forward") forward(id);
  if (b.dataset.act === "comment") comment(id);
});
$("list").addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.upload) attachToQuestion(Number(e.target.dataset.upload), e.target);
});

// Gecikmənin vaxtı keçdikcə görünüşü yenilə
setInterval(render, 60000);

init();
</script>
</body>
</html>
