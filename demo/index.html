<style>
/* Layout: sticky header with role switcher + tab bar; single 900px column of work cards; summary tiles first */
:root{
  --bg:#F4E9D8; --surface:#FFFBF4; --sunk:#EADBC4; --line:#DCC7A6;
  --fg:#33190A; --muted:#7A5C43; --accent:#6B3413; --accent-fg:#FFF8EE;
  --ok:#2F7A3E; --ok-bg:#DDEFD9; --warn:#9A5B00; --warn-bg:#FBE9C8; --bad:#B42318; --bad-bg:#FBDAD5; --info:#2B5D8A; --info-bg:#DCE8F3;
  --display:"Noto Serif",Georgia,serif; --body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Noto Sans Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D140E; --surface:#281C14; --sunk:#33251B; --line:#4A3628;
  --fg:#F3E5D0; --muted:#C2A385; --accent:#E0A46C; --accent-fg:#26160B;
  --ok:#8BD49A; --ok-bg:#1F3A25; --warn:#F2C26B; --warn-bg:#3D2E12; --bad:#FF9C8F; --bad-bg:#45201B; --info:#9CC6EE; --info-bg:#1C2F42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D140E; --surface:#281C14; --sunk:#33251B; --line:#4A3628;
  --fg:#F3E5D0; --muted:#C2A385; --accent:#E0A46C; --accent-fg:#26160B;
  --ok:#8BD49A; --ok-bg:#1F3A25; --warn:#F2C26B; --warn-bg:#3D2E12; --bad:#FF9C8F; --bad-bg:#45201B; --info:#9CC6EE; --info-bg:#1C2F42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--muted)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.who label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.who select{width:auto;min-width:190px;font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs button{flex:0 0 auto;background:transparent;border:1px solid transparent;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center}
main.wrap{padding-block:16px 60px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:22px;margin:4px 0 0;text-wrap:balance}
h3{font-size:15px;margin:0}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:56px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{filter:brightness(.97)}
button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.okb{background:var(--ok);color:#fff;border-color:var(--ok)}
button.badb{background:transparent;color:var(--bad);border-color:var(--bad)}
button.sm{padding:4px 9px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.mine{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card.late{border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px;min-width:0}
.meta{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-mute{background:var(--sunk);color:var(--muted)}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.chain .s{padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chain .s.done{color:var(--ok);border-color:var(--ok)}
.chain .s.cur{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.chain .ar{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.tile b{display:block;font-family:var(--mono);font-size:26px;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.low{color:var(--bad);font-weight:700}
.box{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px;background:var(--bg)}
.checks label.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.checks input{display:none}
.photos{display:flex;gap:6px;flex-wrap:wrap}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:8px;padding:6px 8px;font-size:13px}
.fic{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--ok-bg);color:var(--ok);border-radius:4px;padding:2px 5px}
.btnlink{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px;color:var(--fg);text-decoration:none}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.sheet td{font-size:12px;padding:4px 6px;white-space:nowrap}
.pname{padding:4px 8px;background:transparent;border-color:transparent;min-width:160px}
.pname:hover{border-color:var(--line)}
.pname:focus{background:var(--bg);border-color:var(--accent)}
.firms{display:flex;flex-wrap:wrap;gap:6px}
.firm{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;background:var(--bg)}
.firm button{padding:0 7px;border-radius:999px;font-size:13px;line-height:20px}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.log{font-size:13px;display:flex;flex-direction:column;gap:3px;border-left:2px solid var(--line);padding-left:10px}
.log b{font-weight:600}
details>summary{cursor:pointer;color:var(--muted);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase}
.cal .d{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:58px;padding:4px 6px;font-size:13px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cal .d.x{visibility:hidden}
.cal .d.today{outline:2px solid var(--accent)}
.cal .d.has{background:var(--info-bg);border-color:var(--info)}
.cal .d.due{background:var(--bad-bg);border-color:var(--bad)}
.cal .d small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .d.sel{box-shadow:0 0 0 2px var(--fg) inset}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20}
.banner{background:var(--info-bg);color:var(--info);border-radius:10px;padding:10px 12px;font-size:13px}
.items-edit .it{display:grid;grid-template-columns:minmax(0,1fr) 110px 32px;gap:6px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function addLog(o, act, note){
  const h = { by:role, act, note:note||"", at:new Date().toISOString() };
  if (o) { o.history.push(h); h.ref = "Sifariş #"+o.id; }
  S.log.push(h);
}
function stockAdd(loc,pid,q){ S.stock[loc][pid] = Math.max(0,(S.stock[loc][pid]||0)+q); }

// ===================== Sifariş vəziyyəti =====================
const holder = o => o.status==="bagli"||o.status==="redd" ? null : o.chain[o.step];
const isOpen = o => o.status!=="bagli" && o.status!=="redd";
const late = o => isOpen(o) && (Date.now()-new Date(o.last_move)) > o.deadline_h*HOUR;
const mine = o => isOpen(o) && (holder(o)===role || (late(o) && role==="Rəhbərlik"));
const STATUS = {
  acik:["Açıq","p-warn"], yolda:["Yolda","p-info"], qebul:["Anbara qəbul edildi","p-ok"],
  bagli:["Tamamlandı","p-ok"], redd:["Rədd edildi","p-bad"]
};
function advance(o, act, note){
  o.step++; o.last_move = new Date().toISOString();
  addLog(o, act, note);
  if (o.step >= o.chain.length){ o.status = o.status==="redd" ? "redd" : "bagli"; addLog(o,"Zəncir tamamlandı",""); }
}

function vPanel(){

  const lt = S.orders.filter(late);
  const tiles =
    tile("Mənim növbəm", my.length, my.length?"warn":"", "orders:mine") +
    tile("Bu gün / gecikən gəliş", dueToday.length, dueToday.length?"bad":"", "cal") +
    tile("Müddəti keçən", lt.length, lt.length?"bad":"", "orders:late") +
    tile("Yolda olan", S.orders.filter(o=>o.status==="yolda").length, "", "orders:yolda") +

  html += '<div class="tiles">'+tiles+'</div>';

function tile(label,n,cls,go){ return '<button class="tile '+cls+'" data-go="'+go+'"><b>'+n+'</b><span>'+label+'</span></button>'; }

// ----- Sifariş kartı -----
function orderCard(o){
  const h = holder(o), lt = late(o), m = mine(o);
  const [stl, stc] = STATUS[o.status];
  const chain = [o.from].concat(o.chain).map((d,i)=>{
    const idx=i-1; let c="s";
    if (i===0 || idx<o.step) c+=" done"; else if (idx===o.step && isOpen(o)) c+=" cur";
    return '<span class="'+c+'">'+esc(d)+'</span>';
  }).join('<span class="ar">→</span>');
  const rows = o.items.map(i=>{
    const diff = i.got!=null && i.got!==num(i.qty);
    return '<tr><td>'+esc(pname(i.pid))+(pfirm(i.pid)?'<div class="meta">'+esc(pfirm(i.pid))+'</div>':"")+'</td><td class="num">'+esc(i.qty)+'</td><td class="num'+(diff?" low":"")+'">'+(i.got!=null?i.got:"—")+'</td></tr>';
  }).join("");
  let pills = '<span class="pill '+stc+'">'+stl+'</span><span class="pill p-mute">'+esc(o.type)+'</span>';
  if (h) pills += '<span class="pill '+(lt?"p-bad":"p-warn")+'">'+(lt?"GECİKİR · Rəhbərlik":"Növbə: "+esc(h))+' · '+age(Date.now()-new Date(o.last_move))+'</span>';
  if (o.eta && o.status==="yolda"){ const d=daysTo(o.eta); pills += '<span class="pill '+(d<=0?"p-bad":"p-info")+'">Gəliş '+fmtD(o.eta)+(d>0?" · "+d+" gün qalıb":d===0?" · bu gün":" · "+(-d)+" gün gecikir")+'</span>'; }
  const photos = o.photos.length ? '<div class="photos">'+o.photos.map(p=>'<img src="'+p+'" alt="Sifariş şəkli">').join("")+'</div>' : "";
  const comments = o.comments.map(c=>'<div class="hint"><b>'+esc(c.by)+':</b> '+esc(c.text)+'</div>').join("");
  const hist = '<details><summary>Tarixçə ('+o.history.length+')</summary><div class="log">'+o.history.map(x=>'<div><span class="meta">'+fmtT(x.at)+'</span> · <b>'+esc(x.by)+'</b> — '+esc(x.act)+(x.note?': '+esc(x.note):"")+'</div>').join("")+'</div></details>';
  return '<div class="card'+(m?" mine":"")+(lt?" late":"")+'">'+
    '<div class="row" style="justify-content:space-between"><h3><span class="mono">#'+o.id+'</span> · '+esc(o.from)+' → '+esc(o.wh)+'</h3><span class="meta">'+fmtT(o.created)+'</span></div>'+
    '<div class="row">'+pills+'</div>'+
    '<div class="chain">'+chain+'</div>'+

function guessFirm(o){
  const c = {}; o.items.forEach(i=>{ const f=pfirm(i.pid); if (f) c[f]=(c[f]||0)+1; });

// ----- Fayllar (Excel, PDF və s.) -----
const MAXF = 1.5*1024*1024;
function readFile(f){
  if (f.size > MAXF){ toast(f.name+": demo versiyada 1,5 MB-dan böyük fayl olmaz"); return Promise.resolve(null); }
  return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res({name:f.name,size:f.size,data:r.result,by:role,at:new Date().toISOString()}); r.readAsDataURL(f); });
}
const isSheet = n => /\.(xlsx|xlsm|xls|csv)$/i.test(n);
const fsize = b => b>1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";
function fileList(files, key){
  if (!files.length) return "";
  return '<div class="files">'+files.map((f,i)=>'<div class="file"><span class="fic">'+(isSheet(f.name)?"XLS":(f.name.split(".").pop()||"").slice(0,4).toUpperCase())+'</span><span class="grow"><b>'+esc(f.name)+'</b><span class="meta"> · '+fsize(f.size)+(f.by?' · '+esc(f.by):"")+'</span></span>'+
    (isSheet(f.name)?'<button class="sm" data-view="'+key+':'+i+'">Bax</button>':"")+
    '<a class="sm btnlink" href="'+f.data+'" download="'+esc(f.name)+'">Yüklə</a>'+
    (key==="d"?'<button class="sm" data-fdel="'+i+'" aria-label="Sil">×</button>':"")+
    '</div><div class="sheet" id="sv-'+key+'-'+i+'" hidden></div>').join("")+'</div>';
}
function viewSheet(key, i){
  const box = $("sv-"+key+"-"+i);
  if (!box.hidden){ box.hidden = true; return; }
  const f = (key==="d" ? draft.files : S.orders.find(o=>o.id===Number(key)).files)[i];
  if (!window.XLSX){ box.innerHTML='<div class="hint">Excel oxuyucu yüklənmədi. İnternet bağlantısını yoxlayın.</div>'; box.hidden=false; return; }
  try {
    const wb = XLSX.read(f.data.split(",")[1], {type:"base64"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false}).slice(0,60);
    box.innerHTML = '<div class="meta">Vərəq: '+esc(wb.SheetNames[0])+(wb.SheetNames.length>1?' (cəmi '+wb.SheetNames.length+' vərəq, birincisi göstərilir)':"")+'</div><div class="tbl"><table>'+
      rows.map(r=>'<tr>'+Array.from(r,c=>'<td>'+esc(c??"")+'</td>').join("")+'</tr>').join("")+'</table></div>';
  } catch(e){ box.innerHTML='<div class="hint">Bu faylı oxumaq olmadı.</div>'; }
  box.hidden = false;
}

function bindNew(){
  $("nType").onchange = e => draft.type = e.target.value;
  $("nWh").onchange = e => { draft.wh = e.target.value; };
  $("nDl").onchange = e => draft.deadline = Number(e.target.value);
  $("nNote").oninput = e => draft.note = e.target.value;
  $("addItem").onclick = () => { draft.items.push({pid:"",qty:""}); render(); };
  $("autoChain").onclick = () => { draft.chain = defaultChain(); render(); };
  $("nFile").onchange = async e => { for (const f of e.target.files){ const x = await readFile(f); if (x) draft.files.push(x); } render(); };
  $("nPhoto").onchange = async e => { for (const f of e.target.files) draft.photos.push(await shrink(f)); render(); };

function sendOrder(){
  const bad = draft.items.find(i=>!i.pid && (i.pname||"").trim());
  if (bad) return $("nErr").textContent = "“"+bad.pname+"” kataloqda yoxdur. Siyahıdan seçin və ya əvvəl Kataloqa əlavə edin.";
  const items = draft.items.filter(i=>i.pid && String(i.qty).trim()).map(i=>({pid:Number(i.pid),qty:String(i.qty).trim()}));
  if (!items.length) return $("nErr").textContent = "Ən azı bir məhsul və miqdar yazın.";
  if (!draft.chain.length) return $("nErr").textContent = "Zəncir üçün ən azı bir şöbə seçin və ya “Avtomatik zəncir qur” düyməsini basın.";
  const now = new Date().toISOString();
  const o = { id:nextId(), type:draft.type, from:role, wh:draft.wh, created:now, items, chain:draft.chain.slice(), step:0,
    status:"acik", deadline_h:draft.deadline, last_move:now, note:draft.note.trim(), photos:draft.photos.slice(), files:draft.files.slice(), comments:[], history:[] };
  addLog(o,"Sifariş yaradıldı",o.note);
  S.orders.unshift(o); save();
  draft = { type:"Gündəlik", wh:draft.wh, items:[{pid:"",qty:""}], chain:[], deadline:24, note:"", photos:[], files:[] };
  tab = "orders"; filter = "all"; render(); toast("Sifariş #"+o.id+" göndərildi → "+o.chain[0]);
}
function shrink(file){
  return new Promise(res=>{
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, 640/Math.max(img.width,img.height)); const c = document.createElement("canvas");
      c.width = img.width*k; c.height = img.height*k; c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.7)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

    '<div class="cal">'+cells+'</div><div class="hint">Mavi: gəliş gözlənilir. Qırmızı: tarix çatıb, mal hələ qəbul edilməyib. Günə basın, həmin günün siyahısı açılacaq.</div>'+

      '<div class="hint">Firma silinəndə onun məhsulları kataloqda qalır, sadəcə firmasız olur.</div></div>';
  } else {
    html += '<div class="hint">Kataloqu yalnız <b>Admin</b> dəyişə bilər: məhsul və firma əlavə etmək, silmək. Siz yalnız baxa bilərsiniz.</div>';
  }
  html += '<div class="row"><input class="grow" id="cQ" placeholder="Məhsul axtar..."><select id="cF" style="width:auto;max-width:100%">'+fopts+'</select><span class="hint" id="cN">'+P.length+' məhsul</span></div>'+
    '<div class="card tbl"><table><thead><tr><th>#</th><th>Məhsul</th><th>Firma</th>'+(admin?'<th></th>':"")+'</tr></thead><tbody id="cBody">'+
    P.map(p=>'<tr data-s="'+esc(p.name.toLowerCase())+'" data-f="'+esc(p.firm||"-")+'"><td class="mono">'+p.id+'</td><td>'+(admin?'<input class="pname" data-pname="'+p.id+'" value="'+esc(p.name)+'" aria-label="Məhsulun adı">':esc(p.name))+'</td><td>'+
      (admin?'<select data-firm="'+p.id+'" style="width:auto;max-width:100%;padding:4px 6px;font-size:13px">'+firmOpts(p.firm)+'</select>':esc(p.firm||"—"))+'</td>'+
      (admin?'<td><button class="sm badb" data-pdel="'+p.id+'">Sil</button></td>':"")+'</tr>').join("")+'</tbody></table></div>';
  return html;
}

// ----- Tarixçə -----
function vHistory(){
  return '<div class="row" style="justify-content:space-between"><h2>Bütün əməliyyatlar</h2><button class="sm badb" id="reset">Demonu sıfırla</button></div>'+
    '<div class="card"><div class="log">'+S.log.slice().reverse().slice(0,200).map(x=>'<div><span class="meta">'+fmtT(x.at)+'</span> · <b>'+esc(x.by)+'</b> — '+esc(x.act)+(x.ref?' <span class="meta">('+esc(x.ref)+')</span>':"")+(x.note?': '+esc(x.note):"")+'</div>').join("")+'</div></div>';
}

// ===================== Hadisələr =====================
$("role").onchange = e => { role = e.target.value; try{localStorage.setItem(KEY+"-role",role);}catch(x){} draft.chain=[]; render(); toast(role+" ekranı"); };
$("tabs").onclick = e => { const b=e.target.closest("[data-tab]"); if (b){ tab=b.dataset.tab; render(); window.scrollTo(0,0);} };

$("main").addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-go],[data-filter],[data-cal],[data-day],[data-mv],[data-mvdel],[data-del],[data-view],[data-fdel],[data-pdel],[data-fmdel],#pAdd,#fAdd,#reset");
  if (!t) return;
  if (t.dataset.go){ const [tb,f]=t.dataset.go.split(":"); tab=tb; if (f) filter=f; render(); return; }
  if (t.dataset.filter){ filter=t.dataset.filter; render(); return; }
  if (t.dataset.cal){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+Number(t.dataset.cal),1); calSel=null; render(); return; }
  if (t.dataset.day){ calSel = calSel===t.dataset.day ? null : t.dataset.day; render(); return; }
  if (t.dataset.del){ draft.items.splice(Number(t.dataset.del),1); if(!draft.items.length) draft.items=[{pid:"",qty:""}]; render(); return; }
  if (t.dataset.mv) return addMove(t.dataset.wh, t.dataset.k);
  if (t.dataset.mvdel) return sure(t, ()=>{ S.moves = S.moves.filter(m=>m.id!==Number(t.dataset.mvdel)); save(); render(); toast("Silindi"); });
  if (t.dataset.view){ const [k,i]=t.dataset.view.split(":"); viewSheet(k,Number(i)); return; }
  if (t.dataset.fdel){ draft.files.splice(Number(t.dataset.fdel),1); render(); return; }
  if (t.dataset.pdel) return sure(t, ()=>delProduct(Number(t.dataset.pdel)));
  if (t.dataset.fmdel) return sure(t, ()=>delFirm(t.dataset.fmdel));
  if (t.id==="fAdd") return addFirm();
  if (t.id==="pAdd") return addProduct();
  if (t.id==="reset"){ if (t.dataset.sure){ S=seed(); save(); render(); toast("Demo ilkin vəziyyətə qaytarıldı"); } else { t.dataset.sure=1; t.textContent="Əminsiniz? Yenidən basın"; } return; }
  orderAct(t.dataset.act, Number(t.dataset.id));
});
$("main").addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.ii!=null){ setItem(el); return; }
  if (el.id==="cF"){ filterRows($("cQ")); return; }
  if (el.dataset.pname && role==="Admin"){ renameProduct(el); return; }
  if (el.dataset.firm && role==="Admin"){ const p=prod(el.dataset.firm); p.firm=el.value; S.log.push({by:role,act:"Firma dəyişdirildi",note:p.name+" → "+(p.firm||"firmasız"),at:new Date().toISOString()}); save(); el.closest("tr").dataset.f=p.firm||"-"; toast("Yadda saxlandı"); return; }
  if (el.dataset.chain){ const d=el.dataset.chain; draft.chain = el.checked ? draft.chain.concat([d]) : draft.chain.filter(x=>x!==d); render(); return; }
  if (el.dataset.file){ const o=S.orders.find(x=>x.id===Number(el.dataset.file)); o.files=o.files||[]; for (const f of el.files){ const x=await readFile(f); if (x){ o.files.push(x); addLog(o,"Fayl əlavə edildi",x.name); } } save(); render(); return; }
  if (el.dataset.photo){ const o=S.orders.find(x=>x.id===Number(el.dataset.photo)); for (const f of el.files) o.photos.push(await shrink(f)); addLog(o,"Şəkil əlavə edildi",""); save(); render(); }
});
function setItem(el){
  const it = draft.items[Number(el.dataset.ii)];
  if (el.dataset.f==="pname"){ it.pname = el.value; it.pid = pidByName(el.value); } else it.qty = el.value;
}
$("main").addEventListener("input", e => { const el=e.target; if (el.dataset.ii!=null) setItem(el); if (el.id==="cQ"||el.id==="sQ") filterRows(el); });

function orderAct(act, id){
  const o = S.orders.find(x=>x.id===id); if (!o) return;
  const v = k => ($(k+"-"+id)||{}).value || "";
  if (act==="comment"){ const t=v("c").trim(); if(!t) return; o.comments.push({by:role,text:t,at:new Date().toISOString()}); addLog(o,"Şərh",t); }
  else if (act==="buy"){
    const eta=v("eta"); if (!eta) return toast("Gəliş tarixini seçin");
    o.eta=eta; o.supplier=v("sup").trim(); o.status="yolda";
    advance(o,"Təchizatçıya sifariş verildi",(o.supplier||"Təchizatçı")+" · gəliş "+fmtD(eta));
    toast("Tarix kalendara əlavə olundu");
  }
  else if (act==="receive"){
    const diffs=[];
    o.items.forEach((i,k)=>{ i.got=Math.max(0,num(($("got-"+id+"-"+k)||{}).value)||0); stockAdd(o.wh,i.pid,i.got); if (i.got!==num(i.qty)) diffs.push(pname(i.pid)+": "+i.qty+" əvəzinə "+i.got); });
    o.status = "qebul";
    advance(o,"Mal qəbul edildi",[diffs.join("; "),v("rn")].filter(Boolean).join(" · "));
    toast(diffs.length ? "Qəbul edildi · fərq qeyd olundu" : "Qəbul edildi, qalıq yeniləndi");
  }
  else if (act==="approve"){
    advance(o,(holder(o)||role)+" təsdiqlədi",v("qn"));
    toast("Təsdiqləndi");
  }
  else if (act==="reject"){
    const note=v("qn"); if (!note) return toast("Rədd səbəbini yazın");
    o.items.forEach(i=>stockAdd(o.wh,i.pid,-(i.got||0)));
    o.status="redd"; o.last_move=new Date().toISOString();
    addLog(o,"Rədd edildi, mal qaytarılır",note);
    toast("Rədd edildi, qalıqdan çıxıldı");
  }
  else if (act==="fwd"){ advance(o,"Ötürüldü"+(o.chain[o.step+1]?" → "+o.chain[o.step+1]:""),v("fn")); }
  else if (act==="cancel"){ o.status="redd"; addLog(o,"Rəhbərlik ləğv etdi",""); }
  save(); render();
}

function addMove(wh, k){
  if (role!==wh) return;
  const to=$("mTo-"+k).value.trim(), product=$("mP-"+k).value.trim();
  if (!to) return toast("Haraya getdiyini yazın");
  if (!product) return toast("Məhsulun adını yazın");
  const mv={id:nextId(),wh,to,product,note:$("mN-"+k).value.trim(),by:role,at:new Date().toISOString()};
  S.moves.push(mv); S.log.push({by:role,act:"Yer dəyişmə",note:wh+" → "+to+": "+product+(mv.note?" ("+mv.note+")":""),at:mv.at});
  save(); render(); toast("Yazıldı");
}

// ----- Admin: kataloq əməliyyatları -----
function sure(btn, fn){
  if (btn.dataset.sure) return fn();
  btn.dataset.sure = 1; btn.textContent = "Əminsiniz?";
  setTimeout(()=>{ if (btn.isConnected){ delete btn.dataset.sure; btn.textContent = btn.dataset.pdel ? "Sil" : "×"; } }, 4000);
}
const now = () => new Date().toISOString();
function addProduct(){
  if (role!=="Admin") return;
  const name=$("pN").value.trim(); if(!name) return toast("Məhsulun adını yazın");
  if (pidByName(name)) return toast("Bu məhsul artıq kataloqdadır");
  const p={id:Math.max(...S.products.map(x=>x.id))+1,name,firm:$("pF").value};
  S.products.push(p); S.log.push({by:role,act:"Kataloqa məhsul əlavə edildi",note:name+(p.firm?" · "+p.firm:""),at:now()});
  save(); render(); toast(name+" əlavə olundu");
}
// Ad dəyişəndə köhnə sifarişlərdə də yeni ad görünür (sifariş məhsulu nömrə ilə saxlayır)
function renameProduct(el){
  const p = prod(el.dataset.pname), name = el.value.trim();
  if (!name){ el.value = p.name; return toast("Ad boş ola bilməz"); }
  if (name === p.name) return;
  const other = pidByName(name);
  if (other && other !== p.id){ el.value = p.name; return toast("“"+name+"” adlı məhsul artıq var"); }
  S.log.push({by:role,act:"Məhsulun adı dəyişdirildi",note:p.name+" → "+name,at:now()});
  p.name = name; save();
  el.value = name; el.closest("tr").dataset.s = name.toLowerCase();
  toast("Ad dəyişdirildi: "+name);
}
// Silinən məhsul köhnə sifarişlərdə adı ilə qalır, sadəcə yeni sifarişdə seçilmir
function delProduct(id){
  if (role!=="Admin") return;
  const p=prod(id); p.deleted=true;
  S.log.push({by:role,act:"Məhsul kataloqdan silindi",note:p.name,at:now()});
  save(); render(); toast(p.name+" silindi");
}
function addFirm(){
  if (role!=="Admin") return;
  const f=$("fN").value.trim(); if(!f) return toast("Firmanın adını yazın");
  if (S.firms.some(x=>x.toLowerCase()===f.toLowerCase())) return toast("Bu firma artıq var");
  S.firms.push(f); S.firms.sort((a,b)=>a.localeCompare(b,"az"));
  S.log.push({by:role,act:"Firma əlavə edildi",note:f,at:now()});
  save(); render(); toast(f+" əlavə olundu");
}
function delFirm(f){
  if (role!=="Admin") return;
  S.firms = S.firms.filter(x=>x!==f);
  S.products.forEach(p=>{ if (p.firm===f) p.firm=""; });
  S.log.push({by:role,act:"Firma silindi",note:f,at:now()});
  save(); render(); toast(f+" silindi");
}

// Müddət keçdikcə görünüşü yenilə
setInterval(()=>{ if (!["new","catalog","stock","moves"].includes(tab)) render(); }, 60000);
renderRole(); render();
</script>
