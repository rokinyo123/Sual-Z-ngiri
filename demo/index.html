}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D140E; --surface:#281C14; --sunk:#33251B; --line:#4A3628;
  --fg:#F3E5D0; --muted:#C2A385; --accent:#E0A46C; --accent-fg:#26160B;

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:8px}
.tabs button{flex:0 0 auto;background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500;padding:5px 10px;font-size:14px}
.tabs button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center}
main.wrap{padding-block:16px 60px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-size:22px;margin:4px 0 0;text-wrap:balance}
h3{font-size:15px;margin:0}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}

input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}

.card.late{border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px;min-width:0}
.meta{font-size:12px;color:var(--muted)}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.chain .ar{color:var(--muted)}

.tile b{display:block;font-family:var(--mono);font-size:26px;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.low{color:var(--bad);font-weight:700}
.box{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px;background:var(--bg)}
.checks label.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

tr.miss td{background:var(--bad-bg)} tr.warnr td{background:var(--warn-bg)} tr.okr td{background:var(--ok-bg)}
.rrow{border-radius:8px;padding:4px 6px}

.photos{display:flex;gap:6px;flex-wrap:wrap}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:8px;padding:6px 8px;font-size:13px}
.fic{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--ok-bg);color:var(--ok);border-radius:4px;padding:2px 5px}
.btnlink{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:13px;color:var(--fg);text-decoration:none}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.sheet td{font-size:12px;padding:4px 6px;white-space:nowrap}
.pname{padding:4px 8px;background:transparent;border-color:transparent;min-width:160px}
.pname:hover{border-color:var(--line)}
.imp{background:var(--info-bg);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.newtag{display:inline-block;font-size:11px;font-weight:600;background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:1px 6px}
.it.newp input:first-child{border-color:var(--warn);background:var(--warn-bg)}
.pact{display:flex;gap:6px;margin-top:4px}
.psz{min-width:110px;font-family:var(--mono);font-size:13px}
.sz{display:inline-block;font-family:var(--mono);font-size:12px;background:var(--info-bg);color:var(--info);border-radius:4px;padding:1px 6px;white-space:nowrap}

.rangebar{gap:8px;padding:10px 12px}
.linkb{background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.thumb{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);padding:0;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:var(--sunk);flex:0 0 auto;cursor:pointer}

.thumb.sm{width:30px;height:30px;border-radius:6px}
.thumb.empty{border-style:dashed;color:var(--muted);font-size:16px}

.pn{display:flex;gap:8px;align-items:center}

function guessSize(n){
  const m = String(n).match(/\d+(?:[.,]\d+)?\s*[*x×\/]{1,2}\s*\d+(?:[.,]\d+)?(?:\s*[*x×\/]\s*\d+(?:[.,]\d+)?)?|\bD\s?\d+|\d+(?:[.,]\d+)?\s*(?:sm|mm|ml|oz|litr|qr|kq)\b/i);
  return m ? m[0].replace(/\s+/g," ") : "";
}

const holder = o => o.status==="bagli"||o.status==="redd" ? null : o.chain[o.step];

const late = o => isOpen(o) && (Date.now()-new Date(o.last_move)) > o.deadline_h*HOUR;

function advance(o, act, note, by){
  o.step++; o.last_move = new Date().toISOString();
  addLog(o, act, note, by);

}

// ----- Gəlməyən mallar -----
// Mal gəldikcə anbar qeyd edir. Gəliş günü bitəndə (və ya anbar "Qəbulu bitir" basanda)
// gəlməyən mallar qırmızı olur və ayrıca sifariş kimi Satınalmaya qayıdır: niyə gəlmədi?
const itemMissing = i => (i.got||0) < num(i.qty);
// Rəng: tam gəldi — yaşıl, az gəldi — sarı, 0 (gəlmədi) — qırmızı
const fmtN = n => String(Math.round(n*1000)/1000).replace(".",",");
function gotState(qty, got){
  if (got >= num(qty)) return ["Tam gəldi","p-ok"];
  if (got > 0) return ["Az gəldi · "+fmtN(num(qty)-got)+" əskik","p-warn"];
  return ["Gəlmədi","p-bad"];
}
const itemState = (o,i) => i.got!=null ? gotState(i.qty, i.got)
  : o.status!=="yolda" ? ["Gəlmədi","p-bad"] : daysTo(o.eta)===0 ? ["Bu gün gözlənilir","p-info"] : ["Gözlənilir","p-mute"];
const rowCls = st => ({"p-ok":"okr","p-warn":"warnr","p-bad":"miss"})[st[1]] || "";
function finishReceive(o, by, note){
  const miss = o.items.filter(itemMissing);
  if (miss.length){
    const f = { id:nextId(), type:o.type, from:o.wh, wh:o.wh, created:new Date().toISOString(), parent:o.id, missing:true,
      items: miss.map(i=>({pid:i.pid, qty: i.got ? (num(i.qty)-i.got)+" (qalan, sifariş "+i.qty+")" : i.qty})),
      chain:o.chain.slice(), step:0, status:"acik", deadline_h:4, last_move:new Date().toISOString(),
      note:"Sifariş #"+o.id+" üzrə gəlməyən mallar ("+fmtD(o.eta)+"). Niyə gəlmədi və nə vaxt gələcək?", photos:[], files:[], comments:[], history:[] };
    addLog(f,"Gəlməyən mallar Satınalmaya göndərildi",miss.map(i=>pname(i.pid)).join(", "),by);
    S.orders.unshift(f); o.followup = f.id;
  }
  o.status = "qebul";
  advance(o, "Mal qəbulu bitdi", [miss.length ? miss.length+" mal gəlmədi → #"+o.followup : "Hamısı gəldi", note].filter(Boolean).join(" · "), by);
  return miss.length;
}
// Gəliş günü keçib, anbar qəbulu bağlamayıbsa — sistem özü bağlayır və gəlməyənləri Satınalmaya göndərir
function autoMissing(){
  let n = 0;
  S.orders.forEach(o=>{ if (o.status==="yolda" && o.eta && daysTo(o.eta)<0){ finishReceive(o,"Sistem","Gəliş günü bitdi, avtomatik bağlandı"); n++; } });
  if (n) save();
}

}
function renderTabs(){

}

// ----- Panel -----
function vPanel(){
  const my = S.orders.filter(mine);
  const dueToday = S.orders.filter(o=>o.status==="yolda" && o.eta && daysTo(o.eta)<=0);
  const lt = S.orders.filter(late);
  const tiles =
    tile("Mənim növbəm", my.length, my.length?"warn":"", "orders:mine") +
    tile("Bu gün / gecikən gəliş", dueToday.length, dueToday.length?"bad":"", "cal") +
    tile("Müddəti keçən", lt.length, lt.length?"bad":"", "orders:late") +
    tile("Gözləyən (gəlişi gözlənilən)", S.orders.filter(o=>o.status==="yolda").length, "", "orders:yolda") +
    tile("Gəlməyən mallar · açıq", S.orders.filter(o=>o.missing&&isOpen(o)).length, S.orders.some(o=>o.missing&&isOpen(o))?"bad":"", "orders:miss") +
    tile("Kataloqda məhsul", live().length, "", "catalog");
  let html = '<div class="banner">Bu demo versiyadır. Yuxarıdan <b>“Kim kimi baxırsınız”</b> seçimini dəyişərək hər şöbənin ekranını görə bilərsiniz. Hazırda: <b>'+esc(role)+'</b>.</div>';
  html += '<div class="tiles">'+tiles+'</div>';
  if (dueToday.length) html += '<div class="card late"><h3>⚠ Gəliş tarixi çatıb</h3>'+dueToday.map(o=>'<div class="row"><span class="mono">#'+o.id+'</span><span class="grow">'+esc(itemsShort(o))+'</span><span class="pill p-bad">'+fmtD(o.eta)+'</span><span class="meta">'+esc(o.wh)+'</span></div>').join("")+'</div>';
  if (role==="Satınalma" || role==="Rəhbərlik") html += arrivals();
  html += '<h2>Sizin növbənizdə</h2>';
  html += my.map(orderCard).join("");
  if (!my.length) html += '<div class="card"><div class="hint">'+esc(role)+' üçün hazırda gözləyən iş yoxdur.</div></div>';
  return html;
}
// Satınalma üçün: bu gün anbara nə gəldi, nə az gəldi, nə gəlmədi
function arrivals(){
  const list = S.orders.filter(o=>!o.missing && o.eta && o.status!=="acik" && (o.status==="yolda" ? daysTo(o.eta)<=0 : daysTo(o.eta)>=-1));
  if (!list.length) return "";
  return '<h2>Anbara gələnlər · qəbul vəziyyəti</h2>'+list.map(o=>{
    const st = o.items.map(i=>itemState(o,i)), bad = st.filter(x=>x[1]==="p-bad").length, warn = st.filter(x=>x[1]==="p-warn").length;
    return '<div class="card'+(bad?" late":"")+'"><div class="row" style="justify-content:space-between"><h3><span class="mono">#'+o.id+'</span> · '+esc(o.wh)+(o.supplier?' · '+esc(o.supplier):"")+'</h3><span class="meta">Gəliş '+fmtD(o.eta)+'</span></div>'+
      '<div class="row">'+(bad?'<span class="pill p-bad">'+bad+' gəlmədi</span>':"")+(warn?'<span class="pill p-warn">'+warn+' az gəldi</span>':"")+'<span class="pill p-ok">'+st.filter(x=>x[1]==="p-ok").length+' tam gəldi</span>'+(o.followup?'<span class="pill p-bad">→ #'+o.followup+'</span>':"")+'</div>'+
      '<div class="tbl"><table><thead><tr><th>Məhsul</th><th class="num">Sifariş</th><th class="num">Gələn</th><th>Vəziyyət</th></tr></thead><tbody>'+
      o.items.map((i,k)=>'<tr class="'+rowCls(st[k])+'"><td><div class="pn">'+thumb(i.pid,1)+'<span>'+esc(pname(i.pid))+'</span></div></td><td class="num">'+esc(i.qty)+'</td><td class="num">'+(i.got!=null?i.got:"—")+'</td><td><span class="pill '+st[k][1]+'">'+st[k][0]+'</span></td></tr>').join("")+
      '</tbody></table></div></div>';
  }).join("");
}
function tile(label,n,cls,go){ return '<button class="tile '+cls+'" data-go="'+go+'"><b>'+n+'</b><span>'+label+'</span></button>'; }
function itemsShort(o){ return o.items.map(i=>pname(i.pid)+" "+i.qty).join(", "); }

// ----- Sifariş kartı -----
function orderCard(o){
  const h = holder(o), lt = late(o), m = mine(o);
  const [stl, stc] = STATUS[o.status];
  const chain = [o.from].concat(o.chain).map((d,i)=>{
    const idx=i-1; let c="s";
    if (i===0 || idx<o.step) c+=" done"; else if (idx===o.step && isOpen(o)) c+=" cur";
    return '<span class="'+c+'">'+esc(d)+'</span>';
  }).join('<span class="ar">→</span>');
  const showState = o.eta && o.status!=="acik" && !o.missing;
  const rows = o.items.map((i,k)=>{
    const st = showState ? itemState(o,i) : null;
    return '<tr id="tr-'+o.id+'-'+k+'" class="'+(st?rowCls(st):"")+'"><td><div class="pn">'+thumb(i.pid,1)+'<span>'+esc(pname(i.pid))+(pmeta(i.pid)?'<div class="meta">'+esc(pmeta(i.pid))+'</div>':"")+'</span></div></td><td class="num">'+esc(i.qty)+'</td><td class="num'+(i.got!=null&&itemMissing(i)?" low":"")+'">'+(i.got!=null?i.got:"—")+'</td>'+(showState?'<td><span class="pill '+st[1]+'">'+st[0]+'</span></td>':"")+'</tr>';
  }).join("");
  let pills = '<span class="pill '+stc+'">'+(o.status==="yolda"?"Gözlənilir":stl)+'</span><span class="pill p-mute">'+esc(o.type)+'</span>';
  if (o.missing) pills = '<span class="pill p-bad">GƏLMƏYƏN MALLAR · #'+o.parent+'</span>' + pills;
  if (o.followup) pills += '<span class="pill p-bad">'+o.items.filter(itemMissing).length+' mal gəlmədi → #'+o.followup+'</span>';
  if (h) pills += '<span class="pill '+(lt?"p-bad":"p-warn")+'">'+(lt?"GECİKİR · Rəhbərlik":"Növbə: "+esc(h))+' · '+age(Date.now()-new Date(o.last_move))+'</span>';
  if (o.eta && o.status==="yolda"){ const d=daysTo(o.eta); pills += '<span class="pill '+(d<=0?"p-bad":"p-info")+'">Gəliş '+fmtD(o.eta)+(d>0?" · "+d+" gün qalıb":d===0?" · bu gün":" · "+(-d)+" gün gecikir")+'</span>'; }
  const photos = o.photos.length ? '<div class="photos">'+o.photos.map(p=>'<img src="'+p+'" alt="Sifariş şəkli">').join("")+'</div>' : "";
  const comments = o.comments.map(c=>'<div class="hint"><b>'+esc(c.by)+':</b> '+esc(c.text)+'</div>').join("");
  const hist = '<details><summary>Tarixçə ('+o.history.length+')</summary><div class="log">'+o.history.map(x=>'<div><span class="meta">'+fmtT(x.at)+'</span> · <b>'+esc(x.by)+'</b> — '+esc(x.act)+(x.note?': '+esc(x.note):"")+'</div>').join("")+'</div></details>';
  return '<div class="card'+(m?" mine":"")+(lt||(o.missing&&isOpen(o))?" late":"")+'">'+
    '<div class="row" style="justify-content:space-between"><h3><span class="mono">#'+o.id+'</span> · '+esc(o.from)+' → '+esc(o.wh)+'</h3><span class="meta">'+fmtT(o.created)+'</span></div>'+
    '<div class="row">'+pills+'</div>'+
    '<div class="chain">'+chain+'</div>'+
    (o.note?'<div>'+esc(o.note)+'</div>':"")+
    '<div class="tbl"><table><thead><tr><th>Məhsul</th><th class="num">Sifariş</th><th class="num">Gələn</th>'+(showState?'<th>Vəziyyət</th>':"")+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
    (o.supplier?'<div class="meta">Təchizatçı: '+esc(o.supplier)+'</div>':"")+
    photos + fileList(o.files||[],o.id) + (m ? actions(o) : "") + comments +
    '<div class="row"><input class="grow" id="c-'+o.id+'" placeholder="Şərh yazın"><button class="sm" data-act="comment" data-id="'+o.id+'">Şərh</button>'+
    '<label class="sm" style="cursor:pointer;color:var(--muted);font-size:13px">📷 Şəkil<input type="file" accept="image/*" data-photo="'+o.id+'" hidden></label>'+
    '<label class="sm" style="cursor:pointer;color:var(--muted);font-size:13px">📎 Fayl<input type="file" data-file="'+o.id+'" hidden></label>'+
    (role==="Rəhbərlik" && isOpen(o) ? '<button class="sm badb" data-act="cancel" data-id="'+o.id+'">Ləğv et</button>' : "")+'</div>'+
    hist + '</div>';
}

function guessFirm(o){
  const c = {}; o.items.forEach(i=>{ const f=pfirm(i.pid); if (f) c[f]=(c[f]||0)+1; });
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0] || "";
}
// ----- Fayllar (Excel, PDF və s.) -----
const MAXF = 1.5*1024*1024;
function readFile(f){
  if (f.size > MAXF){ toast(f.name+": demo versiyada 1,5 MB-dan böyük fayl olmaz"); return Promise.resolve(null); }
  return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res({name:f.name,size:f.size,data:r.result,by:role,at:new Date().toISOString()}); r.readAsDataURL(f); });
}
const isSheet = n => /\.(xlsx|xlsm|xls|csv)$/i.test(n);
const fsize = b => b>1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";
function fileList(files, key){
  if (!files.length) return "";
  return '<div class="files">'+files.map((f,i)=>'<div class="file"><span class="fic">'+(isSheet(f.name)?"XLS":(f.name.split(".").pop()||"").slice(0,4).toUpperCase())+'</span><span class="grow"><b>'+esc(f.name)+'</b><span class="meta"> · '+fsize(f.size)+(f.by?' · '+esc(f.by):"")+'</span></span>'+
    (isSheet(f.name)?'<button class="sm" data-view="'+key+':'+i+'">Bax</button>':"")+
    '<a class="sm btnlink" href="'+f.data+'" download="'+esc(f.name)+'">Yüklə</a>'+
    (key==="d"?'<button class="sm" data-fdel="'+i+'" aria-label="Sil">×</button>':"")+
    '</div><div class="sheet" id="sv-'+key+'-'+i+'" hidden></div>').join("")+'</div>';
}
function viewSheet(key, i){
  const box = $("sv-"+key+"-"+i);
  if (!box.hidden){ box.hidden = true; return; }
  const f = (key==="d" ? draft.files : S.orders.find(o=>o.id===Number(key)).files)[i];
  if (!window.XLSX){ box.innerHTML='<div class="hint">Excel oxuyucu yüklənmədi. İnternet bağlantısını yoxlayın.</div>'; box.hidden=false; return; }
  try {
    const wb = XLSX.read(f.data.split(",")[1], {type:"base64"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false}).slice(0,60);
    box.innerHTML = '<div class="meta">Vərəq: '+esc(wb.SheetNames[0])+(wb.SheetNames.length>1?' (cəmi '+wb.SheetNames.length+' vərəq, birincisi göstərilir)':"")+'</div><div class="tbl"><table>'+
      rows.map(r=>'<tr>'+Array.from(r,c=>'<td>'+esc(c??"")+'</td>').join("")+'</tr>').join("")+'</table></div>';
  } catch(e){ box.innerHTML='<div class="hint">Bu faylı oxumaq olmadı.</div>'; }
  box.hidden = false;
}

// Şöbəyə görə düymələr — zəncirin "ağıllı" hissəsi

  const actor = late(o) && role==="Rəhbərlik" ? "Rəhbərlik" : h;
  let b = '<div class="box">';
  if (actor==="Satınalma" && o.status==="acik"){
    b += '<h3>'+(o.missing?"Satınalma: bu mallar niyə gəlmədi?":"Satınalma: sifarişi qəbul et")+'</h3>'+
      (o.missing?'<input id="why-'+o.id+'" placeholder="Səbəb (məs. təchizatçıda qurtarıb, maşın gecikdi)">':"")+
      '<div class="row"><input class="grow" id="sup-'+o.id+'" list="flist" placeholder="Təchizatçı (firma)" value="'+esc(guessFirm(o))+'"><datalist id="flist">'+S.firms.map(f=>'<option value="'+esc(f)+'">').join("")+'</datalist><input class="grow" type="date" id="eta-'+o.id+'" value="'+plusDays(1)+'"></div>'+
      '<div class="hint">Gəliş tarixi (adətən sabah). Sifariş <b>'+esc(o.chain[o.step+1]||"—")+'</b> şöbəsinin “Gözləyən” siyahısına həmin tarixlə düşəcək və kalendarda görünəcək.</div>'+
      '<div class="row"><button class="pri" data-act="buy" data-id="'+o.id+'">Qəbul etdim → gözləyənə göndər</button><button data-act="fwd" data-id="'+o.id+'">Yalnız ötür</button></div>';
  } else if (WAREHOUSES.includes(actor) && o.status==="yolda"){
    const d = daysTo(o.eta);
    b += '<h3>Mal qəbulu — '+esc(o.wh)+'</h3><div class="hint">'+(d>0?"Gəliş tarixi: "+fmtD(o.eta)+". ":"")+'Mal gəldikcə gələn miqdarı yazıb “Gələnləri yadda saxla” basın. Günün sonunda gəlməyənlər <b>avtomatik qırmızı olur və Satınalmaya düşür</b>. İstəsəniz bunu “Qəbulu bitir” ilə indi edə bilərsiniz.</div>'+
      o.items.map((i,k)=>{ const st=itemState(o,i); return '<div class="row rrow '+rowCls(st)+'"><span class="grow pn">'+thumb(i.pid,1)+'<span>'+esc(pname(i.pid))+(psize(i.pid)?' <span class="sz">'+esc(psize(i.pid))+'</span>':"")+' <span class="meta">(sifariş '+esc(i.qty)+')</span></span></span><span class="pill '+st[1]+'">'+st[0]+'</span><input type="number" min="0" step="any" style="width:90px" data-got="'+o.id+'-'+k+'" data-q="'+esc(i.qty)+'" id="got-'+o.id+'-'+k+'" placeholder="gələn" value="'+(i.got!=null?i.got:"")+'"><button class="sm" data-full="'+o.id+'-'+k+'" data-q="'+num(i.qty)+'">Tam</button></div>'; }).join("")+
      '<input id="rn-'+o.id+'" placeholder="Qeyd (zədə, temperatur, qablaşdırma...)">'+
      '<div class="row"><button class="okb" data-act="save-got" data-id="'+o.id+'">Gələnləri yadda saxla</button><button class="badb" data-act="receive" data-id="'+o.id+'">Qəbulu bitir · gəlməyənləri Satınalmaya göndər</button></div>';
  } else if (QC.includes(actor) && o.status==="qebul"){
    b += '<h3>'+esc(actor)+': keyfiyyət yoxlaması</h3>'+
      '<input id="qn-'+o.id+'" placeholder="Rəy (məs. temperatur 4°C, son istifadə tarixi uyğundur)">'+
      '<div class="row"><button class="okb" data-act="approve" data-id="'+o.id+'">Təsdiq et → ötür</button><button class="badb" data-act="reject" data-id="'+o.id+'">Rədd et (geri qaytarılsın)</button></div>';
  } else {
    const nx = o.chain[o.step+1];
    b += '<h3>'+esc(actor)+'</h3><input id="fn-'+o.id+'" placeholder="Qeyd (istəyə görə)">'+
      '<div class="row"><button class="pri" data-act="fwd" data-id="'+o.id+'">'+(nx?"Tamamla → "+esc(nx):"Tamamla və bağla")+'</button></div>';
  }
  return b + '</div>';
}

// ----- Tarix seçimi (Sifarişlər və Gələn/Gəlməyən üçün ortaq) -----
const WD = ["Bazar","Bazar ertəsi","Çərşənbə axşamı","Çərşənbə","Cümə axşamı","Cümə","Şənbə"];
const wday = d => WD[new Date(d+"T00:00:00").getDay()];
const inRange = d => (!RF || d>=RF) && (!RT || d<=RT);
function rangeBar(){
  const q = [["today","Bu gün"],["yday","Dünən"],["tmr","Sabah"],["week","Son 7 gün"],["month","Bu ay"],["all","Bütün tarixlər"]];
  return '<div class="card rangebar"><div class="row"><div class="grow"><div class="hint">Tarixdən</div><input type="date" id="rFrom" value="'+RF+'"></div><div class="grow"><div class="hint">Tarixədək</div><input type="date" id="rTo" value="'+RT+'"></div></div>'+
    '<div class="row">'+q.map(([k,l])=>'<button class="sm" data-range="'+k+'">'+l+'</button>').join("")+'</div></div>';
}
function setRange(k){
  const t = today();
  if (k==="today"){ RF=RT=t; } else if (k==="yday"){ RF=RT=plusDays(-1); } else if (k==="tmr"){ RF=RT=plusDays(1); }
  else if (k==="week"){ RF=plusDays(-6); RT=t; } else if (k==="month"){ RF=t.slice(0,8)+"01"; RT=t; } else { RF=RT=""; }
}
const odate = o => o.eta || o.created.slice(0,10);

// ----- Gələn / Gəlməyən: tarix üzrə hər mal -----
function vArr(){
  const rows = [];
  S.orders.forEach(o=>{ if (!o.eta || o.status==="acik") return; o.items.forEach(i=>rows.push({o,i,st:itemState(o,i)})); });
  const cat = st => st[1]==="p-ok" ? "ok" : st[1]==="p-warn" ? "warn" : st[1]==="p-bad" ? "bad" : "wait";
  const inR = rows.filter(r=>inRange(r.o.eta));
  const cnt = k => inR.filter(r=>cat(r.st)===k).length;
  const F = [["all","Hamısı",inR.length,""],["bad","Gəlmədi",cnt("bad"),"p-bad"],["warn","Az gəldi",cnt("warn"),"p-warn"],["ok","Tam gəldi",cnt("ok"),"p-ok"],["wait","Gözlənilir",cnt("wait"),"p-info"]];
  const list = inR.filter(r=>jf==="all"||cat(r.st)===jf).sort((a,b)=>a.o.eta<b.o.eta?-1:a.o.eta>b.o.eta?1:a.o.id-b.o.id);
  const by = {}; list.forEach(r=>(by[r.o.eta]=by[r.o.eta]||[]).push(r));
  let html = '<h2>Gələn və gəlməyən mallar</h2>'+rangeBar()+
    '<div class="row">'+F.map(([k,l,n,c])=>'<button class="sm '+(jf===k?"pri":"")+'" data-jf="'+k+'">'+l+' <span class="pill '+(c||"p-mute")+'">'+n+'</span></button>').join("")+'</div>';
  const days = Object.keys(by).sort();
  if (!days.length) return html + '<div class="card"><div class="hint">Seçilən tarixlərdə '+(jf==="all"?"":"bu vəziyyətdə ")+'mal yoxdur.</div></div>';
  html += days.map(d=>{
    const rs = by[d], c = k => rs.filter(r=>cat(r.st)===k).length;
    return '<div class="card'+(c("bad")?" late":"")+'"><div class="row" style="justify-content:space-between"><h3>'+fmtD(d)+' · '+wday(d)+(d===today()?' · bu gün':"")+'</h3><div class="row">'+
      (c("bad")?'<span class="pill p-bad">'+c("bad")+' gəlmədi</span>':"")+(c("warn")?'<span class="pill p-warn">'+c("warn")+' az</span>':"")+(c("ok")?'<span class="pill p-ok">'+c("ok")+' tam</span>':"")+(c("wait")?'<span class="pill p-info">'+c("wait")+' gözlənilir</span>':"")+'</div></div>'+

// ----- Excel-dən sifariş -----
// İki cür vərəq tanınır:
//  1) "Məhsul | Sifariş" başlıqlı bloklar (gündəlik vərəqlər), blokun üstündə firma adı;
//  2) sütun cütləri "ad | miqdar" (həftəlik vərəq): miqdarı boş olan sətir firma başlığıdır.
const normName = n => String(n).toLowerCase().replace(/i̇/g,"i").replace(/\s+/g," ").trim();
const normQty = q => String(q).trim().replace(/^(\d+(?:[.,]\d+)?)\s*([^\d\s.,].*)$/,"$1 $2");
const findFirm = h => { const n = normName(h); return n ? S.firms.find(f=>normName(f).startsWith(n) || n.startsWith(normName(f))) || "" : ""; };
function parseOrderSheet(ws){
  const A = XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  const txt = v => String(v??"").trim();
  const out = [];
  const heads = [];
  A.forEach((row,r)=>row.forEach((v,c)=>{ if (normName(v)==="məhsul") heads.push([r,c]); }));
  if (heads.length){
    heads.forEach(([r,c])=>{
      const firm = findFirm(txt((A[r-1]||[])[c]));
      for (let rr=r+1; A[rr] && txt(A[rr][c]); rr++){
        const n = txt(A[rr][c]), q = txt(A[rr][c+1]);
        if (normName(n)==="məhsul") break;
        if (q) out.push({name:n, qty:normQty(q), firm});
      }
    });
  } else {
    const W = Math.max(0,...A.map(r=>r.length));
    for (let c=0; c<W; c+=2){
      let firm = "";
      A.forEach(row=>{ const n = txt(row[c]), q = txt(row[c+1]);
        if (!n) return;
        if (!q){ firm = findFirm(n); return; }
        out.push({name:n, qty:normQty(q), firm});
      });
    }
  }
  return out;
}
function importInfo(){
  if (!draft.xls) return "";
  const imp = draft.items.filter(i=>i.imp), miss = imp.filter(i=>!i.pid).length;
  const names = draft.xls.sheets;
  return '<div class="imp">'+
    (names.length>1?'<div class="row"><span class="hint">Vərəq</span><select id="nSheet" class="grow">'+names.slice().reverse().map(n=>'<option'+(n===draft.sheet?" selected":"")+'>'+esc(n)+'</option>').join("")+'</select></div>':"")+
    '<div><b>'+esc(draft.xls.name)+'</b> · “'+esc(draft.sheet)+'” vərəqindən <b>'+imp.length+' məhsul</b> götürüldü'+
    (miss?': '+(imp.length-miss)+'-i kataloqda tapıldı, <span class="newtag">'+miss+' yeni</span> (sifariş göndəriləndə kataloqa “Excel-dən” kimi əlavə olunacaq)':', hamısı kataloqda tapıldı')+'. Aşağıda yoxlayın, lazım olsa düzəldin.</div></div>';

async function addDraftFiles(list){
  for (const f of list){
    if (isSheet(f.name)){
      if (!window.XLSX){ toast("Excel oxuyucu yüklənmədi, internet bağlantısını yoxlayın"); continue; }
      let wb;
      toast(f.name+" oxunur..."); await new Promise(r=>setTimeout(r,30));
      try { wb = XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array"}); } catch(e){ toast(f.name+": faylı oxumaq olmadı"); continue; }
      draft.wb = wb;
      draft.xls = { name:f.name, size:f.size, sheets:wb.SheetNames.slice() };
      draft.sheet = wb.SheetNames[wb.SheetNames.length-1]; // ən son vərəq
      applySheet();
      continue;
    }
    const x = await readFile(f); if (x) draft.files.push(x);
  }
  render();
}
// Seçilmiş vərəqi məhsullar siyahısına yaz və faylı sifarişə qoş (böyük fayldan yalnız bu vərəq saxlanılır)
function applySheet(){
  const rows = parseOrderSheet(draft.wb.Sheets[draft.sheet]);
  draft.items = draft.items.filter(i=>!i.imp && (i.pid || (i.pname||"").trim()));
  rows.forEach(r=>{ const pid = pidByName(r.name); draft.items.push({pid, pname:r.name, qty:r.qty, imp:true, firm:r.firm}); });
  if (!draft.items.length) draft.items = [{pid:"",qty:""}];
  if (/həftəlik/i.test(draft.sheet)) draft.type = "Həftəlik";
  draft.files = draft.files.filter(x=>!x.xls);
  let att;
  if (draft.xls.size <= MAXF && draft.xls.sheets.length===1){
    att = { name:draft.xls.name, size:draft.xls.size, data:"data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,"+XLSX.write(draft.wb,{type:"base64",bookType:"xlsx"}) };
  } else {
    const one = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(one, draft.wb.Sheets[draft.sheet], draft.sheet.slice(0,31));
    const b64 = XLSX.write(one,{type:"base64",bookType:"xlsx"});
    att = { name:draft.xls.name.replace(/\.[^.]+$/,"")+" — "+draft.sheet+".xlsx", size:Math.round(b64.length*3/4), data:"data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,"+b64 };
  }
  draft.files.push({...att, xls:true, by:role, at:new Date().toISOString()});
  toast(rows.length+" məhsul Excel-dən yazıldı");
}

function shrink(file, max){
  return new Promise(res=>{
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, (max||640)/Math.max(img.width,img.height)); const c = document.createElement("canvas");
      c.width = img.width*k; c.height = img.height*k; c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.7)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

  if (p.photo) return '<button class="thumb'+(small?" sm":"")+'" data-zoom="'+p.id+'" aria-label="'+esc(p.name)+' şəkli"><img src="'+p.photo+'" alt=""></button>';

  if (role==="Admin") return '<label class="thumb empty" title="Şəkil əlavə et">📷<input type="file" accept="image/*" data-pphoto="'+p.id+'" hidden></label>';
  return '<span class="thumb empty" aria-hidden="true"></span>';
}
function openZoom(pid){
  const p = prod(pid);
  $("zoomImg").src = p.photo; $("zoomName").textContent = p.name;
  $("zoomAdmin").innerHTML = role==="Admin" ? '<label class="btnlink" style="cursor:pointer">Şəkli dəyiş<input type="file" accept="image/*" data-pphoto="'+p.id+'" hidden></label> <button class="badb" data-photodel="'+p.id+'">Şəkli sil</button>' : "";
  $("zoom").hidden = false;
}
const closeZoom = () => { $("zoom").hidden = true; };
async function setPhoto(el){
  const f = el.files[0]; if (!f || role!=="Admin") return;
  const p = prod(el.dataset.pphoto);
  p.photo = await shrink(f, 900);
  S.log.push({by:role,act:"Məhsul şəkli əlavə edildi",note:p.name,at:now()});
  save(); toast(p.name+": şəkil əlavə olundu");
  const cell = $("ph-"+p.id); if (cell) cell.innerHTML = thumb(p.id);
  if (!$("zoom").hidden) openZoom(p.id);
}
$("zoom").addEventListener("click", e => {
  if (e.target.id==="zoom" || e.target.id==="zoomClose" || e.target.id==="zoomImg") return closeZoom();
  const d = e.target.closest("[data-photodel]");
  if (d) sure(d, ()=>{ const p=prod(d.dataset.photodel); delete p.photo; S.log.push({by:role,act:"Məhsul şəkli silindi",note:p.name,at:now()}); save(); closeZoom(); const cell=$("ph-"+p.id); if (cell) cell.innerHTML=thumb(p.id); toast("Şəkil silindi"); });
});
$("zoom").addEventListener("change", e => { if (e.target.dataset.pphoto) setPhoto(e.target); });
document.addEventListener("keydown", e => { if (e.key==="Escape" && !$("zoom").hidden) closeZoom(); });

// ----- Kataloq -----

    html += '<div class="card mine"><h3>Admin · yeni məhsul</h3><div class="row"><input class="grow" id="pN" placeholder="Məhsulun adı"><select class="grow" id="pF">'+firmOpts("")+'</select><button class="pri" id="pAdd">Məhsul əlavə et</button></div></div>'+
      '<div class="hint">Şəkil əlavə etmək üçün məhsulun yanındakı 📷 xanasına basın. Məhsulu silmək üçün adın altındakı “Sil” düyməsini iki dəfə basın. Məhsulun adını və ya ölçüsünü dəyişmək üçün siyahıda həmin xanaya basın, düzəldin və Enter basın. Ölçülər addan avtomatik götürülüb, yoxlayın.</div>'+
      '<div class="card mine"><h3>Admin · firmalar ('+S.firms.length+')</h3><div class="row"><input class="grow" id="fN" placeholder="Yeni firmanın adı"><button class="pri" id="fAdd">Firma əlavə et</button></div>'+
      '<div class="firms">'+S.firms.map(f=>'<span class="firm"><button class="linkb" data-catfirm="'+esc(f)+'">'+esc(f)+'</button> <span class="meta">'+P.filter(p=>p.firm===f).length+'</span><button class="badb" data-fmdel="'+esc(f)+'" aria-label="Firmanı sil">×</button></span>').join("")+'</div>'+

  }

  html += '<div class="row"><input class="grow" id="cQ" placeholder="Məhsul axtar..." value="'+esc(catQ)+'"><select id="cF" style="width:auto;max-width:100%">'+fopts.replace('value="'+esc(catFirm)+'"','value="'+esc(catFirm)+'" selected')+'</select><span class="hint" id="cN">'+P.length+' məhsul</span></div>';

    '<div class="row"><input class="grow" id="ffN" list="ffl" placeholder="Bu firmaya məhsul əlavə et (siyahıdan seçin və ya yeni ad yazın)"><datalist id="ffl">'+P.filter(p=>p.firm!==catFirm).map(p=>'<option value="'+esc(p.name)+'">'+esc(p.firm||"firmasız")+'</option>').join("")+'</datalist><button class="pri" id="ffAdd">Əlavə et</button></div>'+
    '<div class="hint">Məhsul bu firmadan artıq gəlmirsə, sətirdəki <b>“Firmadan çıxar”</b> düyməsini basın: məhsul kataloqda qalır, sadəcə firmasız olur. Məhsulu kataloqdan tamamilə silmək üçün <b>“Sil”</b> basın.</div></div>';
  else if (byFirm) html += '<div class="hint">Bu firmaya məhsul əlavə etmək və ya çıxarmaq üçün yuxarıdan <b>Admin</b> seçin.</div>';

  return html;
}

// ----- Tarixçə -----
function vHistory(){
  return '<div class="row" style="justify-content:space-between"><h2>Bütün əməliyyatlar</h2><button class="sm badb" id="reset">Demonu sıfırla</button></div>'+
    '<div class="card"><div class="log">'+S.log.slice().reverse().slice(0,200).map(x=>'<div><span class="meta">'+fmtT(x.at)+'</span> · <b>'+esc(x.by)+'</b> — '+esc(x.act)+(x.ref?' <span class="meta">('+esc(x.ref)+')</span>':"")+(x.note?': '+esc(x.note):"")+'</div>').join("")+'</div></div>';

// ===================== Hadisələr =====================
$("role").onchange = e => { role = e.target.value; try{localStorage.setItem(KEY+"-role",role);}catch(x){} draft.chain=[]; render(); toast(role+" ekranı"); };
$("tabs").onclick = e => { const b=e.target.closest("[data-tab]"); if (b){ tab=b.dataset.tab; render(); window.scrollTo(0,0);} };

$("main").addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-go],[data-filter],[data-cal],[data-day],[data-mv],[data-mvdel],[data-full],[data-zoom],[data-range],[data-jf],[data-goorder],[data-unfirm],[data-catfirm],[data-del],[data-view],[data-fdel],[data-pdel],[data-fmdel],#pAdd,#fAdd,#ffAdd,#reset");
  if (!t) return;
  if (t.dataset.go){ const [tb,f]=t.dataset.go.split(":"); tab=tb; if (f) filter=f; render(); return; }
  if (t.dataset.filter){ filter=t.dataset.filter; render(); return; }
  if (t.dataset.cal){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+Number(t.dataset.cal),1); calSel=null; render(); return; }
  if (t.dataset.day){ calSel = calSel===t.dataset.day ? null : t.dataset.day; render(); return; }
  if (t.dataset.del){ draft.items.splice(Number(t.dataset.del),1); if(!draft.items.length) draft.items=[{pid:"",qty:""}]; render(); return; }
  if (t.dataset.catfirm){ catFirm=t.dataset.catfirm; catQ=""; render(); $("cF").scrollIntoView({block:"start"}); return; }
  if (t.dataset.unfirm) return unFirm(Number(t.dataset.unfirm));
  if (t.id==="ffAdd") return addToFirm();
  if (t.dataset.range){ setRange(t.dataset.range); render(); return; }
  if (t.dataset.jf){ jf=t.dataset.jf; render(); return; }
  if (t.dataset.goorder){ const o=S.orders.find(x=>x.id===Number(t.dataset.goorder)); tab="orders"; filter=isOpen(o)?"all":"arch"; RF=RT=odate(o); render(); return; }
  if (t.dataset.zoom){ openZoom(t.dataset.zoom); return; }
  if (t.dataset.full){ const el=$("got-"+t.dataset.full); el.value = t.dataset.q; paintGot(el); saveGot(el); return; }
  if (t.dataset.mv) return addMove(t.dataset.wh, t.dataset.k);
  if (t.dataset.mvdel) return sure(t, ()=>{ S.moves = S.moves.filter(m=>m.id!==Number(t.dataset.mvdel)); save(); render(); toast("Silindi"); });
  if (t.dataset.view){ const [k,i]=t.dataset.view.split(":"); viewSheet(k,Number(i)); return; }
  if (t.dataset.fdel){ draft.files.splice(Number(t.dataset.fdel),1); render(); return; }
  if (t.dataset.pdel) return sure(t, ()=>delProduct(Number(t.dataset.pdel)));
  if (t.dataset.fmdel) return sure(t, ()=>delFirm(t.dataset.fmdel));
  if (t.id==="fAdd") return addFirm();
  if (t.id==="pAdd") return addProduct();
  if (t.id==="reset"){ if (t.dataset.sure){ S=seed(); save(); render(); toast("Demo ilkin vəziyyətə qaytarıldı"); } else { t.dataset.sure=1; t.textContent="Əminsiniz? Yenidən basın"; } return; }
  orderAct(t.dataset.act, Number(t.dataset.id));
});
$("main").addEventListener("change", async e => {
  const el = e.target;
  if (el.id==="rFrom"){ RF=el.value; render(); return; }
  if (el.id==="rTo"){ RT=el.value; render(); return; }
  if (el.dataset.got){ saveGot(el); return; }
  if (el.dataset.pphoto){ setPhoto(el); return; }
  if (el.dataset.ii!=null){ setItem(el); return; }
  if (el.id==="cF"){ catFirm=el.value; render(); return; }
  if (el.dataset.pname && role==="Admin"){ renameProduct(el); return; }
  if (el.dataset.psize && role==="Admin"){ const p=prod(el.dataset.psize), v=el.value.trim(); if (v===(p.size||"")) return; S.log.push({by:role,act:"Ölçü dəyişdirildi",note:p.name+": "+(p.size||"—")+" → "+(v||"—"),at:now()}); p.size=v; save(); el.closest("tr").dataset.s=(p.name+" "+v).toLowerCase(); toast("Ölçü yadda saxlandı"); return; }
  if (el.dataset.firm && role==="Admin"){ const p=prod(el.dataset.firm); p.firm=el.value; S.log.push({by:role,act:"Firma dəyişdirildi",note:p.name+" → "+(p.firm||"firmasız"),at:new Date().toISOString()}); save(); el.closest("tr").dataset.f=p.firm||"-"; toast("Yadda saxlandı"); return; }
  if (el.dataset.chain){ const d=el.dataset.chain; draft.chain = el.checked ? draft.chain.concat([d]) : draft.chain.filter(x=>x!==d); render(); return; }
  if (el.dataset.file){ const o=S.orders.find(x=>x.id===Number(el.dataset.file)); o.files=o.files||[]; for (const f of el.files){ const x=await readFile(f); if (x){ o.files.push(x); addLog(o,"Fayl əlavə edildi",x.name); } } save(); render(); return; }
  if (el.dataset.photo){ const o=S.orders.find(x=>x.id===Number(el.dataset.photo)); for (const f of el.files) o.photos.push(await shrink(f)); addLog(o,"Şəkil əlavə edildi",""); save(); render(); }
});
function setItem(el){
  const it = draft.items[Number(el.dataset.ii)];
  if (el.dataset.f==="pname"){ it.pname = el.value; it.pid = pidByName(el.value); } else it.qty = el.value;
}
function paintGot(el){
  const row = el.closest(".rrow"), pill = row.querySelector(".pill");
  if (el.value===""){ return; }
  const st = gotState(el.dataset.q, Math.max(0,num(el.value)));
  row.className = "row rrow "+rowCls(st); pill.className = "pill "+st[1]; pill.textContent = st[0];
  const tr = $("tr-"+el.dataset.got);
  if (tr){ tr.className = rowCls(st); const tp = tr.querySelector(".pill"); if (tp){ tp.className = "pill "+st[1]; tp.textContent = st[0]; } tr.children[2].textContent = fmtN(Math.max(0,num(el.value))); }
}
// Hər məhsul xanadan çıxan kimi yadda saxlanılır — Satınalma dərhal görür
function saveGot(el){
  if (el.value==="") return;
  const [oid,k] = el.dataset.got.split("-").map(Number), o = S.orders.find(x=>x.id===oid), i = o.items[k];
  const val = Math.max(0,num(el.value));
  if (val===i.got) return;
  stockAdd(o.wh,i.pid,val-(i.got||0)); i.got = val;
  addLog(o,"Qeyd edildi",pname(i.pid)+": "+i.qty+" sifariş, "+val+" gəldi ("+gotState(i.qty,val)[0]+")");
  save(); renderTabs();
}
$("main").addEventListener("input", e => { const el=e.target; if (el.dataset.got) paintGot(el); if (el.dataset.ii!=null) setItem(el); if (el.id==="cQ"){ catQ=el.value; filterRows(el); } if (el.id==="sQ") filterRows(el); });

function orderAct(act, id){
  const o = S.orders.find(x=>x.id===id); if (!o) return;
  const v = k => ($(k+"-"+id)||{}).value || "";
  if (act==="comment"){ const t=v("c").trim(); if(!t) return; o.comments.push({by:role,text:t,at:new Date().toISOString()}); addLog(o,"Şərh",t); }
  else if (act==="buy"){
    const eta=v("eta"); if (!eta) return toast("Gəliş tarixini seçin");
    if (o.missing && !v("why").trim()) return toast("Malların niyə gəlmədiyini yazın");
    o.eta=eta; o.supplier=v("sup").trim(); o.status="yolda";
    if (o.missing) o.comments.push({by:role,text:"Səbəb: "+v("why").trim(),at:new Date().toISOString()});
    advance(o,"Sifariş qəbul edildi",[o.supplier, "gəliş "+fmtD(eta), o.missing?"səbəb: "+v("why").trim():""].filter(Boolean).join(" · "));
    toast(o.chain[o.step]+" gözləyən siyahısına düşdü · "+fmtD(eta));
  }
  else if (act==="save-got" || act==="receive"){
    const got=[];
    o.items.forEach((i,k)=>{ const el=$("got-"+id+"-"+k); if (!el || el.value==="") return;
      const val=Math.max(0,num(el.value)); stockAdd(o.wh,i.pid,val-(i.got||0)); if (val!==i.got) got.push(pname(i.pid)+" "+val); i.got=val; });
    if (act==="save-got"){
      if (got.length) addLog(o,"Gələnlər qeyd edildi",got.join(", "));
      if (o.items.every(i=>!itemMissing(i))){ finishReceive(o, role, v("rn")); toast("Hamısı gəldi, qəbul bitdi"); }
      else toast(got.length ? "Yadda saxlandı · "+o.items.filter(itemMissing).length+" mal hələ gəlməyib" : "Gələn miqdarı yazın");
    } else {
      const n = finishReceive(o, role, v("rn"));
      toast(n ? n+" gəlməyən mal Satınalmaya göndərildi" : "Hamısı gəldi, qəbul bitdi");
    }
  }
  else if (act==="approve"){
    advance(o,(holder(o)||role)+" təsdiqlədi",v("qn"));
    toast("Təsdiqləndi");
  }
  else if (act==="reject"){
    const note=v("qn"); if (!note) return toast("Rədd səbəbini yazın");
    o.items.forEach(i=>stockAdd(o.wh,i.pid,-(i.got||0)));
    o.status="redd"; o.last_move=new Date().toISOString();
    addLog(o,"Rədd edildi, mal qaytarılır",note);
    toast("Rədd edildi, qalıqdan çıxıldı");
  }
  else if (act==="fwd"){ advance(o,"Ötürüldü"+(o.chain[o.step+1]?" → "+o.chain[o.step+1]:""),v("fn")); }
  else if (act==="cancel"){ o.status="redd"; addLog(o,"Rəhbərlik ləğv etdi",""); }
  save(); render();
}

function addMove(wh, k){
  if (role!==wh) return;
  const to=$("mTo-"+k).value.trim(), product=$("mP-"+k).value.trim();
  if (!to) return toast("Haraya getdiyini yazın");
  if (!product) return toast("Məhsulun adını yazın");
  const mv={id:nextId(),wh,to,product,note:$("mN-"+k).value.trim(),by:role,at:new Date().toISOString()};
  S.moves.push(mv); S.log.push({by:role,act:"Yer dəyişmə",note:wh+" → "+to+": "+product+(mv.note?" ("+mv.note+")":""),at:mv.at});
  save(); render(); toast("Yazıldı");
}

// ----- Admin: kataloq əməliyyatları -----
function sure(btn, fn){
  if (btn.dataset.sure) return fn();
  btn.dataset.sure = 1; btn.textContent = "Əminsiniz?";
  setTimeout(()=>{ if (btn.isConnected){ delete btn.dataset.sure; btn.textContent = btn.dataset.pdel ? "Sil" : "×"; } }, 4000);
}
const now = () => new Date().toISOString();
function addProduct(){
  if (role!=="Admin") return;
  const name=$("pN").value.trim(); if(!name) return toast("Məhsulun adını yazın");
  if (pidByName(name)) return toast("Bu məhsul artıq kataloqdadır");
  const p={id:Math.max(...S.products.map(x=>x.id))+1,name,firm:$("pF").value};
  S.products.push(p); S.log.push({by:role,act:"Kataloqa məhsul əlavə edildi",note:name+(p.firm?" · "+p.firm:""),at:now()});
  save(); render(); toast(name+" əlavə olundu");
}
// Ad dəyişəndə köhnə sifarişlərdə də yeni ad görünür (sifariş məhsulu nömrə ilə saxlayır)
function renameProduct(el){
  const p = prod(el.dataset.pname), name = el.value.trim();
  if (!name){ el.value = p.name; return toast("Ad boş ola bilməz"); }
  if (name === p.name) return;
  const other = pidByName(name);
  if (other && other !== p.id){ el.value = p.name; return toast("“"+name+"” adlı məhsul artıq var"); }
  S.log.push({by:role,act:"Məhsulun adı dəyişdirildi",note:p.name+" → "+name,at:now()});
  p.name = name; save();
  el.value = name; el.closest("tr").dataset.s = name.toLowerCase();
  toast("Ad dəyişdirildi: "+name);
}
// Silinən məhsul köhnə sifarişlərdə adı ilə qalır, sadəcə yeni sifarişdə seçilmir
function delProduct(id){
  if (role!=="Admin") return;
  const p=prod(id); p.deleted=true;
  S.log.push({by:role,act:"Məhsul kataloqdan silindi",note:p.name,at:now()});
  save(); render(); toast(p.name+" silindi");
}
function unFirm(id){
  if (role!=="Admin") return;
  const p=prod(id), f=p.firm; p.firm="";
  S.log.push({by:role,act:"Məhsul firmadan çıxarıldı",note:p.name+" · "+f,at:now()});
  save(); render(); toast(p.name+" artıq "+f+" firmasından gəlmir");
}
function addToFirm(){
  if (role!=="Admin") return;
  const name=$("ffN").value.trim(); if (!name) return toast("Məhsulun adını yazın və ya seçin");
  const id=pidByName(name);
  if (id){ const p=prod(id), old=p.firm; p.firm=catFirm; S.log.push({by:role,act:"Məhsul firmaya əlavə edildi",note:p.name+" · "+(old||"firmasız")+" → "+catFirm,at:now()}); toast(p.name+" → "+catFirm); }
  else { const p={id:Math.max(...S.products.map(x=>x.id))+1,name,firm:catFirm,size:guessSize(name)}; S.products.push(p); S.log.push({by:role,act:"Kataloqa məhsul əlavə edildi",note:name+" · "+catFirm,at:now()}); toast("Yeni məhsul: "+name+" · "+catFirm); }
  save(); render();
}
function addFirm(){
  if (role!=="Admin") return;
  const f=$("fN").value.trim(); if(!f) return toast("Firmanın adını yazın");
  if (S.firms.some(x=>x.toLowerCase()===f.toLowerCase())) return toast("Bu firma artıq var");
  S.firms.push(f); S.firms.sort((a,b)=>a.localeCompare(b,"az"));
  S.log.push({by:role,act:"Firma əlavə edildi",note:f,at:now()});
  save(); render(); toast(f+" əlavə olundu");
}
function delFirm(f){
  if (role!=="Admin") return;
  S.firms = S.firms.filter(x=>x!==f);
  if (catFirm===f) catFirm="";
  S.products.forEach(p=>{ if (p.firm===f) p.firm=""; });
  S.log.push({by:role,act:"Firma silindi",note:f,at:now()});
  save(); render(); toast(f+" silindi");
}

// Müddət keçdikcə görünüşü yenilə
setInterval(()=>{ if (!["new","catalog","stock","moves","arr","orders"].includes(tab)) render(); }, 60000);
renderRole(); render();
