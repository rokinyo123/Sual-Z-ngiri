<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almond Anbar Zənciri</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5C2E0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almond Anbar">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Mono:wght@500&display=swap">
<style>
/* Layout: brown brand band (role + 5 tabs) → one 860px column. Every order is a card with a coloured left stripe
   that says its stage: orange Satınalmada → blue Gözlənilir → green Tam gəldi / red Natamam. Same colours everywhere. */
:root{
  --bg:#F6F1EA; --surface:#FFFFFF; --sunk:#F1E8DC; --line:#E6D9C7;
  --fg:#2B1A10; --muted:#7D6553; --brand:#5C2E0E; --brand-2:#7A4220; --brand-fg:#FFF6EA; --accent:#5C2E0E; --accent-fg:#FFF6EA;
  --buy:#E8590C; --buy-bg:#FFE8D6; --wait:#1C7ED6; --wait-bg:#DBEDFF; --ok:#2B8A3E; --ok-bg:#D3F9D8;
  --bad:#E03131; --bad-bg:#FFE3E3; --warn:#B7791F; --warn-bg:#FFF1BF; --qc:#7048E8; --qc-bg:#E5DBFF; --arch:#868E96; --arch-bg:#EEF0F2;
  --info:#1C7ED6; --info-bg:#DBEDFF;
  --display:"Noto Serif",Georgia,serif; --body:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Noto Sans Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17110C; --surface:#211912; --sunk:#2B2118; --line:#3D2F23;
  --fg:#F4E8D8; --muted:#BFA48A; --brand:#3A1D09; --brand-2:#4E2A12; --brand-fg:#FFF1DE; --accent:#E3A66C; --accent-fg:#22140A;
  --buy:#FF8A3D; --buy-bg:#3D2312; --wait:#5AB0FF; --wait-bg:#132B42; --ok:#5FD37A; --ok-bg:#16331D;
  --bad:#FF7070; --bad-bg:#44191A; --warn:#F5C451; --warn-bg:#3A2E10; --qc:#A991FF; --qc-bg:#2A2147; --arch:#A0A7AE; --arch-bg:#2A2D30;
  --info:#5AB0FF; --info-bg:#132B42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17110C; --surface:#211912; --sunk:#2B2118; --line:#3D2F23;
  --fg:#F4E8D8; --muted:#BFA48A; --brand:#3A1D09; --brand-2:#4E2A12; --brand-fg:#FFF1DE; --accent:#E3A66C; --accent-fg:#22140A;
  --buy:#FF8A3D; --buy-bg:#3D2312; --wait:#5AB0FF; --wait-bg:#132B42; --ok:#5FD37A; --ok-bg:#16331D;
  --bad:#FF7070; --bad-bg:#44191A; --warn:#F5C451; --warn-bg:#3A2E10; --qc:#A991FF; --qc-bg:#2A2147; --arch:#A0A7AE; --arch-bg:#2A2D30;
  --info:#5AB0FF; --info-bg:#132B42; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
header{background:var(--brand);color:var(--brand-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 12px rgba(40,15,0,.18)}
@media (max-width:700px){header{position:static}}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-block:10px 6px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--display);font-size:21px;letter-spacing:.2px}
.brand span{font-size:12px;opacity:.75;white-space:nowrap}
@media (max-width:480px){.brand span{display:none}}
.who{display:flex;align-items:center;gap:6px}
.who select{width:auto;max-width:190px;background:var(--brand-2);color:var(--brand-fg);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 12px;font-weight:600}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-bottom:8px}
.tabs button{background:transparent;border:none;color:var(--brand-fg);opacity:.75;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:600;position:relative}
.tabs button i{font-style:normal;font-size:18px;line-height:1.1}
.tabs button.on{opacity:1;background:rgba(255,255,255,.14)}
.tabs .n{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px}
main.wrap{padding-block:14px 48px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-size:19px;margin:6px 0 0;display:flex;align-items:center;gap:8px;text-wrap:balance}
h2 .cnt{font-family:var(--mono);font-size:13px;background:var(--sunk);color:var(--muted);border-radius:999px;padding:1px 9px}
h3{font-size:15px;margin:0}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
textarea{min-height:48px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--wait);outline-offset:1px}
button{background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
button:hover{filter:brightness(.97)}
button.pri{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);font-weight:600}
button.okb{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:600}
button.badb{background:transparent;color:var(--bad);border-color:var(--bad)}
button.sm{padding:4px 9px;font-size:13px}
button.big{width:100%;padding:11px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 150px;min-width:0}
.hint{font-size:13px;color:var(--muted)}
.meta{font-size:12px;color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px}
/* stage colours */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--wait-bg);color:var(--wait)} .p-mute{background:var(--sunk);color:var(--muted)}
.c-buy{background:var(--buy-bg);color:var(--buy)} .c-wait{background:var(--wait-bg);color:var(--wait)} .c-ok{background:var(--ok-bg);color:var(--ok)} .c-bad{background:var(--bad-bg);color:var(--bad)} .c-qc{background:var(--qc-bg);color:var(--qc)} .c-arch{background:var(--arch-bg);color:var(--arch)}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pipe button{border:none;border-radius:12px;padding:10px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;color:#fff}
.pipe b{font-family:var(--mono);font-size:24px;line-height:1}
.pipe span{font-size:12px;font-weight:600;opacity:.95}
.pipe .buy{background:var(--buy)} .pipe .wait{background:var(--wait)} .pipe .bad{background:var(--bad)} .pipe .ok{background:var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pipe button{color:#160d06}}
:root[data-theme="dark"] .pipe button{color:#160d06}
/* order card */
.oc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--arch);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.oc.s-buy{border-left-color:var(--buy)} .oc.s-wait{border-left-color:var(--wait)} .oc.s-ok{border-left-color:var(--ok)} .oc.s-bad{border-left-color:var(--bad)} .oc.s-qc{border-left-color:var(--qc)}
.oc.act{box-shadow:0 0 0 2px var(--brand) inset, 0 4px 14px rgba(60,25,5,.08)}
.oc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oid{font-family:var(--mono);font-weight:700}
.route{font-weight:600;flex:1 1 auto;min-width:0}
.route i{font-style:normal;color:var(--muted)}
.oc-t{display:flex;flex-direction:column;gap:3px;font-size:13px}
.oc-t .pill{margin-left:4px;vertical-align:1px}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.bar i{display:block}
.bar .b-ok{background:var(--ok)} .bar .b-warn{background:var(--warn)} .bar .b-bad{background:var(--bad)} .bar .b-wait{background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.ic{display:inline-flex;align-items:center;gap:5px;font-size:13px;background:var(--sunk);border-radius:8px;padding:3px 8px;max-width:100%}
.ic b{font-family:var(--mono);font-weight:500;font-size:12px}
.ic .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}
.ic.d-ok{background:var(--ok-bg)} .ic.d-ok .dot{background:var(--ok)}
.ic.d-warn{background:var(--warn-bg)} .ic.d-warn .dot{background:var(--warn)}
.ic.d-bad{background:var(--bad-bg)} .ic.d-bad .dot{background:var(--bad)}
.ic.d-wait .dot{background:var(--wait)}
.irows{display:flex;flex-direction:column;gap:6px}
.irow{border:1px solid var(--line);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.irow.okr{background:var(--ok-bg);border-color:transparent} .irow.warnr{background:var(--warn-bg);border-color:transparent} .irow.miss{background:var(--bad-bg);border-color:transparent}
.irow .in{flex-wrap:wrap;gap:6px}
.irow .q{font-size:13px}
.irow .st{margin-left:auto;font-size:11px}
.spn{font-size:13px;background:var(--wait-bg);border-radius:8px;padding:5px 9px}
.spn.c{background:var(--sunk)}
.alert.info{background:var(--wait-bg);border-color:var(--wait)} .alert.info .al-t{color:var(--wait)}
.alert.res{background:var(--ok-bg);border-color:var(--ok)} .alert.res .al-t{color:var(--ok)}
.cell{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:6px;border-top:1px dashed var(--line)}
.cell.ans{flex-direction:column;align-items:stretch}
.cl{flex:0 0 100%;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.cell.ans .cl{flex:none}
.seg3{display:flex;gap:5px;flex-wrap:wrap}
.seg3 button{padding:6px 10px;font-size:13px;background:var(--surface)}
.seg3 button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg3 button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg3 button.on.none{background:var(--arch);border-color:var(--arch);color:#fff}
.qwhy button{font-size:12px;padding:4px 9px}
.whin{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.whin input{width:84px}
.tg.on{background:var(--qc);border-color:var(--qc);color:#fff}
.p-qc,.c-chk{background:var(--qc-bg);color:var(--qc)}
.oc.s-chk{border-left-color:var(--qc)}
.pipe{grid-template-columns:repeat(5,1fr)}
.pipe .chk{background:var(--qc)}
.pipe b{font-size:21px}
.pipe span{font-size:11px}
.seg button.f-chk.on{background:var(--qc);border-color:var(--qc);color:#fff}
button[disabled]{opacity:.55;cursor:not-allowed}
.box{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
details.more>summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:8px}
.more-in{display:flex;flex-direction:column;gap:8px}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.chain .s{padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chain .s.done{color:var(--ok);border-color:var(--ok)}
.chain .s.cur{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.chain .ar{color:var(--muted)}
.log{font-size:13px;display:flex;flex-direction:column;gap:3px;border-left:2px solid var(--line);padding-left:10px}
/* receiving + reasons */
.rrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-radius:9px;padding:6px 8px;background:var(--surface)}
.rrow{flex-wrap:nowrap}
.rrow .nm{flex:1 1 auto;min-width:0}
.rrow .nm .pill{margin-top:3px;font-size:11px;padding:1px 7px}
.rrow input{width:74px;flex:0 0 auto}
.rrow button{flex:0 0 auto}
.dt{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:6px}
.rrow.okr{background:var(--ok-bg)} .rrow.warnr{background:var(--warn-bg)} .rrow.miss{background:var(--bad-bg)}
.rsn{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-radius:9px;padding:6px 8px}
.rsn.miss{background:var(--bad-bg)} .rsn.warnr{background:var(--warn-bg)}
.rsn input{flex:1 1 200px;min-width:0}
.rs{color:var(--bad);font-size:12px}
.fgrp{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--surface)}
/* tables */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.okr td{background:var(--ok-bg)} tr.warnr td{background:var(--warn-bg)} tr.miss td{background:var(--bad-bg)}
/* filters */
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--surface)}
.seg button.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.seg button .k{font-family:var(--mono);font-size:12px;opacity:.8;margin-left:3px}
.seg button.f-buy.on{background:var(--buy);border-color:var(--buy);color:#fff} .seg button.f-wait.on{background:var(--wait);border-color:var(--wait);color:#fff}
.seg button.f-bad.on{background:var(--bad);border-color:var(--bad);color:#fff} .seg button.f-ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
details.rangebar{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px}
details.rangebar>summary{cursor:pointer;font-size:14px}
details.rangebar[open]{display:flex;flex-direction:column;gap:8px}
/* timeline + week */
.tl{display:flex;flex-direction:column}
.tld{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tld:last-child{border-bottom:none}
.tlday{flex:0 0 64px;display:flex;flex-direction:column;font-family:var(--mono);font-size:14px}
.tlday span{font-family:var(--body);font-size:11px;color:var(--muted)}
.tlf{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chipb{text-align:left;background:var(--wait-bg);border:none;border-radius:9px;padding:4px 9px;font-size:13px;color:var(--fg)}
.chipb b{color:var(--wait)}
.alert{background:var(--bad-bg);border:1px solid var(--bad);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.al-t{color:var(--bad);font-size:15px}
.al-m{font-size:13px;color:var(--fg)}
.al-i{font-size:13px;color:var(--muted)}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calh b{font-family:var(--display);font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.cd{min-height:50px;border-radius:9px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line)}
.cd b{font-family:var(--mono);font-size:14px;font-weight:500}
.cd small{font-size:10px;font-weight:700}
.cd i{width:7px;height:7px;border-radius:50%}
.cd.fut{background:var(--bad);border-color:var(--bad);color:#fff}
.cd.today{box-shadow:0 0 0 2px var(--wait) inset}
.cd.sel{outline:3px solid var(--fg);outline-offset:-1px}
.week{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr)) auto;gap:4px;align-items:stretch}
.week>button.nav{padding:4px 6px}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.wd b{font-family:var(--mono);font-size:14px;color:var(--fg)}
.wd .dots{display:flex;gap:2px;min-height:8px}
.wd .dots i{width:7px;height:7px;border-radius:50%}
.wd.sel{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.wd.sel b{color:var(--brand-fg)}
.wd.today{box-shadow:0 0 0 2px var(--wait) inset}
.i-ok{background:var(--ok)} .i-warn{background:var(--warn)} .i-bad{background:var(--bad)} .i-wait{background:var(--wait)}
/* new order */
.opts{display:flex;flex-wrap:wrap;gap:5px}
.opts button{border-radius:999px;padding:5px 12px;font-size:13px;background:var(--surface)}
.opts button.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);font-weight:600}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.items-edit .it{display:grid;grid-template-columns:minmax(0,1fr) 104px 34px;gap:6px;align-items:center}
.it.newp input:first-child{border-color:var(--warn);background:var(--warn-bg)}
.imp{background:var(--wait-bg);border-radius:9px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px;background:var(--surface)}
.checks label.on{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.checks input{display:none}
/* files, photos, catalog bits (kept from v1) */
.photos{display:flex;gap:6px;flex-wrap:wrap}
.photos img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sunk);border-radius:8px;padding:6px 8px;font-size:13px}
.fic{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--ok-bg);color:var(--ok);border-radius:4px;padding:2px 5px}
/* Fayl seçimi: görünməz input düymənin tam üstündədir — telefonda barmaq birbaşa ona toxunur */
.btnlink,.thumb{position:relative;overflow:hidden}
input.fpick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0;font-size:16px}
.btnlink{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:13px;color:var(--fg);text-decoration:none;cursor:pointer}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.sheet td{font-size:12px;padding:4px 6px;white-space:nowrap}
.linkb{background:none;border:none;padding:0;color:var(--wait);text-decoration:underline;cursor:pointer}
.thumb{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);padding:0;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:var(--sunk);flex:0 0 auto;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.sm{width:22px;height:22px;border-radius:5px}
.thumb.empty{border-style:dashed;color:var(--muted);font-size:15px}
span.thumb.empty{cursor:default}
.pn{display:flex;gap:8px;align-items:center}
.sz{display:inline-block;font-family:var(--mono);font-size:11px;background:var(--wait-bg);color:var(--wait);border-radius:4px;padding:0 5px;white-space:nowrap}

<body>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><b>Almond</b><span>Anbar zənciri · demo</span></div>
      <div class="who"><select id="role" aria-label="Kim kimi baxırsınız"></select></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>
<div class="zoom" id="zoom" hidden><div class="zoom-in"><img id="zoomImg" alt=""><div class="zoom-bar"><b id="zoomName"></b><span id="zoomAdmin"></span><button id="zoomClose">Bağla</button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ===================== Əsas siyahılar =====================
const DEPTS = ["Anbar","Anbar (İnqilab)","Satınalma","Keyfiyyət","Texnoloq","İstehsalat","Çeşidləmə","Satış","Rəhbərlik","Admin"];
const WAREHOUSES = ["Anbar","Anbar (İnqilab)"];
const QC = ["Keyfiyyət","Texnoloq"];
const HOUR = 3600000, DAY = 86400000;

// ===================== Kömək funksiyaları =====================
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dstr = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => dstr(new Date());
const plusDays = n => dstr(new Date(Date.now()+n*DAY));
const fmtT = t => { const d = new Date(t); return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes()); };
const fmtD = s => { const [y,m,d] = s.split("-"); return d+"."+m+"."+y; };
const daysTo = s => Math.round((new Date(s+"T00:00:00") - new Date(today()+"T00:00:00"))/DAY);
const age = ms => { const m = Math.max(1,Math.floor(ms/60000)); if (m<60) return m+" dəq"; const h=Math.floor(m/60); return h<24 ? h+" saat" : Math.floor(h/24)+" gün"; };
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2400); }

// ===================== Kataloq (Excel: 01.10.2025 – 18.10.2026 sifariş vərəqələri) =====================
// [ad, firma] — firma boşdursa, Satınalma özü alır
const CATALOG = [];   // boş başlayır: mallar sifarişlərdən və Admin tərəfindən əlavə olunur
const FIRMS = ["A Agro", "Bal Qinyətoğulları", "Bərk Dərə (Həsənov Loğman)", "Cavid Pack", "Hicaz", "Loyal Packing", "Rofruit", "RİCH S.A. MMC", "Sultan təmizlik (Musayev Orxan Vahid oğlu)", "Tayqa (Veliyev Nahid Abbas oglu)", "İlkin penaplast", "Şünasif"];

// Ölçünü addan təxmin et: "40*80 penaplast" → 40*80, "D38" → D38, "Kofe tutacağı 12 oz" → 12 oz
function guessSize(n){
  const m = String(n).match(/\d+(?:[.,]\d+)?\s*[*x×\/]{1,2}\s*\d+(?:[.,]\d+)?(?:\s*[*x×\/]\s*\d+(?:[.,]\d+)?)?|\bD\s?\d+|\d+(?:[.,]\d+)?\s*(?:sm|mm|ml|oz|litr|qr|kq)\b/i);
  return m ? m[0].replace(/\s+/g," ") : "";
}

// ===================== Nümunə sifarişlər =====================
function seed(){
  const P = CATALOG.map((x,i)=>({id:i+1,name:x[0],firm:x[1],size:guessSize(x[0])}));
  const id = n => (P.find(p=>p.name.toLowerCase()===n.toLowerCase())||P[0]).id;
  const now = Date.now();
  const H = (by,act,note,ago) => ({by,act,note:note||"",at:new Date(now-ago*HOUR).toISOString()});
  const orders = [];   // boş başlayır: sifarişləri işçilər özləri yazır
  const log = [];
    return { v:5, products:P, firms:FIRMS.slice(), orders, log, alerts:[], seq:100, catalogReset:true };
}

// ===================== Yaddaş =====================
const KEY = "almond-anbar-v1";
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch(e){ S = seed(); }
if (!S.firms) S.firms = FIRMS.slice();
// Köhnə (Excel-dən avtomatik yığılmış) kataloq bir dəfə təmizlənir: yalnız sifarişlərdə işlənən mallar qalır
if (!S.catalogReset){
  const used = new Set(S.orders.flatMap(o=>o.items.flatMap(i=>[i.pid, i.was, i.ans && i.ans.sub].filter(Boolean))));
  S.products = S.products.filter(p=>used.has(p.id));
  S.catalogReset = true;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
}
S.products.forEach(p=>{ if (p.size===undefined) p.size = guessSize(p.name); });
let role = "Anbar";
try { role = localStorage.getItem(KEY+"-role") || role; } catch(e){}
let tab = "home", catFirm = "", catQ = "";
let draft;

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Brauzer yaddaşı doludur, şəkillərin sayını azaldın"); } }
const prod = id => S.products.find(p=>p.id===Number(id));
const pname = id => prod(id) ? prod(id).name : "?";
const pfirm = id => prod(id) ? prod(id).firm : "";
const psize = id => prod(id) ? prod(id).size||"" : "";
const num = v => parseFloat(String(v).replace(",",".")) || 0;
const pidByName = n => { const p = live().find(x=>x.name.toLowerCase()===String(n).trim().toLowerCase()); return p ? p.id : ""; };
const live = () => S.products.filter(p=>!p.deleted);
const datalist = () => '<datalist id="plist">'+live().map(p=>'<option value="'+esc(p.name)+'">'+esc(p.firm||"")+'</option>').join("")+'</datalist>';
const nextId = () => ++S.seq;
const newPid = () => Math.max(0,...S.products.map(x=>x.id))+1;
// Sifarişdə yazılan ad kataloqda yoxdursa, kataloqa "yeni" kimi əlavə olunur — Admin sonra düzəldir
function ensureProd(name, firm){
  const n = String(name).trim(); if (!n) return "";
  const ex = pidByName(n); if (ex) return ex;
  const p = { id:newPid(), name:n, firm:firm||"", size:guessSize(n), fromExcel:true };
  S.products.push(p); S.log.push({by:role,act:"Kataloqa yeni mal əlavə edildi",note:n,at:new Date().toISOString()});
  return p.id;
}
function addLog(o, act, note, by){
  const h = { by:by||role, act, note:note||"", at:new Date().toISOString() };
  if (o) { o.history.push(h); h.ref = "Sifariş #"+o.id; }
  S.log.push(h);
}

// ===================== Zəncir =====================
// Əsas Anbar:  Satınalmada → Gözlənilir (tarix) → Keyfiyyət yoxlayır → Anbar qeyd edir → bağlanır
//              Texnoloqa işarələnən mal Texnoloqun cavabını gözləyir, qalan hissə bağlanır.
//              Qəbul olunmayan / gəlməyən / az gələn hər mal üçün Satınalma cavab verir:
//              nə vaxt gələcək və ya əvəzində nə gələcək → həmin tarixlə yenidən Gözləyənə düşür.
// İnqilab:     Keyfiyyət və Texnoloq yoxdur — Gözlənilir → İnqilab qeyd edir → bağlanır.
// status: acik (Satınalmada) · yolda (Gözlənilir) · anbar (Anbar qeyd edir) · bagli · redd
const isOpen = o => o.status!=="bagli" && o.status!=="redd";
const hasQC = o => o.wh==="Anbar";                                   // Keyfiyyət yalnız əsas Anbarda
const arrived = o => o.status==="anbar";                              // Anbar "Gəldi" basıb
const dueNow = o => o.status==="yolda" && o.eta && daysTo(o.eta)<=0;   // bu gün (və ya keçmiş) gəlməlidir
const qcDone = o => o.items.every(i=>i.qc);
function holder(o){
  if (o.status==="acik") return "Satınalma";
  if (o.status==="yolda") return o.wh;
  if (o.status==="anbar") return o.wh;
  return null;
}
const itemMissing = i => (i.got||0) < num(i.qty);
const fmtN = n => String(Math.round(n*1000)/1000).replace(".",",");
function gotState(qty, got){
  if (got >= num(qty)) return ["Tam gəldi","p-ok"];
  if (got > 0) return ["Az gəldi · "+fmtN(num(qty)-got)+" əskik","p-warn"];
  return ["Gəlmədi","p-bad"];
}
// Problemli mal: Keyfiyyət qəbul etmədi, gəlmədi, az gəldi və ya Texnoloq uyğun saymadı
function problem(o,i){
  if (i.qc==="bad") return "Keyfiyyət: "+(i.qcWhy||"uyğun deyil");
  if (i.techRes==="bad") return "Texnoloq: "+(i.techNote||"uyğun deyil");
  if (!o.recvDone) return "";
  if (i.qc==="none" || !i.got) return "Gəlmədi";
  if (itemMissing(i)) return "Az gəldi · "+fmtN(num(i.qty)-i.got)+" əskik";
  return "";
}
const needsAnswer = o => o.items.some(i=>problem(o,i) && !i.ans);
const techPending = o => o.items.some(i=>i.tech && !i.techRes);
// Bir malın ümumi vəziyyəti (rəng + söz) — kalendarda, nişanlarda, cədvəldə
function itemState(o,i){
  const pr = problem(o,i);
  if (pr) return [pr, pr.startsWith("Az") ? "p-warn" : "p-bad"];
  if (i.tech && !i.techRes) return ["Texnoloqda","p-qc"];
  if (i.got!=null) return gotState(i.qty,i.got);
  if (i.qc==="ok") return ["Keyfiyyət ✓","p-info"];
  if (o.status==="acik") return ["Satınalmada","p-mute"];
  if (o.status==="anbar") return ["Gəldi · yoxlanır","p-info"];
  return daysTo(o.eta)>0 ? ["Gözlənilir","p-mute"] : ["Bu gün gəlməlidir","p-info"];
}
const rowCls = st => ({"p-ok":"okr","p-warn":"warnr","p-bad":"miss"})[st[1]] || "";
function finishReceive(o, by, note){
  o.items.forEach(i=>{ if (i.qc==="bad"||i.qc==="none") i.got = 0; else if (i.got==null) i.got = 0; });
  o.recvDone = true; o.status = "bagli"; o.last_move = new Date().toISOString();
  const pr = o.items.filter(i=>problem(o,i)).length, th = o.items.filter(i=>i.tech).length;
  addLog(o, "Qəbul bitdi", [pr ? pr+" mal üçün Satınalmanın cavabı lazımdır" : "Hamısı qəbul olundu", th ? th+" mal Texnoloqda" : "", note].filter(Boolean).join(" · "), by);
  return pr;
}
// Gəliş günü keçib, heç kim heç nə qeyd etməyibsə — hamısı "gəlmədi" sayılır və xəbərdarlıq çıxır
function autoMissing(){
  let n = 0;
  S.orders.forEach(o=>{
    if (o.status!=="yolda" || !o.eta || daysTo(o.eta)>=0 || o.items.some(i=>i.qc||i.got!=null)) return;
    o.items.forEach(i=>{ i.qc = hasQC(o) ? "none" : i.qc; });
    finishReceive(o,"Sistem","Gəliş günü keçdi, heç nə qeyd olunmayıb"); n++;
    notify([o.wh,o.from,"Satınalma","Rəhbərlik"], "late", fmtD(o.eta)+" gəlməli olan "+o.items.length+" mal gəlmədi", (o.supplier||"Firmasız")+" → "+o.wh+" · #"+o.id+" · Satınalma cavab verməlidir", o.items.map(i=>pname(i.pid)+" ("+i.qty+")"), o.id);
  });
  if (n) save();
}
function notify(to, kind, title, sub, items, oid){
  (S.alerts = S.alerts || []).unshift({ id:"n"+Date.now()+Math.random().toString(36).slice(2,6), kind, to:[...new Set(to)], title, sub, items:items||[], oid, at:new Date().toISOString(), seen:[] });
}
const myAlerts = () => (S.alerts||[]).filter(a=>!a.seen.includes(role) && (a.to ? a.to.includes(role) : [a.wh,a.from,"Satınalma","Rəhbərlik"].includes(role)));
const ALK = { late:["⚠","alert"], ok:["✓","alert info"], arr:["📦","alert info"], res:["📋","alert res"] };
function alertsHtml(){
  return myAlerts().map(a=>{
    const [ic,cl] = ALK[a.kind||"late"] || ALK.late;
    const title = a.title || (fmtD(a.eta)+" gəlməli olan "+a.items.length+" mal gəlmədi");
    const sub = a.sub || ((a.supplier||"Firmasız")+" → "+a.wh+" · #"+a.oid+" · Satınalma cavab verməlidir");
    return '<div class="'+cl+'"><div class="al-t">'+ic+' <b>'+esc(title)+'</b></div><div class="al-m">'+esc(sub)+'</div>'+
      (a.items.length?'<div class="al-i">'+a.items.map(esc).join(" · ")+'</div>':"")+
      '<div class="row"><button class="sm" data-goorder="'+a.oid+'">Bax</button><button class="sm" data-seen="'+a.id+'">Oxudum</button></div></div>';
  }).join("");
}
const notified = new Set();
function pushNotify(){
  try {
    if (!("Notification" in window) || Notification.permission!=="granted") return;
    myAlerts().forEach(a=>{ if (notified.has(a.id+role)) return; notified.add(a.id+role);
      new Notification("Almond Anbar", { body: a.title || (fmtD(a.eta)+": "+a.items.length+" mal gəlmədi") }); });
  } catch(e){}
}

// ===================== Mərhələ: hamı üçün eyni rəng =====================
function stage(o){
  if (o.status==="redd") return {k:"arch", t:"Ləğv edildi"};
  if (o.status==="acik") return {k:"buy", t:"Satınalmada"};
  if (o.status==="yolda") return dueNow(o) ? {k:"wait", t:"Bu gün gəlməlidir"} : {k:"wait", t:"Gözlənilir · "+fmtD(o.eta).slice(0,5)};
  if (o.status==="anbar") return hasQC(o) && !o.qcAt ? {k:"chk", t:"Gəldi · Keyfiyyət yoxlayır"} : {k:"chk", t:"Gəldi · "+o.wh+" qeyd edir"};
  if (needsAnswer(o)) return {k:"bad", t:"Satınalmanın cavabı gözlənilir"};
  if (techPending(o)) return {k:"chk", t:"Texnoloqda"};
  if (o.items.some(i=>problem(o,i))) return {k:"bad", t:"Natamam · cavablandı"};
  return {k:"ok", t:"Tam qəbul olundu"};
}
const STAGES = [["buy","Satınalmada"],["wait","Gözlənilir"],["chk","Yoxlanır"],["bad","Problem"],["ok","Tam"]];
const needBy = o => new Date(new Date(o.created).getTime() + o.deadline_h*HOUR);
const etaTxt = o => o.eta ? fmtD(o.eta) : "";
const shortT = d => pad(d.getDate())+"."+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes());
const overdue = o => (o.status==="acik"||o.status==="yolda") && Date.now() > needBy(o).getTime();
const odate = o => o.eta || o.created.slice(0,10);
const WD = ["Bazar","Bazar ertəsi","Çərşənbə axşamı","Çərşənbə","Cümə axşamı","Cümə","Şənbə"];
const wday = d => WD[new Date(d+"T00:00:00").getDay()];
function guessFirm(o){
  const c = {}; o.items.forEach(i=>{ const f=pfirm(i.pid); if (f) c[f]=(c[f]||0)+1; });
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0] || "";
}

// Kimdən indi nə gözlənilir
function myWork(){
  return S.orders.filter(o=>{
    if (o.status==="redd") return false;
    if (role==="Satınalma") return o.status==="acik" || (o.recvDone && needsAnswer(o));
    if (role==="Keyfiyyət") return o.status==="anbar" && hasQC(o) && !o.qcAt;
    if (role==="Texnoloq") return techPending(o);
    if (WAREHOUSES.includes(role)) return o.wh===role && (o.status==="anbar" || dueNow(o));
    return false;
  }).sort((a,b)=> odate(a).localeCompare(odate(b)) || a.id-b.id);
}

// ===================== Ümumi görünüş =====================
// Hər şöbə yalnız ona lazım olan bölmələri görür
function tabsFor(r){
  const t = [["home","🏠","Bu gün"],["orders","📦","Sifarişlər"]];
  if (WAREHOUSES.includes(r)) t.push(["new","➕","Sifariş"]);
  if (["Satınalma","Rəhbərlik","Anbar","Anbar (İnqilab)","İstehsalat","Admin"].includes(r)) t.push(["days","🗓","Gəlişlər"]);
  if (r==="Admin") t.push(["catalog","📚","Kataloq"]);
  return t;
}
function renderRole(){
  $("role").innerHTML = DEPTS.map(d=>'<option'+(d===role?" selected":"")+'>'+esc(d)+'</option>').join("");
}
function renderTabs(){
  const T = tabsFor(role); if (!T.some(t=>t[0]===tab)) tab = "home";
  const n = myWork().length + myAlerts().length;
  $("tabs").style.gridTemplateColumns = "repeat("+T.length+",1fr)";
  $("tabs").innerHTML = T.map(([k,ic,l])=>'<button data-tab="'+k+'" class="'+(tab===k?"on":"")+'"><i>'+ic+'</i>'+l+(k==="home"&&n?'<span class="n">'+n+'</span>':"")+'</button>').join("");
}
function render(){
  autoMissing(); pushNotify(); dlDone = false;
  renderTabs();
  $("main").innerHTML = { home:vHome, orders:vOrders, new:vNew, days:vDays, catalog:vCatalog }[tab]();
  if (tab==="new") bindNew();
  if (tab==="catalog") filterRows($("cQ"));
}

// ----- Bu gün -----
const WORK_TITLE = { "Satınalma":"Qəbul ediləcək sifarişlər və cavab gözləyən mallar", "Keyfiyyət":"Anbara gələn mallar · yoxlayın", "Texnoloq":"İstehsalatda yoxlanacaq mallar", "Anbar":"Mal gələndə “📦 Gəldi” basın, sonra gələn miqdarı yazın", "Anbar (İnqilab)":"Mal gələndə “📦 Gəldi” basın, sonra gələn miqdarı yazın" };
function pipe(){
  const c = k => S.orders.filter(o=>stage(o).k===k && (k!=="ok" || daysTo(odate(o))>=-7)).length;
  return '<div class="pipe">'+STAGES.map(([k,l])=>'<button class="'+k+'" data-go="orders:'+k+'"><b>'+c(k)+'</b><span>'+l+'</span></button>').join("")+'</div>';
}
function vHome(){
  const work = myWork();
  let html = alertsHtml() + pipe();
  if (WORK_TITLE[role] || work.length){
    html += '<h2>Sizin işiniz <span class="cnt">'+work.length+'</span></h2>' + (WORK_TITLE[role]?'<div class="hint">'+WORK_TITLE[role]+'</div>':"");
    html += work.length ? work.map(o=>orderCard(o)).join("") : '<div class="empty">✓ Hazırda iş yoxdur</div>';
  }
  if (role==="Satınalma"){
    const w = S.orders.filter(o=>o.status==="yolda").sort((a,b)=>odate(a).localeCompare(odate(b)));
    if (w.length) html += '<h2>Gözlənilir <span class="cnt">'+w.length+'</span></h2>' + w.map(o=>orderCard(o)).join("");
  } else if (WAREHOUSES.includes(role)){
    const ids = new Set(work.map(o=>o.id));
    const mine = S.orders.filter(o=>o.wh===role && !ids.has(o.id) && (isOpen(o) || needsAnswer(o) || techPending(o))).sort((a,b)=>odate(a).localeCompare(odate(b)));
    if (mine.length) html += '<h2>Sifarişləriniz <span class="cnt">'+mine.length+'</span></h2>' + mine.map(o=>orderCard(o)).join("");
  } else if (role==="Rəhbərlik"){
    const late = S.orders.filter(overdue), na = S.orders.filter(o=>o.recvDone && needsAnswer(o));
    if (late.length) html += '<h2>Vaxtı keçənlər <span class="cnt">'+late.length+'</span></h2>' + late.map(o=>orderCard(o)).join("");
    if (na.length) html += '<h2>Satınalmanın cavabı gözlənilir <span class="cnt">'+na.length+'</span></h2>' + na.map(o=>orderCard(o)).join("");
  }
  html += upcoming();
  const canAsk = (()=>{ try { return "Notification" in window && Notification.permission==="default"; } catch(e){ return false; } })();
  html += '<div class="foot">'+(installEvt?'<button class="linkb" id="install">📲 Tətbiq kimi quraşdır</button> · ':"")+(canAsk?'<button class="linkb" id="notif">🔔 Bildirişləri aç</button> · ':"")+'Məlumatlar bu cihazda saxlanılır · <button class="linkb" id="reset">Hamısını sıfırla</button></div>';
  return html;
}
function upcoming(){
  const list = S.orders.filter(o=>o.status==="yolda" && o.eta && daysTo(o.eta)>=0 && daysTo(o.eta)<=7).sort((a,b)=>a.eta.localeCompare(b.eta));
  if (!list.length) return "";
  const by = {}; list.forEach(o=>(by[o.eta]=by[o.eta]||[]).push(o));
  return '<h2>Yaxın günlərdə gələcəklər</h2><div class="card tl">'+Object.keys(by).sort().map(d=>
    '<div class="tld"><div class="tlday"><b>'+fmtD(d).slice(0,5)+'</b><span>'+(d===today()?"bu gün":daysTo(d)===1?"sabah":wday(d))+'</span></div><div class="tlf">'+
    by[d].map(o=>'<button class="chipb" data-goorder="'+o.id+'"><b>'+esc(o.supplier||"Firmasız")+'</b> <span class="meta">→ '+esc(o.wh)+' · '+o.items.length+' mal</span></button>').join("")+'</div></div>').join("")+'</div>';
}

// ----- Sifariş kartı: hər mal bir sətir, hər şöbənin öz xanası -----
const openMore = new Set();
const QC_WHY = ["Vaxtı keçib","Etiket yoxdur","Azərbaycanca yazı yoxdur","Tarix yazılmayıb"];
function itemCat(st){ return st[1]==="p-ok"?"ok":st[1]==="p-warn"?"warn":st[1]==="p-bad"?"bad":"wait"; }
function orderCard(o){
  const st = stage(o), nb = needBy(o);
  const act = myWork().some(x=>x.id===o.id);
  const accepted = !!o.eta && o.status!=="acik";
  let promise = '<span>🚚 <span class="meta">Satınalma hələ tarix verməyib</span></span>';
  if (accepted){
    const lateD = Math.round((new Date(o.eta+"T00:00:00") - new Date(dstr(nb)+"T00:00:00"))/DAY);
    promise = '<span>🚚 <b>'+etaTxt(o)+'</b>'+(o.supplier?' · '+esc(o.supplier):"")+(lateD>0?' <span class="pill p-bad">'+lateD+' gün gec</span>':' <span class="pill p-ok">vaxtında</span>')+'</span>';
  }
  const need = '<span>⏱ <b>'+o.deadline_h+' saatlıq</b> · '+shortT(nb)+'-dək'+(overdue(o)?' <span class="pill p-bad">vaxtı keçib</span>':"")+'</span>';
  const sts = o.items.map(i=>itemState(o,i)), cnt = {ok:0,warn:0,bad:0,wait:0}; sts.forEach(s=>cnt[itemCat(s)]++);
  const bar = accepted ? '<div class="bar">'+["ok","warn","bad","wait"].map(k=>cnt[k]?'<i class="b-'+k+'" style="flex:'+cnt[k]+'"></i>':"").join("")+'</div>' : "";
  const extra = [o.type, o.group?"#"+o.group+" · hissə "+o.part:"", o.parent?"#"+o.parent+" sifarişinin davamı":""].filter(Boolean).join(" · ");
  const rows = o.status==="acik" ? '<div class="chips">'+o.items.map(i=>'<span class="ic">'+thumb(i.pid,1)+esc(pname(i.pid))+(psize(i.pid)?' <span class="sz">'+esc(psize(i.pid))+'</span>':"")+' <b>'+esc(i.qty)+'</b>'+(i.added?' <span class="addtag">+</span>':"")+'</span>').join("")+'</div>'
    : '<div class="irows">'+o.items.map((i,k)=>itemRow(o,i,k,sts[k])).join("")+'</div>';
  return '<article class="oc s-'+st.k+(act?" act":"")+'" id="o-'+o.id+'">'+
    '<div class="oc-h"><span class="oid">#'+o.id+'</span><span class="route">'+esc(o.from)+' <i>→</i> '+esc(o.wh)+'</span><span class="pill c-'+st.k+'">'+esc(st.t)+'</span></div>'+
    '<div class="oc-t">'+need+promise+'</div>'+ (extra?'<div class="meta">'+esc(extra)+'</div>':"")+
    bar + (o.note?'<div class="hint">“'+esc(o.note)+'”</div>':"") +
    (o.spNote?'<div class="spn">💬 <b>Satınalma:</b> '+esc(o.spNote)+'</div>':"") +
    (o.comments.length?'<div class="spn c">💬 <b>'+esc(o.comments[o.comments.length-1].by)+':</b> '+esc(o.comments[o.comments.length-1].text)+(o.comments.length>1?' <span class="meta">(+'+(o.comments.length-1)+')</span>':"")+'</div>':"") + rows + footActions(o) + addBox(o) + more(o) + '</article>';
}
// Bir malın sətri: adı, miqdarı və Keyfiyyət · Anbar · Texnoloq · Satınalma xanaları
function itemRow(o,i,k,st){
  const key = o.id+"-"+k, accepted = !!o.eta && o.status!=="acik";
  const cells = [];
  // Keyfiyyət
  if (hasQC(o)){
    if (role==="Keyfiyyət" && o.status==="anbar" && !o.qcAt){
      cells.push('<div class="cell"><span class="cl">Keyfiyyət</span><div class="seg3">'+
        '<button class="'+(i.qc==="ok"?"on ok":"")+'" data-qc="'+key+'" data-v="ok">✓ Uyğun</button>'+
        '<button class="'+(i.qc==="bad"?"on bad":"")+'" data-qc="'+key+'" data-v="bad">✗ Uyğun deyil</button>'+
        '<button class="'+(i.qc==="none"?"on none":"")+'" data-qc="'+key+'" data-v="none">Gəlmədi</button></div>'+
        (i.qc==="bad" ? '<div class="seg qwhy">'+QC_WHY.map(w=>'<button class="'+(i.qcWhy===w?"on":"")+'" data-qcwhy="'+key+'" data-v="'+esc(w)+'">'+w+'</button>').join("")+'</div>' : "")+'</div>');
    } else if (i.qc){
      cells.push('<div class="cell"><span class="cl">Keyfiyyət</span>'+(i.qc==="ok"?'<span class="pill p-ok">✓ uyğun</span>':i.qc==="bad"?'<span class="pill p-bad">✗ '+esc(i.qcWhy||"uyğun deyil")+'</span>':'<span class="pill p-bad">gəlmədi</span>')+'</div>');
    } else if (accepted && arrived(o)) cells.push('<div class="cell"><span class="cl">Keyfiyyət</span><span class="meta">yoxlayır…</span></div>');
  }
  // Anbar / İnqilab
  const canWh = role===o.wh && o.status==="anbar";
  if (canWh && i.qc!=="bad" && i.qc!=="none"){
    cells.push('<div class="cell"><span class="cl">'+esc(o.wh)+'</span><div class="whin"><input type="number" min="0" step="any" data-got="'+key+'" data-q="'+esc(i.qty)+'" id="got-'+key+'" placeholder="gələn" value="'+(i.got!=null?i.got:"")+'"><button class="sm" data-full="'+key+'" data-q="'+num(i.qty)+'">Tam</button>'+
      (hasQC(o)?'<button class="sm tg'+(i.tech?" on":"")+'" data-tech="'+key+'" title="Texnoloqa göndər">🔬 Texnoloqa</button>':"")+'</div></div>');
  } else if (canWh){
    cells.push('<div class="cell"><span class="cl">'+esc(o.wh)+'</span><span class="pill p-bad">qəbul olunmadı</span></div>');
  } else if (i.got!=null || o.recvDone){
    cells.push('<div class="cell"><span class="cl">'+esc(o.wh)+'</span>'+(i.qc==="bad"?'<span class="pill p-bad">qəbul olunmadı</span>':'<span class="pill '+gotState(i.qty,i.got||0)[1]+'">'+(i.got?fmtN(i.got)+" qəbul":"gəlmədi")+'</span>')+(i.tech?' <span class="pill p-qc">🔬</span>':"")+'</div>');
  }
  // Texnoloq
  if (i.tech){
    if (role==="Texnoloq" && !i.techRes){
      cells.push('<div class="cell"><span class="cl">Texnoloq</span><input id="tn-'+key+'" placeholder="Rəy (məs. bişirdik, effekt verdi)"><div class="seg3"><button data-techres="'+key+'" data-v="ok">✓ Uyğun</button><button data-techres="'+key+'" data-v="bad">✗ Uyğun deyil</button></div></div>');
    } else cells.push('<div class="cell"><span class="cl">Texnoloq</span>'+(i.techRes==="ok"?'<span class="pill p-ok">✓ uyğun</span>':i.techRes==="bad"?'<span class="pill p-bad">✗ uyğun deyil</span>':'<span class="pill p-qc">yoxlayır…</span>')+(i.techNote?' <span class="meta">'+esc(i.techNote)+'</span>':"")+'</div>');
  }
  // Satınalmanın cavabı
  const pr = problem(o,i);
  if (pr){
    if (i.ans) cells.push('<div class="cell"><span class="cl">Satınalma</span><span class="pill p-info">'+(i.ans.sub?'🔄 əvəzinə '+esc(pname(i.ans.sub)):'📅 '+fmtD(i.ans.date)+' gələcək')+'</span>'+(i.ans.sub?' <span class="meta">'+fmtD(i.ans.date)+'</span>':"")+(i.ans.note?' <span class="meta">'+esc(i.ans.note)+'</span>':"")+(i.ans.follow?' <button class="linkb mono" data-goorder="'+i.ans.follow+'">#'+i.ans.follow+'</button>':"")+'</div>');
    else if (role==="Satınalma" && o.recvDone) cells.push('<div class="cell ans"><span class="cl">Satınalmanın cavabı</span>'+
      '<div class="dt"><input type="date" id="ad-'+key+'" value="'+plusDays(1)+'" aria-label="Nə vaxt gələcək"><input id="aq-'+key+'" value="'+esc(remainQty(i))+'" aria-label="Miqdar"></div>'+
      '<input id="as-'+key+'" list="plist" placeholder="🔄 Əvəzində başqa mal (istəyə görə)">'+datalistOnce()+
      '<input id="an-'+key+'" placeholder="Qeyd (istəyə görə)"><button class="pri" data-answer="'+key+'">Cavab ver → Anbar gözləsin</button></div>');
    else cells.push('<div class="cell"><span class="cl">Satınalma</span><span class="meta">cavab gözlənilir</span></div>');
  }
  return '<div class="irow '+rowCls(st)+'"><div class="in pn">'+thumb(i.pid,1)+'<span><b>'+esc(pname(i.pid))+'</b>'+(psize(i.pid)?' <span class="sz">'+esc(psize(i.pid))+'</span>':"")+' <span class="mono q">'+esc(i.qty)+'</span>'+(i.added?' <span class="addtag">+</span>':"")+'</span><span class="pill '+st[1]+' st">'+esc(st[0])+'</span></div>'+cells.join("")+'</div>';
}
const remainQty = i => i.got && itemMissing(i) && i.qc!=="bad" && i.techRes!=="bad" ? fmtN(num(i.qty)-i.got)+String(i.qty).replace(/^[\d.,\s]+/," ") : i.qty;
let dlDone = false; const datalistOnce = () => dlDone ? "" : (dlDone = true, datalist());
// Kartın altındakı ümumi düymə (şöbənin addımını bitirmək)
function footActions(o){
  if (role==="Keyfiyyət" && o.status==="anbar" && hasQC(o) && !o.qcAt){
    const left = o.items.filter(i=>!i.qc).length;
    return '<div class="box"><button class="okb big" data-act="qcall" data-id="'+o.id+'">✓ Hamısı uyğundur</button>'+
      '<button class="pri big" data-act="qcdone" data-id="'+o.id+'"'+(left?" disabled":"")+'>'+(left?left+" mal yoxlanmayıb":"Yoxlamanı bitir")+'</button></div>';
  }
  if (role===o.wh && o.status==="yolda")
    return '<div class="box"><button class="okb big" data-act="arrived" data-id="'+o.id+'">📦 Gəldi</button><div class="hint">Mal anbara çatanda basın'+(hasQC(o)?" — Keyfiyyət də xəbər tutacaq":"")+'.</div></div>';
  if (role===o.wh && o.status==="anbar"){
    const wait = hasQC(o) && !o.qcAt;
    return '<div class="box"><button class="sm" data-act="allfull" data-id="'+o.id+'">Hamısı tam gəldi</button><input id="rn-'+o.id+'" placeholder="Qeyd (istəyə görə)">'+
      '<button class="pri big" data-act="receive" data-id="'+o.id+'"'+(wait?" disabled":"")+'>'+(wait?"Keyfiyyət yoxlamasını gözləyir…":"Bitir → Satınalmaya göndər")+'</button>'+
      '<div class="hint">Boş qalan mallar "gəlmədi" sayılacaq. Nəticə Satınalmaya gedəcək.</div></div>';
  }
  if (role==="Satınalma" && o.status==="acik") return acceptBox(o);
  return "";
}
function more(o){
  const nf = o.photos.length + (o.files||[]).length;
  return '<details class="more" data-more="'+o.id+'"'+(openMore.has(o.id)?" open":"")+'><summary>▸ Ətraflı'+(o.comments.length?' · 💬 '+o.comments.length:"")+(nf?' · 📎 '+nf:"")+' · '+fmtT(o.created)+'</summary><div class="more-in">'+
    (o.photos.length?'<div class="photos">'+o.photos.map(p=>'<img src="'+p+'" alt="Sifariş şəkli">').join("")+'</div>':"") + fileList(o.files||[],o.id) +
    o.comments.map(c=>'<div class="hint"><b>'+esc(c.by)+':</b> '+esc(c.text)+'</div>').join("") +
    '<div class="row"><input class="grow" id="c-'+o.id+'" placeholder="Şərh yazın"><button class="sm" data-act="comment" data-id="'+o.id+'">Şərh</button>'+
    '<label class="btnlink">📷<input type="file" accept="image/*" data-photo="'+o.id+'" class="fpick"></label>'+
    '<label class="btnlink">📎<input type="file" data-file="'+o.id+'" class="fpick"></label>'+
    (role==="Rəhbərlik" && isOpen(o) ? '<button class="sm badb" data-act="cancel" data-id="'+o.id+'">Ləğv et</button>' : "")+'</div>'+
    '<div class="log">'+o.history.map(x=>'<div><span class="meta">'+fmtT(x.at)+'</span> · <b>'+esc(x.by)+'</b> — '+esc(x.act)+(x.note?': '+esc(x.note):"")+'</div>').join("")+'</div></div></details>';
}
document.addEventListener("toggle", e => { const d=e.target; if (d.dataset && d.dataset.more){ const id=Number(d.dataset.more); d.open ? openMore.add(id) : openMore.delete(id); } }, true);

// ----- Fayllar (Excel, PDF və s.) -----
const MAXF = 1.5*1024*1024;
function readFile(f){
  if (f.size > MAXF){ toast(f.name+": demo versiyada 1,5 MB-dan böyük fayl olmaz"); return Promise.resolve(null); }
  return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res({name:f.name,size:f.size,data:r.result,by:role,at:new Date().toISOString()}); r.readAsDataURL(f); });
}
const isSheet = n => /\.(xlsx|xlsm|xls|csv)$/i.test(n);
const fsize = b => b>1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB";
function fileList(files, key){
  if (!files.length) return "";
  return '<div class="files">'+files.map((f,i)=>'<div class="file"><span class="fic">'+(isSheet(f.name)?"XLS":(f.name.split(".").pop()||"").slice(0,4).toUpperCase())+'</span><span class="grow"><b>'+esc(f.name)+'</b><span class="meta"> · '+fsize(f.size)+(f.by?' · '+esc(f.by):"")+'</span></span>'+
    (isSheet(f.name)?'<button class="sm" data-view="'+key+':'+i+'">Bax</button>':"")+
    '<a class="sm btnlink" href="'+f.data+'" download="'+esc(f.name)+'">Yüklə</a>'+
    (key==="d"?'<button class="sm" data-fdel="'+i+'" aria-label="Sil">×</button>':"")+
    '</div><div class="sheet" id="sv-'+key+'-'+i+'" hidden></div>').join("")+'</div>';
}
function viewSheet(key, i){
  const box = $("sv-"+key+"-"+i);
  if (!box.hidden){ box.hidden = true; return; }
  const f = (key==="d" ? draft.files : S.orders.find(o=>o.id===Number(key)).files)[i];
  if (!window.XLSX){ box.innerHTML='<div class="hint">Excel oxuyucu yüklənmədi. İnternet bağlantısını yoxlayın.</div>'; box.hidden=false; return; }
  try {
    const wb = XLSX.read(f.data.split(",")[1], {type:"base64"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false}).slice(0,60);
    box.innerHTML = '<div class="meta">Vərəq: '+esc(wb.SheetNames[0])+(wb.SheetNames.length>1?' (cəmi '+wb.SheetNames.length+' vərəq, birincisi göstərilir)':"")+'</div><div class="tbl"><table>'+
      rows.map(r=>'<tr>'+Array.from(r,c=>'<td>'+esc(c??"")+'</td>').join("")+'</tr>').join("")+'</table></div>';
  } catch(e){ box.innerHTML='<div class="hint">Bu faylı oxumaq olmadı.</div>'; }
  box.hidden = false;
}

// ----- Göndərilmiş sifarişə əlavə (yalnız göndərən, həmin günün sonuna qədər) -----
// Mal qəbulu başlamayıbsa əlavə olunur. Satınalma sifarişi artıq qəbul edibsə, sifariş
// əlavələrlə birlikdə yenidən Satınalmaya qayıdır ki, yeni malları da sifariş etsin.
const addDraft = {};
const canAdd = o => o.from===role && !o.parent && o.created.slice(0,10)===today() && ["acik","yolda"].includes(o.status) && o.items.every(i=>i.got==null);
function addBox(o){
  if (!canAdd(o)) return "";
  const d = addDraft[o.id];
  if (!d) return '<div class="row"><button class="sm" data-addopen="'+o.id+'">+ Sifarişə əlavə et</button><span class="hint">Bu gün 23:59-a qədər mümkündür.</span></div>';
  return '<div class="box"><h3>Sifarişə əlavə</h3>'+datalist()+
    d.map((r,k)=>'<div class="it"><input list="plist" placeholder="Məhsulun adı" data-ad="'+o.id+'-'+k+'-n" value="'+esc(r.n)+'"><input placeholder="məs. 5 kq" data-ad="'+o.id+'-'+k+'-q" value="'+esc(r.q)+'"><button class="sm" data-addrow="'+o.id+'-'+k+'" aria-label="Sil">×</button></div>').join("")+
    '<div class="row"><button class="sm" data-addmore="'+o.id+'">+ Sətir</button></div>'+
    '<div class="hint">'+(o.status==="yolda"?"Satınalma bu sifarişi artıq qəbul edib. Göndərəndə sifariş yeni mallarla birlikdə yenidən Satınalmaya qayıdacaq.":"Sifariş hələ Satınalmadadır, yeni mallar dərhal ona görünəcək.")+'</div>'+
    '<div class="row"><button class="pri" data-addsend="'+o.id+'">Əlavəni göndər</button><button data-addcancel="'+o.id+'">Ləğv et</button></div></div>';
}
function addSend(id){
  const o = S.orders.find(x=>x.id===id), d = addDraft[id] || [];
  if (!canAdd(o)) { delete addDraft[id]; render(); return toast("Bu sifarişə artıq əlavə etmək olmaz"); }
  const rows = d.filter(r=>r.n.trim() || r.q.trim());
  const noQ = rows.find(r=>!r.q.trim());
  if (noQ) return toast(noQ.n+": miqdarı yazın");
  if (!rows.length) return toast("Ən azı bir məhsul yazın");
  if (rows.some(r=>!r.n.trim())) return toast("Malın adını yazın");
  rows.forEach(r=>o.items.push({pid:ensureProd(r.n), qty:normQty(r.q), added:true}));
  const note = rows.map(r=>r.n.trim()+" "+normQty(r.q)).join(", ");
  o.addedAt = new Date().toISOString();
  if (o.status==="yolda"){
    o.status = "acik"; o.last_move = o.addedAt;
    addLog(o,"Sifarişə əlavə edildi, yenidən Satınalmaya göndərildi",note);
  } else addLog(o,"Sifarişə əlavə edildi",note);
  delete addDraft[id]; save(); render();
  toast(rows.length+" mal əlavə olundu → Satınalma");
}

// ----- Satınalma: sifarişi qəbul edir, gəliş günü təyin edir -----
// Bir neçə firmanın malı varsa, hər firmaya öz günü verilir və sifariş firmalar üzrə bölünür.
function firmGroups(o){
  const g = {};
  o.items.forEach((i,k)=>{ const f = pfirm(i.pid) || ""; (g[f] = g[f] || []).push(k); });
  return Object.keys(g).sort((a,b)=>!a?1:!b?-1:a.localeCompare(b,"az")).map(f=>({firm:f, idx:g[f]}));
}
function acceptBox(o){
  const G = firmGroups(o);
  const body = G.length>1
    ? '<div class="hint"><b>'+G.length+' firma</b> — hər birinə gəliş günü. Sifariş firmalar üzrə bölünəcək.</div>'+
      G.map((g,k)=>'<div class="fgrp"><div class="pn"><b>'+(g.firm?esc(g.firm):"Firmasız (sürücü alır)")+'</b><span class="meta">'+g.idx.length+' mal: '+esc(g.idx.slice(0,4).map(i=>pname(o.items[i].pid)).join(", "))+(g.idx.length>4?"…":"")+'</span></div>'+
        '<input type="date" id="geta-'+o.id+'-'+k+'" value="'+(o.eta||plusDays(1))+'" aria-label="Gəliş tarixi"></div>').join("")
    : '<datalist id="flist">'+S.firms.map(f=>'<option value="'+esc(f)+'">').join("")+'</datalist>'+
      '<input id="sup-'+o.id+'" list="flist" placeholder="Firma və ya sürücü" value="'+esc(guessFirm(o))+'"><input type="date" id="eta-'+o.id+'" value="'+(o.eta||plusDays(1))+'" aria-label="Gəliş tarixi">';
  return '<div class="box"><div class="lbl">Nə vaxt gələcək?</div>'+body+'<input id="spn-'+o.id+'" placeholder="Anbara qeyd (məs. bulğur 2 gün gec gələcək)"><button class="pri big" data-act="accept" data-id="'+o.id+'">✓ OK · Anbar gözləsin</button></div>';
}

// ----- Excel-dən sifariş -----
// İki cür vərəq tanınır:
//  1) "Məhsul | Sifariş" başlıqlı bloklar (gündəlik vərəqlər), blokun üstündə firma adı;
//  2) sütun cütləri "ad | miqdar" (həftəlik vərəq): miqdarı boş olan sətir firma başlığıdır.
const normName = n => String(n).toLowerCase().replace(/i̇/g,"i").replace(/\s+/g," ").trim();
const normQty = q => String(q).trim().replace(/^(\d+(?:[.,]\d+)?)\s*([^\d\s.,].*)$/,"$1 $2");
const findFirm = h => { const n = normName(h); return n ? S.firms.find(f=>normName(f).startsWith(n) || n.startsWith(normName(f))) || "" : ""; };
function parseOrderSheet(ws){
  const A = XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
  const txt = v => String(v??"").trim();
  const out = [];
  const heads = [];
  A.forEach((row,r)=>row.forEach((v,c)=>{ if (normName(v)==="məhsul") heads.push([r,c]); }));
  if (heads.length){
    heads.forEach(([r,c])=>{
      const firm = findFirm(txt((A[r-1]||[])[c]));
      for (let rr=r+1; A[rr] && txt(A[rr][c]); rr++){
        const n = txt(A[rr][c]), q = txt(A[rr][c+1]);
        if (normName(n)==="məhsul") break;
        if (q) out.push({name:n, qty:normQty(q), firm});
      }
    });
  } else {
    const W = Math.max(0,...A.map(r=>r.length));
    for (let c=0; c<W; c+=2){
      let firm = "";
      A.forEach(row=>{ const n = txt(row[c]), q = txt(row[c+1]);
        if (!n) return;
        if (!q){ firm = findFirm(n); return; }
        out.push({name:n, qty:normQty(q), firm});
      });
    }
  }
  return out;
}

  if (o.state==="busy") return '<div class="imp"><div>📷 <b>'+o.n+' şəkil oxunur...</b> Məhsullar bir az sonra aşağıya yazılacaq (adətən 10–40 saniyə).</div></div>';

}
async function addDraftFiles(list){
  for (const f of list){

      let wb;

      draft.wb = wb;

// Seçilmiş vərəqi məhsullar siyahısına yaz və faylı sifarişə qoş (böyük fayldan yalnız bu vərəq saxlanılır)
function applySheet(){
  const rows = parseOrderSheet(draft.wb.Sheets[draft.sheet]);
  draft.items = draft.items.filter(i=>i.src!=="xls" && (i.pid || (i.pname||"").trim()));
  rows.forEach(r=>{ const pid = pidByName(r.name); draft.items.push({pid, pname:r.name, qty:r.qty, imp:true, src:"xls", firm:r.firm}); });
  if (!draft.items.length) draft.items = [{pid:"",qty:""}];
  if (/həftəlik/i.test(draft.sheet)) draft.type = "Həftəlik";
  draft.files = draft.files.filter(x=>!x.xls);
  let att;
  if (draft.xls.size <= MAXF && draft.xls.sheets.length===1){
    att = { name:draft.xls.name, size:draft.xls.size, data:"data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,"+XLSX.write(draft.wb,{type:"base64",bookType:"xlsx"}) };
  } else {
    const one = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(one, draft.wb.Sheets[draft.sheet], draft.sheet.slice(0,31));
    const b64 = XLSX.write(one,{type:"base64",bookType:"xlsx"});
    att = { name:draft.xls.name.replace(/\.[^.]+$/,"")+" — "+draft.sheet+".xlsx", size:Math.round(b64.length*3/4), data:"data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,"+b64 };
  }
  draft.files.push({...att, xls:true, by:role, at:new Date().toISOString()});
  toast(rows.length+" məhsul Excel-dən yazıldı");
}

function shrink(file, max){
  return new Promise(res=>{
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, (max||640)/Math.max(img.width,img.height)); const c = document.createElement("canvas");
      c.width = img.width*k; c.height = img.height*k; c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.7)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

function filterRows(el){

  if ($("cN") && el.id==="cQ") $("cN").textContent = n+" məhsul";
}

$("main").addEventListener("click", e => {
  const t = e.target.closest("button,[data-dsel]");
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.go){ const [tb,f]=d.go.split(":"); tab=tb; if (f){ filter=f; RF=RT=""; } render(); return; }

  // Keyfiyyət
  if (d.qc){ const [o,i]=itemOf(d.qc); return keep(()=>{ i.qc = i.qc===d.v ? null : d.v; if (i.qc!=="bad") delete i.qcWhy; else if (!i.qcWhy) i.qcWhy = QC_WHY[0]; }); }
  if (d.qcwhy){ const [o,i]=itemOf(d.qcwhy); return keep(()=>{ i.qcWhy = d.v; }); }
  // Anbar
  if (d.tech){ const [o,i]=itemOf(d.tech); return keep(()=>{ i.tech = !i.tech; }); }
  if (d.full){ const el=$("got-"+d.full); el.value = d.q; paintGot(el); saveGot(el); return; }
  // Texnoloq
  if (d.techres){ const [o,i]=itemOf(d.techres); const note=($("tn-"+d.techres)||{}).value||"";

  if (d.nt){ draft.type=d.nt; render(); return; }
  if (d.del){ draft.items.splice(Number(d.del),1); if(!draft.items.length) draft.items=[{pid:"",qty:""}]; render(); return; }

  if (d.addopen){ addDraft[d.addopen] = [{n:"",q:""}]; render(); return; }
  if (d.addmore){ addDraft[d.addmore].push({n:"",q:""}); render(); return; }
  if (d.addrow){ const [id,k]=d.addrow.split("-"); addDraft[id].splice(Number(k),1); if (!addDraft[id].length) addDraft[id].push({n:"",q:""}); render(); return; }
  if (d.addcancel){ delete addDraft[d.addcancel]; render(); return; }
  if (d.addsend) return addSend(Number(d.addsend));
  // Kataloq, fayllar
  if (d.catfirm){ catFirm=d.catfirm; catQ=""; render(); $("cF").scrollIntoView({block:"start"}); return; }
  if (d.unfirm) return unFirm(Number(d.unfirm));
  if (t.id==="ffAdd") return addToFirm();
  if (d.zoom){ openZoom(d.zoom); return; }
  if (d.view){ const [k,i]=d.view.split(":"); viewSheet(k,Number(i)); return; }
  if (d.fdel){ draft.files.splice(Number(d.fdel),1); render(); return; }
  if (d.pdel) return sure(t, ()=>delProduct(Number(d.pdel)));
  if (d.fmdel) return sure(t, ()=>delFirm(d.fmdel));
  if (t.id==="fAdd") return addFirm();
  if (t.id==="pAdd") return addProduct();
  if (t.id==="install"){ installEvt && installEvt.prompt(); return; }
  if (t.id==="notif"){ try { Notification.requestPermission().then(()=>render()); } catch(e){} return; }
  if (t.id==="reset"){ if (d.sure){ S=seed(); save(); draft=newDraft(); render(); toast("Bütün sifarişlər silindi"); } else { d.sure=1; t.textContent="Əminsiniz? Yenidən basın"; } return; }
  if (d.act) orderAct(d.act, Number(d.id));
});

function orderAct(act, id){
  const o = S.orders.find(x=>x.id===id); if (!o) return;
  const v = k => ($(k+"-"+id)||{}).value || "";
  if (act==="comment"){ const t=v("c").trim(); if(!t) return; o.comments.push({by:role,text:t,at:new Date().toISOString()}); addLog(o,"Şərh",t); }
  else if (act==="accept") return acceptOrder(o);
  else if (act==="qcall"){ o.items.forEach(i=>{ if (!i.qc) i.qc="ok"; }); return keep(()=>{}); }
  else if (act==="arrived"){
    o.status = "anbar"; o.arrivedAt = o.last_move = new Date().toISOString();
    addLog(o,"Mal gəldi","");
    if (hasQC(o)) notify(["Keyfiyyət"], "arr", "#"+o.id+" gəldi · yoxlayın", (o.supplier||"Firmasız")+" → "+o.wh+" · "+o.items.length+" mal", [], o.id);
    toast(hasQC(o) ? "Keyfiyyətə xəbər getdi · gələn miqdarı yazın" : "Gələn miqdarı yazın");
  }
  else if (act==="qcdone"){
    if (!qcDone(o)) return toast("Bütün malları yoxlayın");
    o.qcAt = o.last_move = new Date().toISOString();
    const bad = o.items.filter(i=>i.qc!=="ok");
    addLog(o,"Keyfiyyət yoxladı", bad.length ? bad.map(i=>pname(i.pid)+": "+(i.qc==="bad"?i.qcWhy:"gəlmədi")).join("; ") : "Hamısı uyğundur");
    toast("Yoxlama bitdi · Anbar qəbulu bitirə bilər");
  }
  else if (act==="allfull"){ return keep(()=>{ o.items.forEach(i=>{ if (i.qc!=="bad" && i.qc!=="none") i.got = num(i.qty); }); }); }
  else if (act==="receive"){
    if (hasQC(o) && !o.qcAt) return toast("Keyfiyyət hələ yoxlamayıb");
    o.items.forEach((i,k)=>{ const el=$("got-"+id+"-"+k); if (el && el.value!=="") i.got = Math.max(0,num(el.value)); });
    const n = finishReceive(o, role, v("rn"));
    const c = {ok:0,warn:0,bad:0}; o.items.forEach(i=>{ const k=itemCat(itemState(o,i)); if (c[k]!=null) c[k]++; });
    notify(["Satınalma",o.from,"Rəhbərlik"], "res", "#"+o.id+" qəbul olundu", [c.ok?c.ok+" tam":"", c.warn?c.warn+" az":"", c.bad?c.bad+" qəbul olunmadı / gəlmədi":""].filter(Boolean).join(" · ")+(n?" · cavabınız lazımdır":""),
      o.items.filter(i=>problem(o,i)).map(i=>pname(i.pid)+": "+problem(o,i)), o.id);
    toast(n ? n+" mal üçün Satınalma cavab verəcək" : "Hamısı qəbul olundu ✓");
  }
  else if (act==="cancel"){ o.status="redd"; addLog(o,"Rəhbərlik ləğv etdi",""); }
  save(); render();
}

// ----- Admin: kataloq əməliyyatları -----
function sure(btn, fn){
  if (btn.dataset.sure) return fn();
  btn.dataset.sure = 1; btn.textContent = "Əminsiniz?";
  setTimeout(()=>{ if (btn.isConnected){ delete btn.dataset.sure; btn.textContent = btn.dataset.pdel ? "Sil" : "×"; } }, 4000);
}
const now = () => new Date().toISOString();
function addProduct(){
  if (role!=="Admin") return;
  const name=$("pN").value.trim(); if(!name) return toast("Məhsulun adını yazın");
  if (pidByName(name)) return toast("Bu məhsul artıq kataloqdadır");
  const p={id:newPid(),name,firm:$("pF").value};
  S.products.push(p); S.log.push({by:role,act:"Kataloqa məhsul əlavə edildi",note:name+(p.firm?" · "+p.firm:""),at:now()});
  save(); render(); toast(name+" əlavə olundu");
}
// Ad dəyişəndə köhnə sifarişlərdə də yeni ad görünür (sifariş məhsulu nömrə ilə saxlayır)
function renameProduct(el){
  const p = prod(el.dataset.pname), name = el.value.trim();
  if (!name){ el.value = p.name; return toast("Ad boş ola bilməz"); }
  if (name === p.name) return;
  const other = pidByName(name);
  if (other && other !== p.id){ el.value = p.name; return toast("“"+name+"” adlı məhsul artıq var"); }
  S.log.push({by:role,act:"Məhsulun adı dəyişdirildi",note:p.name+" → "+name,at:now()});
  p.name = name; save();
  el.value = name; el.closest("tr").dataset.s = name.toLowerCase();
  toast("Ad dəyişdirildi: "+name);
}
// Silinən məhsul köhnə sifarişlərdə adı ilə qalır, sadəcə yeni sifarişdə seçilmir
function delProduct(id){
  if (role!=="Admin") return;
  const p=prod(id); p.deleted=true;
  S.log.push({by:role,act:"Məhsul kataloqdan silindi",note:p.name,at:now()});
  save(); render(); toast(p.name+" silindi");
}
function unFirm(id){
  if (role!=="Admin") return;
  const p=prod(id), f=p.firm; p.firm="";
  S.log.push({by:role,act:"Məhsul firmadan çıxarıldı",note:p.name+" · "+f,at:now()});
  save(); render(); toast(p.name+" artıq "+f+" firmasından gəlmir");
}
function addToFirm(){
  if (role!=="Admin") return;
  const name=$("ffN").value.trim(); if (!name) return toast("Məhsulun adını yazın və ya seçin");
  const id=pidByName(name);
  if (id){ const p=prod(id), old=p.firm; p.firm=catFirm; S.log.push({by:role,act:"Məhsul firmaya əlavə edildi",note:p.name+" · "+(old||"firmasız")+" → "+catFirm,at:now()}); toast(p.name+" → "+catFirm); }
  else { const p={id:newPid(),name,firm:catFirm,size:guessSize(name)}; S.products.push(p); S.log.push({by:role,act:"Kataloqa məhsul əlavə edildi",note:name+" · "+catFirm,at:now()}); toast("Yeni məhsul: "+name+" · "+catFirm); }
  save(); render();
}
function addFirm(){
  if (role!=="Admin") return;
  const f=$("fN").value.trim(); if(!f) return toast("Firmanın adını yazın");
  if (S.firms.some(x=>x.toLowerCase()===f.toLowerCase())) return toast("Bu firma artıq var");
  S.firms.push(f); S.firms.sort((a,b)=>a.localeCompare(b,"az"));
  S.log.push({by:role,act:"Firma əlavə edildi",note:f,at:now()});
  save(); render(); toast(f+" əlavə olundu");
}
function delFirm(f){
  if (role!=="Admin") return;
  S.firms = S.firms.filter(x=>x!==f);
  if (catFirm===f) catFirm="";
  S.products.forEach(p=>{ if (p.firm===f) p.firm=""; });
  S.log.push({by:role,act:"Firma silindi",note:f,at:now()});
  save(); render(); toast(f+" silindi");
}
